<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marvia</title>
<style>
  /* Шрифты свои, вшитые в программу, — те же, что у панели. Системный
     Segoe UI не совпал бы с макетом ни в одной строке, а тянуть шрифт из
     сети окно не вправе: оно и так знает о человеке больше, чем нужно. */
  @font-face { font-family: Onest; src: url(fonts/onest-latin.woff2) format('woff2');
    font-weight: 300 700; font-display: swap; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+2122, U+2212; }
  @font-face { font-family: Onest; src: url(fonts/onest-cyrillic.woff2) format('woff2');
    font-weight: 300 700; font-display: swap; unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
  @font-face { font-family: 'JetBrains Mono'; src: url(fonts/jetbrains-latin.woff2) format('woff2');
    font-weight: 400 700; font-display: swap; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+2122, U+2212; }
  @font-face { font-family: 'JetBrains Mono'; src: url(fonts/jetbrains-cyrillic.woff2) format('woff2');
    font-weight: 400 700; font-display: swap; unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
  @font-face { font-family: Unbounded; src: url(fonts/unbounded-latin.woff2) format('woff2');
    font-weight: 400 800; font-display: swap; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+2122, U+2212; }
  @font-face { font-family: Unbounded; src: url(fonts/unbounded-cyrillic.woff2) format('woff2');
    font-weight: 400 800; font-display: swap; unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
  @font-face { font-family: Manrope; src: url(fonts/manrope-latin.woff2) format('woff2');
    font-weight: 400 700; font-display: swap; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+2122, U+2212; }
  @font-face { font-family: Spectral; src: url(fonts/spectral-600-latin.woff2) format('woff2');
    font-weight: 600; font-display: swap; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+2122, U+2212; }
  @font-face { font-family: Spectral; src: url(fonts/spectral-600-cyrillic.woff2) format('woff2');
    font-weight: 600; font-display: swap; unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
  @font-face { font-family: Spectral; src: url(fonts/spectral-400-latin.woff2) format('woff2');
    font-weight: 400; font-display: swap; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+2122, U+2212; }
  @font-face { font-family: Spectral; src: url(fonts/spectral-400-cyrillic.woff2) format('woff2');
    font-weight: 400; font-display: swap; unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
  @font-face { font-family: Manrope; src: url(fonts/manrope-cyrillic.woff2) format('woff2');
    font-weight: 400 700; font-display: swap; unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }

  /* Шрифты образов в духе систем: Inter — вместо SF у macOS и как основа
     Adwaita Sans у GNOME, Noto Sans — у KDE, Ubuntu — свой у Ubuntu. Все
     свободные (OFL и Ubuntu Font Licence), вшиты, как остальные. Шрифты
     Windows — Segoe UI, Tahoma, MS Sans Serif — уже есть в системе. */
  @font-face { font-family: Inter; src: url(fonts/inter-latin.woff2) format('woff2');
    font-weight: 400 700; font-display: swap; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+2122, U+2212; }
  @font-face { font-family: Inter; src: url(fonts/inter-cyrillic.woff2) format('woff2');
    font-weight: 400 700; font-display: swap; unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
  @font-face { font-family: 'Noto Sans'; src: url(fonts/noto-latin.woff2) format('woff2');
    font-weight: 400 700; font-display: swap; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+2122, U+2212; }
  @font-face { font-family: 'Noto Sans'; src: url(fonts/noto-cyrillic.woff2) format('woff2');
    font-weight: 400 700; font-display: swap; unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
  @font-face { font-family: Ubuntu; src: url(fonts/ubuntu-400-latin.woff2) format('woff2');
    font-weight: 400; font-display: swap; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+2122, U+2212; }
  @font-face { font-family: Ubuntu; src: url(fonts/ubuntu-400-cyrillic.woff2) format('woff2');
    font-weight: 400; font-display: swap; unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
  @font-face { font-family: Ubuntu; src: url(fonts/ubuntu-700-latin.woff2) format('woff2');
    font-weight: 600 700; font-display: swap; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+2122, U+2212; }
  @font-face { font-family: Ubuntu; src: url(fonts/ubuntu-700-cyrillic.woff2) format('woff2');
    font-weight: 600 700; font-display: swap; unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }

  /*
    Цвета не написаны здесь ни разу: все они — переменные, которые ставит
    тема (Look.vars) на корневой элемент. Запасные значения ниже — вид «Серый»
    из коробки, чтобы страница не мигнула чёрным до первого скрипта.
  */
  :root {
    --bg: #0c0e11; --lit: #43474c; --mid: #24272a; --shade: #050608;
    --surf: #313437; --surf2: #404346; --line: #4b4e50;
    --fg: #f1f4f7; --dim: #b3b6b9; --acc: #c3ccd6; --accFg: #08110d;
    --accSoft: rgba(195,204,214,0.14); --accRgb: 195,204,214;
    --warn: #f2a03d; --fail: #ff6b7a;
    --bgcss: linear-gradient(135deg, #43474c 0%, #24272a 52%, #050608 100%);
    --cardLine: var(--line); --cardShadow: none; --glow: none; --glowA: 0.2;
    --r: 14px; --pad: 16px; --gap: 12px;
    --mono: 'JetBrains Mono', ui-monospace, Consolas, monospace;
    --display: Unbounded, Onest, system-ui, sans-serif;
    --ease: cubic-bezier(.2,.8,.2,1);
  }

  * { box-sizing: border-box; }

  /* Атрибут hidden обязан побеждать любой display: иначе «скрытое» поле
     ключа торчит на главном экране у того, у кого ключ давно есть. */
  [hidden] { display: none !important; }

  html, body {
    height: 100%; margin: 0;
    background: var(--bgcss, var(--bg)); color: var(--fg);
    font: 14px/1.5 Onest, "Segoe UI", system-ui, sans-serif;
    user-select: none; overflow: hidden;
    -webkit-font-smoothing: antialiased;
    transition: color .35s;
  }
  /* Едва заметная точечная сетка из цвета текста — фон перестаёт быть
     пустым, но не спорит с контентом. Та же, что на телефоне. */
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background: radial-gradient(rgba(var(--accRgb), 0.06) 1px, transparent 1.5px) 0 0 / 22px 22px;
  }
  button { font-family: inherit; }
  button:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
  /* WebView2 otherwise paints bright Windows scrollbars across dark themes. */
  * { scrollbar-color: var(--line) transparent; scrollbar-width: thin; }
  *::-webkit-scrollbar { width: 8px; height: 8px; }
  *::-webkit-scrollbar-track { background: transparent; }
  *::-webkit-scrollbar-thumb { background: var(--line); border: 2px solid transparent; border-radius: 8px; background-clip: padding-box; }
  *::-webkit-scrollbar-thumb:hover { background-color: var(--dim); }
  *::-webkit-scrollbar-button { display: none; }

  .app { position: relative; z-index: 1; display: flex; flex-direction: column; height: 100%; }

  /* ------------------------------------------------------------- шапка */

  .top {
    height: 44px; flex: none;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 16px; border-bottom: 1px solid var(--line);
    background: rgba(var(--accRgb), 0.04);
  }
  .brand { display: flex; align-items: center; gap: 10px; }

  /* Змейка: поверх окна, в цветах образа. */
  .snake { position: fixed; inset: 0; z-index: 90; display: grid; place-items: center; background: color-mix(in srgb, var(--bg) 70%, transparent); }
  .snake[hidden] { display: none; }
  .snake-box { display: flex; flex-direction: column; gap: 10px; padding: 16px; border-radius: calc(var(--r) + 4px);
    background: var(--surf); border: 1px solid var(--line); box-shadow: 0 30px 80px -30px rgba(0,0,0,.6); }
  .snake-head { display: flex; align-items: center; gap: 14px; }
  .snake-head b { font-size: 16px; }
  .snake-head .mono { flex: 1; color: var(--dim); font-size: 13px; }
  #snake-board { width: 640px; height: 440px; border-radius: var(--r); background: var(--bg); display: block; }
  .snake .hint { font-size: 12px; color: var(--dim); text-align: center; }

  /*
    Знак — объёмная лента-«M», и красится она темой, оставаясь металлом. Два
    слоя: нижний — сам знак, обесцвеченный в нейтральный металл; верхний —
    заливка акцентом со смешением mix-blend-mode: color, которое берёт из
    акцента тон, а свет и тень — у металла снизу. Тот же приём в панели.
  */
  :root { --mark-img: url("assets/marvia-mark.png"); --word-img: url("assets/marvia-word.svg"); }
  .logo { position: relative; display: inline-block; flex: none; width: 24px; height: 24px; isolation: isolate;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,.4)); }
  .logo::before, .logo::after { content: ""; position: absolute; inset: 0; }
  .logo::before {
    background: var(--mark-img) center / contain no-repeat;
    filter: grayscale(1) contrast(1.03) brightness(1.02);
  }
  .logo::after {
    background: var(--acc, transparent);
    mix-blend-mode: color;
    -webkit-mask: var(--mark-img) center / contain no-repeat;
            mask: var(--mark-img) center / contain no-repeat;
  }
  .wordmark {
    display: block; height: 14px; aspect-ratio: 614 / 144; font-size: 0;
    background: var(--fg);
    -webkit-mask: var(--word-img) center / contain no-repeat;
            mask: var(--word-img) center / contain no-repeat;
  }
  .ver { font-family: var(--mono); font-size: 10px; color: var(--dim); }
  .top button.lang {
    background: none; border: 1px solid var(--line); color: var(--dim);
    font: inherit; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 8px; cursor: pointer;
    transition: color .3s, border-color .3s;
  }
  .top button.lang:hover { color: var(--fg); border-color: var(--acc); }

  .body { flex: 1; display: flex; min-height: 0; }

  /* ------------------------------------------------------------ боковая */

  aside {
    width: 212px; flex: 0 0 212px;
    background: rgba(var(--accRgb), 0.04); border-right: 1px solid var(--line);
    padding: 14px 12px; display: flex; flex-direction: column; gap: 4px;
  }
  .tab {
    display: flex; align-items: center; gap: 10px;
    min-height: 40px; padding: 0 10px; border-radius: min(var(--r), 12px);
    color: var(--dim); cursor: pointer; border: none; background: none; width: 100%;
    font: inherit; font-size: 14px; font-weight: 500; text-align: left;
    transition: background .35s var(--ease), color .35s;
  }
  .tab svg { width: 18px; height: 18px; flex: none; color: var(--dim); transition: color .35s; }
  .tab:hover { color: var(--fg); }
  .tab[aria-selected="true"] { background: var(--accSoft); color: var(--fg); font-weight: 700; }
  .tab[aria-selected="true"] svg { color: var(--acc); }
  .tab .news { display: none; width: 7px; height: 7px; border-radius: 50%; background: var(--warn); margin-left: auto; }
  .tab.news .news { display: block; }
  .spacer { flex: 1; }

  .sub-card {
    padding: 12px; border-radius: var(--r);
    background: var(--surf); border: 1px solid var(--cardLine); box-shadow: var(--cardShadow);
    display: flex; flex-direction: column; gap: 8px;
  }
  .sub-card .t { font-size: 13px; font-weight: 600; color: var(--fg); display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .sub-card .t::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--line); flex: none; }
  body[data-state="connected"] .sub-card .t::after { background: var(--acc); box-shadow: 0 0 8px var(--acc); }
  .sub-card .s { font-family: var(--mono); font-size: 10px; color: var(--dim); line-height: 1.5; }
  .about-link {
    display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px;
    border: 0; background: transparent; color: var(--dim); font: inherit; font-size: 12px; cursor: pointer; text-align: left;
    transition: color .3s;
  }
  .about-link:hover { color: var(--fg); }
  .about-link .logo { width: 16px; height: 16px; opacity: .85; filter: none; }

  /* ---------------------------------------------------------- основное */

  main { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; padding: 22px 26px; overflow: hidden; }
  .head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 16px; flex: none; }
  .head .title { font-size: 22px; font-weight: 700; letter-spacing: -.01em; color: var(--fg); }
  .head .sub { font-size: 13px; color: var(--dim); margin-top: 2px; }
  .page { display: none; flex: 1; min-height: 0; flex-direction: column; gap: var(--gap); animation: rise .5s var(--ease) both; }
  .page[data-open] { display: flex; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .scroll { overflow-x: hidden; overflow-y: auto; min-height: 0; }

  .card {
    padding: var(--pad); border-radius: var(--r);
    background: var(--surf); border: 1px solid var(--cardLine); box-shadow: var(--cardShadow);
    display: flex; flex-direction: column; gap: 10px; min-width: 0;
  }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .card b { font-size: 14px; font-weight: 600; color: var(--fg); }
  .k { font-family: var(--mono); font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--dim); }
  .hint { font-size: 12px; line-height: 1.5; color: var(--dim); }
  .hint.bad, .bad { color: var(--fail); }
  .lead { margin: 0; font-size: 13px; line-height: 1.55; color: var(--dim); }
  .mono { font-family: var(--mono); font-size: 12px; color: var(--dim); }
  .split { display: flex; gap: var(--gap); flex: 1; min-height: 0; }
  .split > .wide { flex: 1; min-width: 0; }
  .col { display: flex; flex-direction: column; gap: var(--gap); min-width: 0; }

  .chip, .pillb {
    min-height: 36px; padding: 0 12px; border-radius: min(var(--r), 12px); cursor: pointer;
    font: inherit; font-size: 13px; font-weight: 600;
    background: var(--surf); border: 1px solid var(--line); color: var(--fg);
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    transition: background .35s var(--ease), border-color .35s, color .35s, transform .3s var(--ease);
  }
  .chip:hover, .pillb:hover { border-color: var(--acc); }
  .chip:active, .pillb:active { transform: scale(.97); }
  .chip[aria-pressed="true"], .pillb[aria-pressed="true"] { background: var(--accSoft); border-color: var(--acc); color: var(--fg); }
  .chip[disabled] { opacity: .5; cursor: default; }
  .primary {
    min-height: 40px; padding: 0 16px; border-radius: min(var(--r), 12px); border: 0; cursor: pointer;
    font: inherit; font-size: 13px; font-weight: 700; background: var(--acc); color: var(--accFg);
    box-shadow: var(--glow); transition: transform .3s var(--ease), box-shadow .4s;
  }
  .primary:active { transform: scale(.97); }
  .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  textarea, input.code-in {
    width: 100%; padding: 10px 12px; border-radius: min(var(--r), 12px); resize: none;
    background: var(--shade); border: 1px solid var(--line); color: var(--fg);
    font-family: var(--mono); font-size: 12px; outline: none; user-select: text;
  }
  textarea:focus, input.code-in:focus { border-color: var(--acc); }
  .warn {
    padding: 10px 14px; border-radius: min(var(--r), 12px);
    background: rgba(242,160,61,.12); border: 1px solid rgba(242,160,61,.5); color: var(--warn); font-size: 13px;
  }
  .badge { padding: 4px 10px; border-radius: 999px; background: var(--surf2); color: var(--dim); font-size: 12px; font-weight: 600; white-space: nowrap; }
  .badge.on { background: var(--accSoft); color: var(--acc); }
  .track { height: 5px; border-radius: 999px; background: var(--shade); overflow: hidden; }
  .track i { display: block; height: 100%; border-radius: 999px; background: var(--acc); transition: width .6s var(--ease); }

  /* ----------------------------------------------------------- главная */

  .hero { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; min-width: 0; }
  .ring { position: relative; width: 250px; height: 250px; display: flex; align-items: center; justify-content: center; flex: none; }
  /* Дуга вокруг кнопки: разрыв внизу справа, градиент от акцента к прозрачному.
     Пока подключаемся — короткая и крутится; выключено — гаснет в линию. */
  .ring > svg { position: absolute; inset: 0; pointer-events: none; width: 100%; height: 100%; transform: rotate(90deg); overflow: visible; }
  .ring circle { fill: none; stroke: url(#arcGrad); stroke-width: 3; stroke-linecap: round;
    stroke-dasharray: 653 0; transition: stroke-dasharray .7s var(--ease); }
  .ring .arc-a { stop-color: var(--line); }
  .ring .arc-b { stop-color: var(--line); stop-opacity: .3; }
  body[data-state="connected"] .ring circle, body[data-state="stalled"] .ring circle { stroke-dasharray: 490 163; }
  body[data-state="connected"] .ring .arc-a { stop-color: var(--acc); }
  body[data-state="connected"] .ring .arc-b { stop-color: var(--acc); stop-opacity: .12; }
  body[data-state="stalled"] .ring .arc-a { stop-color: var(--warn); }
  body[data-state="connecting"] .ring circle, body[data-state="disconnecting"] .ring circle { stroke-dasharray: 160 493; }
  body[data-state="connecting"] .ring .arc-a, body[data-state="disconnecting"] .ring .arc-a { stop-color: var(--dim); }
  body[data-state="connecting"] .ring > svg, body[data-state="disconnecting"] .ring > svg { animation: spin 1.4s linear infinite; }
  body[data-state="disconnecting"] .ring > svg { animation-direction: reverse; }
  @keyframes spin { to { transform: rotate(450deg); } }

  .power {
    position: relative; z-index: 1;
    width: 200px; height: 200px; border-radius: 50%; border: 0; cursor: pointer; padding: 0;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 38% 30%, var(--surf2) 0%, var(--surf) 55%, var(--shade) 100%);
    box-shadow: inset 0 0 0 1px var(--line), 0 24px 48px rgba(0,0,0,.45);
    transition: box-shadow .6s var(--ease), background .6s, transform .3s var(--ease);
  }
  .power:active { transform: scale(.97); }
  .power[disabled] { cursor: default; opacity: .6; }
  .power svg { width: 64px; height: 64px; color: var(--dim); transition: color .4s; }
  /* Подключено: диск объёмный, подсвечен акцентом изнутри и вокруг; вариант — из темы. */
  .power[data-state="connected"], .power[data-state="stalled"] {
    box-shadow: inset 0 0 0 1px rgba(var(--accRgb), .22), inset 0 -20px 40px rgba(var(--accRgb), .10), var(--glow), 0 24px 48px rgba(0,0,0,.5);
  }
  .power[data-state="connected"] svg { color: var(--acc); }
  .power[data-state="stalled"] svg { color: var(--warn); }
  .power[data-state="connecting"] svg, .power[data-state="disconnecting"] svg { color: var(--dim); }
  .power[data-state="connected"][data-btn="solid"] {
    /* Блик — отдельным слоем над цветом: полупрозрачный белый в той же
       градиентной полосе ложился на пустоту и давал серое пятно. */
    background: radial-gradient(circle at 38% 30%, rgba(255,255,255,.34), transparent 58%), var(--acc);
    box-shadow: inset 0 -14px 30px rgba(0,0,0,.18), var(--glow), 0 24px 48px rgba(0,0,0,.5);
  }
  .power[data-state="connected"][data-btn="solid"] svg { color: var(--accFg); }
  .power[data-state="connected"][data-btn="glass"] {
    background: rgba(var(--accRgb), .16);
    box-shadow: inset 0 0 0 1px rgba(var(--accRgb), .45), inset 0 -20px 40px rgba(var(--accRgb), .12), var(--glow), 0 24px 48px rgba(0,0,0,.5);
  }
  .power[data-state="connected"][data-btn="bare"] { background: transparent; box-shadow: inset 0 0 0 1.5px var(--acc), 0 24px 48px rgba(0,0,0,.5); }

  .status { font-size: 28px; font-weight: 700; letter-spacing: -.01em; color: var(--dim); transition: color .4s; text-align: center; }
  body[data-state="connected"] .status { color: var(--acc); }
  body[data-state="stalled"] .status, body[data-state="failed"] .status { color: var(--warn); }
  .detail { font-family: var(--mono); font-size: 13px; letter-spacing: .04em; color: var(--dim); text-align: center; max-width: 420px; }
  .detail.bad { color: var(--fail); }
  .quick { display: flex; gap: 10px; margin-top: 6px; flex-wrap: wrap; justify-content: center; }
  .quick .chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); transition: background .3s, box-shadow .3s; }
  .quick .chip[aria-pressed="true"] .dot { background: var(--acc); box-shadow: 0 0 8px rgba(var(--accRgb), .7); }
  .first-key { width: 100%; max-width: 460px; display: flex; flex-direction: column; gap: 10px; }

  /* «Где вы» и подписка — две карточки рядом под состоянием. */
  .home-info { width: 100%; max-width: 560px; display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: var(--gap); }
  .hcard { padding: 14px 16px; min-width: 0; text-align: left; color: var(--fg); font: inherit; }
  .hcard.place { display: flex; flex-direction: row; align-items: center; gap: 12px; cursor: pointer; transition: border-color .3s var(--ease), transform .3s var(--ease); }
  .hcard.place:hover { border-color: color-mix(in srgb, var(--acc) 55%, var(--line)); transform: translateY(-1px); }
  .hc-code { flex: none; width: 44px; height: 44px; border-radius: min(var(--r), 12px); display: grid; place-items: center;
    font-family: var(--mono); font-size: 15px; font-weight: 800; letter-spacing: .04em; background: color-mix(in srgb, var(--acc) 14%, transparent); color: var(--acc); }
  .hc-text { display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1; }
  .hcard .name { font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hcard .sub { font-size: 12px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hc-q { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
  .hc-q small { font-size: 11px; color: var(--dim); }
  .hc-ping { font-family: var(--mono); font-size: 13px; font-weight: 700; color: var(--dim); }
  /* Отклик цветом по качеству, как в списке стран: зелёный не акцент —
     у графита акцент серый. */
  .hcard.place[data-q="fast"] .hc-ping { color: #2fb36b; }
  .hcard.place[data-q="mid"] .hc-ping { color: var(--warn); }
  .hcard.place[data-q="slow"] .hc-ping { color: var(--fail); }
  .hcard.plan { display: flex; flex-direction: column; gap: 6px; }
  .hcard.plan .k { font-size: 12px; color: var(--dim); }
  .hc-days { display: flex; align-items: baseline; gap: 8px; }
  .hc-days b { font-family: var(--mono); font-size: 26px; line-height: 1; letter-spacing: -.02em; }
  .hc-days span { font-size: 12px; color: var(--dim); }
  .hcard.plan[data-soon] .hc-days b { color: var(--warn); }
  .hcard.plan .track { margin-top: 2px; }
  .hcard.plan[data-nolimit] .track { display: none; }

  .node {
    display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: var(--r);
    background: var(--surf); border: 1px solid var(--cardLine); box-shadow: var(--cardShadow); width: 100%; max-width: 460px;
  }
  .node .mark { width: 8px; height: 8px; border-radius: 50%; background: var(--line); flex: none; transition: background .3s; }
  body[data-state="connected"] .node .mark { background: var(--acc); box-shadow: 0 0 8px var(--acc); }
  .node .name { font-size: 14px; font-weight: 600; color: var(--fg); }
  .node .sub { font-family: var(--mono); font-size: 11px; color: var(--dim); }
  .node > div { flex: 1; min-width: 0; }
  .node .ping { font-family: var(--mono); font-size: 13px; font-weight: 700; color: var(--acc); }

  .side { width: 380px; flex: 0 0 380px; display: flex; flex-direction: column; gap: var(--gap); min-height: 0; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--dim) transparent; padding-right: 3px; }
  /* Качество связи: отклик последних минут полосками */
  .kpi.quality .q-bars { display: flex; align-items: flex-end; gap: 1px; height: 22px; margin-top: 6px; }
  .kpi.quality .q-bars:empty { display: none; }
  .kpi.quality .q-bars i { flex: 1; min-width: 2px; border-radius: 1px; background: var(--acc); opacity: .55; transition: height .4s var(--ease); }
  .kpi.quality .q-bars i:last-child { opacity: 1; }
  .kpi.quality .q-bars i[data-lost] { background: var(--fail); opacity: .9; height: 22px !important; width: 2px; }
  .kpi.quality .q-sub { margin-top: 5px; font: 500 11px var(--mono); color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kpi.quality .q-sub[data-bad] { color: var(--warn); }
  /* Проверка через туннель */
  .netcheck { display: flex; flex-direction: column; gap: 10px; }
  .netcheck[hidden] { display: none; }
  .nc-live { width: 8px; height: 8px; border-radius: 50%; background: var(--ok, #6fd39b); box-shadow: 0 0 0 0 rgba(111,211,155,.6); animation: ncPulse 2s ease-out infinite; }
  @keyframes ncPulse { 0% { box-shadow: 0 0 0 0 rgba(111,211,155,.55); } 70% { box-shadow: 0 0 0 8px rgba(111,211,155,0); } 100% { box-shadow: 0 0 0 0 rgba(111,211,155,0); } }
  .nc-where { display: flex; align-items: center; gap: 12px; }
  .nc-where .flag { width: 34px; height: 24px; }
  .nc-addr { display: flex; flex-direction: column; min-width: 0; }
  .nc-addr b { font: 700 17px var(--mono); color: var(--fg); letter-spacing: .02em; }
  .nc-addr small { font-size: 12px; color: var(--dim); }
  .nc-sites { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
  .nc-sites:empty { display: none; }
  .nc-site { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 9px; border-radius: 9px; background: var(--shade); border: 1px solid var(--line); font-size: 12px; animation: ncIn .35s var(--ease) both; }
  .nc-site b { font-weight: 600; color: var(--fg); }
  .nc-site span { font-family: var(--mono); color: var(--dim); }
  .nc-site[data-ok="1"] span { color: var(--ok, #6fd39b); }
  .nc-site[data-ok="0"] span { color: var(--fail); }
  .nc-site[data-wait] span { background: linear-gradient(90deg, var(--line), var(--dim), var(--line)); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: ncShine 1.2s linear infinite; }
  @keyframes ncIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  @keyframes ncShine { from { background-position: 200% 0; } to { background-position: -200% 0; } }
  .nc-act { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .nc-speed { margin-left: auto; font: 700 16px var(--mono); color: var(--acc); }

  /* ───── Диагностика ───── */
  .diag-scroll { flex: 1; padding-right: 4px; scrollbar-width: thin; scrollbar-color: var(--dim) transparent; }
  .diag-grid { display: grid; grid-template-columns: minmax(0, 1.12fr) minmax(0, 1fr); gap: var(--gap); align-items: start; padding-bottom: 14px; }
  .diag-grid > .col > * { animation: arrive .45s var(--ease) both; }
  .diag-grid > .col > *:nth-child(2) { animation-delay: .05s; }
  .diag-grid > .col > *:nth-child(3) { animation-delay: .1s; }
  .diag-grid > .col > *:nth-child(4) { animation-delay: .15s; }
  @media (max-width: 1060px) { .diag-grid { grid-template-columns: minmax(0, 1fr); } }
  .diag-run .card-head { align-items: flex-start; }
  .diag-run .primary { flex: none; }
  .diag-sum { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: min(var(--r), 12px); background: color-mix(in srgb, var(--fg) 5%, transparent); border: 1px solid var(--line); font-size: 13px; font-weight: 600; color: var(--fg); animation: ncIn .35s var(--ease) both; }
  .diag-sum i { width: 10px; height: 10px; border-radius: 50%; background: var(--dim); flex: none; }
  .diag-sum[data-st="ok"] i { background: var(--ok, #6fd39b); box-shadow: 0 0 10px var(--ok, #6fd39b); }
  .diag-sum[data-st="warn"] i { background: var(--warn); }
  .diag-sum[data-st="bad"] i { background: var(--fail); }
  .diag-sum[data-st="run"] i { background: var(--acc); animation: ncPulse 1.4s ease-out infinite; }
  .diag-steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .diag-steps:empty { display: none; }
  .dstep { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; padding: 9px 11px; border-radius: min(var(--r), 12px);
    background: color-mix(in srgb, var(--fg) 4%, transparent); border: 1px solid var(--line); animation: ncIn .35s var(--ease) both; transition: border-color .3s; }
  .dstep .ico { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font: 700 12px var(--mono); color: var(--accFg); background: var(--dim); }
  .dstep[data-st="ok"] .ico { background: var(--ok, #6fd39b); color: #06210f; }
  .dstep[data-st="warn"] .ico { background: var(--warn); color: #2a1700; }
  .dstep[data-st="bad"] .ico { background: var(--fail); color: #2a0006; }
  .dstep[data-st="off"] .ico { background: none; box-shadow: inset 0 0 0 1.5px var(--dim); color: var(--dim); }
  .dstep[data-st="run"] .ico { background: none; box-shadow: inset 0 0 0 2px var(--line); border-top: 2px solid var(--acc); animation: spin .9s linear infinite; }
  .dstep[data-st="bad"] { border-color: color-mix(in srgb, var(--fail) 45%, transparent); }
  .dstep[data-st="warn"] { border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
  .dstep .t { font-size: 13px; font-weight: 600; color: var(--fg); min-width: 0; }
  .dstep .v { font: 500 12px var(--mono); color: var(--dim); text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 240px; }
  .dstep .say { grid-column: 2 / 4; font-size: 12px; line-height: 1.45; color: var(--dim); }
  .dstep .say:empty { display: none; }
  .dstep .acts { grid-column: 2 / 4; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .dstep .acts:empty { display: none; }
  .dstep .acts .chip { min-height: 30px; font-size: 12px; }
  .dstep .acts .chip.lead-act { background: var(--accSoft); border-color: var(--acc); }
  .dstep .acts .said { font-size: 12px; color: var(--acc); }
  .speed-big { display: flex; align-items: baseline; gap: 8px; }
  .speed-big b { font: 700 40px/1 var(--numFont, var(--mono)); color: var(--acc); letter-spacing: -.02em; }
  .speed-big span { font: 500 13px var(--mono); color: var(--dim); }
  .speed-hist { display: flex; align-items: flex-end; gap: 6px; min-height: 0; }
  .speed-hist:empty { display: none; }
  .speed-hist .sh { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; align-items: stretch; animation: ncIn .35s var(--ease) both; }
  .speed-hist .sh i { display: block; height: 4px; border-radius: 3px; background: var(--acc); opacity: .55; transition: height .4s var(--ease); }
  .speed-hist .sh:last-child i { opacity: 1; }
  .speed-hist .sh small { font: 500 10.5px var(--mono); color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; }
  .speed-hist .bars { display: flex; align-items: flex-end; height: 46px; }
  .speed-hist .bars i { width: 100%; }
  .dfacts { display: flex; flex-direction: column; gap: 0; }
  .dfacts:empty { display: none; }
  .dfacts div { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-top: 1px solid var(--line); font-size: 12.5px; min-width: 0; }
  .dfacts span { color: var(--dim); flex: none; }
  .dfacts b { font: 500 12.5px var(--mono); color: var(--fg); text-align: right; min-width: 0; overflow-wrap: anywhere; }
  .dq-nums { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .dq-nums div { display: flex; flex-direction: column; gap: 3px; padding: 8px 10px; border-radius: min(var(--r), 12px); background: color-mix(in srgb, var(--fg) 5%, transparent); border: 1px solid var(--line); min-width: 0; }
  .dq-nums b { font: 700 18px var(--numFont, var(--mono)); color: var(--fg); white-space: nowrap; }
  .dq-nums b[data-bad] { color: var(--warn); }
  .dq-bars { display: flex; align-items: flex-end; gap: 2px; height: 34px; }
  .dq-bars:empty { display: none; }
  .dq-bars i { flex: 1; min-width: 2px; border-radius: 1px; background: var(--acc); opacity: .55; transition: height .4s var(--ease); }
  .dq-bars i:last-child { opacity: 1; }
  .dq-bars i[data-lost] { background: var(--fail); opacity: .9; height: 34px !important; }
  .add-key { background: var(--acc); border-color: var(--acc); color: var(--accFg); }
  .add-key:hover { filter: brightness(1.08); }
  .add-key[aria-expanded="true"] { background: var(--surf); color: var(--fg); border-color: var(--line); }
  .key-offer { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: min(var(--r), 12px); background: var(--accSoft); border: 1px dashed var(--acc); animation: ncIn .35s var(--ease) both; }
  .key-offer[hidden] { display: none; }
  .key-offer .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .key-offer b { font-size: 13px; }
  .key-offer small { font: 500 11.5px var(--mono); color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  @media (prefers-reduced-motion: reduce) {
    .diag-grid > .col > *, .diag-sum, .dstep, .speed-hist .sh, .key-offer { animation: none; }
    .diag-sum[data-st="run"] i, .dstep[data-st="run"] .ico { animation: none; }
    .dq-bars i, .speed-hist .sh i { transition: none; }
  }
  /* Всплывающее «перешёл на другую ноду» */
  .toast { position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; z-index: 60;
    padding: 10px 16px; border-radius: 12px; background: var(--surf2); color: var(--fg); border: 1px solid var(--line);
    box-shadow: 0 20px 50px rgba(0,0,0,.45); font-size: 13px; transition: opacity .3s var(--ease), transform .3s var(--ease); }
  .toast[data-show] { opacity: 1; transform: translate(-50%, 0); }
  @media (prefers-reduced-motion: reduce) { .nc-live, .nc-site, .nc-site[data-wait] span { animation: none; } .toast { transition: none; } }
  .side .chart { flex: none; padding: 14px; }
  .side .chart .bars { height: 60px; }
  .side .kpi { padding: 10px 12px; }
  .side .daily { padding: 14px; }
  .tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--gap); }
  .tiles.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpi { padding: 12px 14px; border-radius: var(--r); background: var(--surf); border: 1px solid var(--cardLine); box-shadow: var(--cardShadow); display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .kpi .k { letter-spacing: 0; text-transform: none; font-family: inherit; font-size: 12px; }
  .kpi .v { font-family: var(--mono); font-size: 17px; font-weight: 700; color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kpi .v.acc { color: var(--acc); }
  .kpi .t { font-family: var(--mono); font-size: 10px; color: var(--dim); }
  .chart .bars { display: flex; align-items: flex-end; gap: 3px; height: 70px; }
  .chart .bars i { flex: 1; min-width: 0; border-radius: 2px; background: rgba(var(--accRgb), .55); transition: height .5s var(--ease); }
  .chart .bars i.hot { background: var(--acc); }
  .chart .axis { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 10px; color: var(--dim); }
  .row-fact { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; color: var(--fg); }
  .row-fact span:last-child { font-family: var(--mono); font-size: 12px; color: var(--acc); text-align: right; }

  /* Предупреждение о системном прокси: не наш трафик — не наше обещание. */
  .leak { width: 100%; max-width: 460px; padding: 12px 14px; border-radius: var(--r); background: rgba(242,160,61,.10); border: 1px solid rgba(242,160,61,.45); display: flex; flex-direction: column; gap: 8px; }
  .leak .head { display: flex; align-items: center; gap: 8px; margin: 0; color: var(--warn); font-weight: 600; }
  .leak .head svg { width: 16px; height: 16px; }
  /* Внутри карточки .head и .title — свои, не заголовок страницы. */
  .leak .head .title { font-size: 13px; font-weight: 700; line-height: 1.3; }
  .leak .head { justify-content: flex-start; }
  .leak .body { display: block; height: auto; font-size: 12px; line-height: 1.45; }
  .conflict-list { margin: 0; padding-left: 16px; display: flex; flex-direction: column; gap: 6px; }
  .side .leak { max-width: none; }
  .leak.done { background: rgba(70,180,120,.10); border-color: rgba(70,180,120,.45); }
  .leak .body { font-size: 12px; line-height: 1.5; color: var(--fg); }
  .leak .act { display: flex; align-items: center; gap: 10px; }
  .leak .said { font-size: 12px; color: var(--dim); }

  /* Канал продавца: обычная карточка, а не тревога. Тревожный цвет — только у
     напоминания о сроке: остальное здесь не беда, а адрес, куда нажать. */
  .seller { flex: none; width: 100%; max-width: 460px; padding: 12px 14px; border-radius: var(--r); background: var(--surf); border: 1px solid var(--cardLine); box-shadow: var(--cardShadow); display: flex; flex-direction: column; gap: 8px; }
  .seller .remind { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 13px; font-weight: 600; color: var(--warn); }
  .seller .body { font-size: 12px; line-height: 1.5; color: var(--fg); overflow-wrap: anywhere; }
  .seller .act { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .seller .said { font-size: 12px; color: var(--dim); }

  /* ----------------------------------------------------------- серверы */

  /* Страны — карточками, а не строками таблицы: страну ищут глазами по
     крупному коду, а не по мелкой подписи. Автовыбор — отдельной карточкой
     сверху: это не ещё одна страна, а состояние «решай сам». */
  /* Зелёный — не акцент: у графита акцент серый, и «быстро» в нём не читалось бы оценкой. */
  .nodes { --good: #2fb36b; }
  .nodes { display: flex; flex-direction: column; gap: 12px; overflow: auto; min-height: 0; padding: 2px; }
  .node-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
  .nc {
    display: flex; flex-direction: column; gap: 12px; padding: 14px; border-radius: var(--r); cursor: pointer; text-align: left;
    background: var(--surf2, var(--surf)); border: 1px solid var(--line); color: var(--fg); font: inherit;
    transition: border-color .3s var(--ease), transform .3s var(--ease), background .3s;
  }
  .nc:hover { border-color: color-mix(in srgb, var(--acc) 55%, var(--line)); transform: translateY(-1px); }
  .nc:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
  .nc[data-chosen] { border-color: var(--acc); box-shadow: 0 0 0 1px var(--acc) inset; }
  .nc[data-current] { background: color-mix(in srgb, var(--acc) 10%, var(--surf2, var(--surf))); }
  .nc .nc-head { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .nc .nc-code {
    flex: none; width: 46px; height: 46px; border-radius: min(var(--r), 12px); display: grid; place-items: center;
    font-family: var(--mono); font-size: 16px; font-weight: 800; letter-spacing: .04em;
    background: color-mix(in srgb, var(--acc) 14%, transparent); color: var(--acc);
  }
  .nc .nc-code svg { width: 22px; height: 22px; }
  .nc .titles { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .nc .name { font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nc .city { font-size: 12px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nc .foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .nc .ping { display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 13px; font-weight: 700; }
  .nc .ping small { font-family: inherit; font-size: 11px; font-weight: 600; color: var(--dim); letter-spacing: .02em; }
  /* Три палочки сигнала: длину и цвет видно сразу, слово рядом — для тех,
     кто цвета не различает. */
  .nc .sig { display: inline-flex; align-items: flex-end; gap: 2px; height: 14px; }
  .nc .sig i { width: 4px; border-radius: 1px; background: var(--line); }
  .nc .sig i:nth-child(1) { height: 5px; } .nc .sig i:nth-child(2) { height: 9px; } .nc .sig i:nth-child(3) { height: 14px; }
  .nc[data-q="fast"] .sig i { background: var(--good); }
  .nc[data-q="mid"] .sig i:nth-child(-n+2) { background: var(--warn); }
  .nc[data-q="slow"] .sig i:nth-child(1) { background: var(--fail); }
  .nc[data-q="fast"] .ping { color: var(--good); }
  .nc[data-q="mid"] .ping { color: var(--warn); }
  .nc[data-q="slow"] .ping { color: var(--fail); }
  .nc .marks { display: flex; gap: 6px; flex-wrap: wrap; }
  .nc .mark { font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 999px; background: color-mix(in srgb, var(--fg) 8%, transparent); color: var(--dim); }
  .nc .mark.live { background: var(--acc); color: var(--accFg); }
  .nc .mark.mine { background: transparent; color: var(--acc); box-shadow: 0 0 0 1px var(--acc) inset; }
  .nc .mark.dead { color: var(--warn); }
  .nc[data-dead] .name, .nc[data-dead] .nc-code { opacity: .55; }
  .nc.auto { flex-direction: row; align-items: center; }
  .nc.auto .nc-head { flex: 1; }
  .nc.auto .city { white-space: normal; }

  /* Вид «Marvia»: страны строками — точка, имя, полоска качества, отклик. */
  /* flex: none — строка не сжимается ниже своего текста: в столбце со своей
     прокруткой сжатые строки наезжали друг на друга. Имя и подпись — в одну
     строку с многоточием, полностью — в подсказке. */
  .row-node {
    flex: none; display: grid; grid-template-columns: 28px minmax(0, 1fr) minmax(56px, 100px) 64px; gap: 12px; align-items: center;
    padding: 10px; min-height: 52px; border: 0; border-radius: min(var(--r), 10px); cursor: pointer; text-align: left;
    background: transparent; color: var(--fg); font: inherit; transition: background .3s;
  }
  .row-node > :nth-child(2) { min-width: 0; }
  .row-node .name, .row-node .sub { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nodes[data-view="marvia"] { gap: 2px; }
  .row-node:hover { background: rgba(var(--accRgb), .06); }
  .row-node[data-current] { background: var(--accSoft); }
  .flag { display: inline-flex; width: 26px; height: 18px; border-radius: 4px; overflow: hidden; flex: none;
    box-shadow: 0 0 0 1px rgba(128,128,128,.35); justify-self: center; }
  .flag svg { width: 100%; height: 100%; display: block; }
  .flag.txt { align-items: center; justify-content: center; background: color-mix(in srgb, var(--fg) 10%, transparent); color: var(--dim);
    font: 700 10px var(--mono); }
  .flag.globe { box-shadow: none; background: none; color: var(--dim); }
  .flag.globe svg { width: 18px; height: 18px; margin: auto; }
  .flag.auto { box-shadow: none; color: var(--acc); }
  .flag.auto svg { width: 18px; height: 18px; margin: auto; }
  .row-node[data-current] .flag:not(.auto) { box-shadow: 0 0 0 2px var(--acc); }
  .row-node .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); justify-self: center; }
  .row-node[data-alive] .dot { background: var(--dim); }
  .row-node[data-current] .dot { background: var(--acc); box-shadow: 0 0 8px var(--acc); }
  .row-node .name { font-size: 14px; font-weight: 600; }
  .row-node[data-chosen] .name::after { content: " ✓"; color: var(--acc); }
  .row-node .sub { font-size: 12px; color: var(--dim); }
  .row-node .bar { height: 5px; border-radius: 999px; background: color-mix(in srgb, var(--fg) 12%, transparent); overflow: hidden; }
  .row-node .bar i { display: block; height: 100%; border-radius: 999px; background: var(--acc); }
  .row-node .ms { font-family: var(--mono); font-size: 13px; font-weight: 700; text-align: right; white-space: nowrap; color: var(--fg); }
  .row-node[data-current] .ms { color: var(--acc); }
  .row-node:not([data-alive]) .name, .row-node:not([data-alive]) .ms { color: var(--dim); }

  /* По умолчанию — вид «Marvia»; карточки — по выбору на странице темы. */
  body:not([data-home="cards"]) .home-cards { display: none; }
  body[data-home="cards"] .home-classic { display: none; }

  /* ---------------------------------------------------------------- тема */

  .presets { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 8px; }
  .preset {
    display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 0; height: 66px;
    border-radius: min(calc(var(--r) + 4px), 18px); cursor: pointer; overflow: hidden;
    border: 1px solid var(--line); background: var(--surf);
    transition: border-color .35s, box-shadow .35s, transform .3s var(--ease);
  }
  .preset[aria-pressed="true"] { border: 2px solid var(--acc); box-shadow: 0 0 0 3px rgba(var(--accRgb), .25); }
  .preset .pv { position: relative; flex: 1; width: 100%; display: block; }
  .preset .pv i { position: absolute; display: block; }
  .preset .nm { font-size: 10px; color: var(--dim); padding-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .preset[aria-pressed="true"] .nm { color: var(--fg); font-weight: 700; }
  .swatches { display: flex; flex-wrap: wrap; gap: 8px; }
  .swatch { width: 30px; height: 30px; border-radius: 50%; border: 0; cursor: pointer; padding: 0; box-shadow: 0 0 0 1px rgba(0,0,0,.25); transition: transform .3s var(--ease), box-shadow .3s; }
  .swatch[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--shade), 0 0 0 5px var(--acc); transform: scale(1.05); }
  .lamp {
    position: relative; height: 126px; border-radius: var(--r); overflow: hidden; border: 1px solid var(--line);
    display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); padding: 6px;
  }
  .lamp button { border: 0; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; }
  .lamp button i { width: 7px; height: 7px; border-radius: 50%; background: rgba(var(--accRgb), .4); transition: all .3s var(--ease); }
  .lamp button[aria-pressed="true"] i { width: 18px; height: 18px; background: #fff; box-shadow: 0 0 0 5px rgba(255,255,255,.18), 0 0 20px rgba(255,255,255,.8); }
  .lamp .hint { position: absolute; left: 0; right: 0; bottom: 6px; text-align: center; font-size: 11px; pointer-events: none; }
  .kinds { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .kind {
    display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 5px 5px 7px; border-radius: min(var(--r), 12px);
    border: 1px solid var(--line); background: var(--surf); color: var(--fg); font: inherit; font-size: 12px; font-weight: 600; cursor: pointer;
  }
  .kind[aria-pressed="true"] { background: var(--accSoft); border-color: var(--acc); }
  .kind i { display: block; width: 100%; height: 34px; border-radius: max(calc(var(--r) - 6px), 4px); border: 1px solid var(--line); }
  .pills { display: flex; flex-wrap: wrap; gap: 8px; }
  .pills .pillb { flex: 1; min-width: 0; padding: 0 8px; }
  .range { width: 100%; accent-color: var(--acc); }
  .file-row { display: flex; gap: 8px; }
  .code { font-family: var(--mono); font-size: 12px; padding: 10px 12px; border-radius: min(var(--r), 12px); background: var(--shade); border: 1px solid var(--line); color: var(--fg); cursor: pointer; }
  .knobs { width: 340px; flex: 0 0 340px; overflow-x: hidden; overflow-y: auto; min-height: 0; padding-right: 2px; }

  /* ---------------------------------------------------------- настройки */

  .settings { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--gap); align-content: start; overflow-x: hidden; overflow-y: auto; min-height: 0; }
  .group { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .group .k { padding: 0 4px; }
  .rows { border-radius: var(--r); background: var(--surf); border: 1px solid var(--cardLine); box-shadow: var(--cardShadow); display: flex; flex-direction: column; overflow: hidden; }
  .rows > div { display: flex; align-items: center; gap: 12px; padding: 12px 14px; min-height: 56px; }
  .rows > div + div { border-top: 1px solid var(--line); }
  .rows .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .rows .name { font-size: 14px; font-weight: 600; color: var(--fg); }
  .rows .sub { font-size: 12px; color: var(--dim); }
  .rows .stack { flex-direction: column; align-items: stretch; gap: 10px; }
  .pick { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .keys { display: flex; flex-direction: column; gap: 6px; }
  /* Ключи — список выбора: вся строка — кнопка «сделать рабочим», справа
     кружок, у рабочего он залит. Отдельные «Использовать» и «Рабочий» были
     двумя способами сказать одно и спорили с самой строкой. */
  .keys .key {
    position: relative; display: flex; align-items: center; gap: 12px; padding: 11px 12px;
    border-radius: min(var(--r), 12px); border: 1px solid transparent; cursor: pointer; text-align: left;
    background: color-mix(in srgb, var(--fg) 4%, transparent); color: var(--fg); font: inherit; width: 100%;
    transition: border-color .2s, background .2s, transform .2s var(--ease); animation: ncIn .3s var(--ease) both;
  }
  .keys .key:hover { background: color-mix(in srgb, var(--fg) 7%, transparent); }
  .keys .key:active { transform: scale(.995); }
  .keys .key[data-active] { cursor: default; border-color: var(--acc); background: var(--accSoft); }
  .keys .key .kicon {
    flex: none; width: 36px; height: 36px; display: grid; place-items: center; border-radius: 10px;
    background: color-mix(in srgb, var(--fg) 8%, transparent); color: var(--dim);
  }
  .keys .key .kicon svg { width: 18px; height: 18px; }
  .keys .key .kicon .logo { width: 20px; height: 20px; }
  .keys .key[data-active] .kicon { background: color-mix(in srgb, var(--acc) 22%, transparent); color: var(--acc); }
  .keys .key .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .keys .key b { font-size: 14px; color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .keys .key small { font-size: 11.5px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .keys .key .quota { color: var(--fg); white-space: normal; }
  .keys .key .track { display: block; margin-top: 3px; height: 4px; background: color-mix(in srgb, var(--fg) 12%, transparent); }
  .keys .key .track[hidden], .keys .key .quota[hidden] { display: none; }
  .keys .key .kmark { flex: none; width: 20px; height: 20px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--dim); display: grid; place-items: center; transition: box-shadow .2s, background .2s; }
  .keys .key:hover .kmark { box-shadow: inset 0 0 0 1.5px var(--acc); }
  .keys .key[data-active] .kmark { background: var(--acc); box-shadow: none; color: var(--accFg, var(--bg)); }
  .keys .key[data-active] .kmark svg { width: 12px; height: 12px; }
  /* Корзина — по наведению: убирают ключ редко, а постоянная иконка на
     каждой строке спорила бы с выбором. Клавиатурой до неё тоже дойти. */
  .keys .key .kdrop {
    flex: none; width: 30px; height: 30px; display: grid; place-items: center; border-radius: 8px; border: 0; cursor: pointer;
    background: none; color: var(--dim); opacity: 0; transition: opacity .15s, color .15s, background .15s;
  }
  .keys .key:hover .kdrop, .keys .key .kdrop:focus-visible, .keys .key .kdrop[data-sure="1"] { opacity: 1; }
  .keys .key .kdrop svg { width: 16px; height: 16px; }
  .keys .key .kdrop:hover { color: var(--fail); background: color-mix(in srgb, var(--fail) 12%, transparent); }
  .keys .key .kdrop[data-sure="1"] { width: auto; padding: 0 10px; color: var(--fail); background: color-mix(in srgb, var(--fail) 14%, transparent); font-size: 12px; font-weight: 700; }
  @media (hover: none) { .keys .key .kdrop { opacity: 1; } }
  /* «Сейчас» — к какому серверу и почему, без абзаца пояснений. */
  .now-card .now-main { display: flex; align-items: center; gap: 12px; padding: 4px 0 2px; }
  .now-card .now-flag .flag { width: 40px; height: 28px; border-radius: 6px; }
  .now-card .now-text { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .now-card .now-text b { font-size: 17px; font-weight: 700; color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .now-card .now-text small { font: 600 12px var(--mono); color: var(--dim); }
  .now-card .now-mode { font-size: 11.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--accSoft); color: var(--acc); }
  .now-card .now-mode[data-manual] { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }
  .now-card .now-rules { display: flex; flex-wrap: wrap; gap: 6px; }
  .now-card .now-rules > span { display: inline-flex; align-items: center; gap: 6px; padding: 5px 9px; border-radius: 999px; font-size: 11.5px; color: var(--dim); border: 1px solid var(--line); }
  .now-card .now-rules svg { width: 13px; height: 13px; color: var(--acc); }
  @media (prefers-reduced-motion: reduce) { .keys .key { animation: none; transition: none; } }
  .key-form { display: flex; flex-direction: column; gap: 10px; }
  .key-form[hidden] { display: none; }
  .key-form .row .grow { flex: 1; min-width: 0; }
  .pick input.code-in { width: 150px; }
  /* Имя сайта длиннее адреса резолвера: поле тянется, но не за край. */
  .pick input.code-in.site-in { width: auto; flex: 1 1 200px; max-width: 340px; min-width: 0; }
  .log { max-height: 220px; max-width: 100%; overflow-x: hidden; overflow-y: auto; font-family: var(--mono); font-size: 11px; display: flex; flex-direction: column; gap: 4px; user-select: text; }
  .log-act { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
  .log .ln { display: flex; gap: 10px; min-width: 0; color: var(--fg); }
  .log .tm { color: var(--dim); flex: none; }
  .log .msg { min-width: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
  .about { margin: 0; font-size: 13px; line-height: 1.6; color: var(--dim); }
  .about b { color: var(--fg); }
  .facts { display: flex; gap: 28px; }
  .fact .k { letter-spacing: .16em; }
  .fact .v { font-family: var(--mono); font-size: 15px; font-weight: 700; color: var(--fg); margin-top: 4px; white-space: nowrap; }
  .host { font-family: var(--mono); font-size: 11px; color: var(--dim); }

  /* Первый запуск: спокойный, полноэкранный шаг в цветах текущей темы. */
  .welcome { position: fixed; z-index: 20; inset: 0; overflow-x: hidden; overflow-y: auto;
    background: radial-gradient(circle at 77% 26%, rgba(var(--accRgb), .12), transparent 36%), var(--bgcss, var(--bg)); }
  .welcome::before { content: ""; position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(rgba(var(--accRgb), .075) 1px, transparent 1.5px) 0 0 / 22px 22px; }
  .welcome-shell { position: relative; max-width: 1060px; min-height: 100%; margin: auto; padding: 42px 48px;
    display: flex; flex-direction: column; gap: 36px; }
  .welcome-brand { display: flex; align-items: center; gap: 14px; }
  .welcome-brand .logo { width: 38px; height: 38px; }
  .welcome-brand .wordmark { height: 20px; }
  .welcome-body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, .86fr); gap: 64px; align-items: center; flex: 1; }
  .welcome-eyebrow { display: inline-flex; align-items: center; gap: 9px; color: var(--acc); font: 11px var(--mono); letter-spacing: .14em; text-transform: uppercase; }
  .welcome-eyebrow::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--acc); box-shadow: 0 0 16px var(--acc); }
  .welcome h1 { margin: 18px 0 16px; font: 700 clamp(30px, 4vw, 52px)/1.17 var(--display); letter-spacing: -.04em; }
  .welcome-lead { max-width: 42ch; margin: 0; color: var(--dim); font-size: 16px; line-height: 1.65; }
  .welcome-flow { margin-top: 42px; display: flex; align-items: center; gap: 12px; color: var(--dim); font: 11px var(--mono); }
  .welcome-flow i { width: 28px; height: 1px; background: var(--line); }
  .welcome-flow b { color: var(--acc); font-weight: 600; }
  .welcome-panel { padding: 28px; border: 1px solid var(--line); border-radius: 24px; background: var(--surf); box-shadow: 0 24px 70px rgba(0,0,0,.18); }
  .welcome-panel h2 { margin: 0 0 16px; font-size: 19px; font-weight: 650; }
  .welcome-langs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .welcome-choice { padding: 14px 16px; min-height: 64px; border: 1px solid var(--line); border-radius: 13px; background: var(--bg); color: var(--fg);
    font: 600 15px Onest, system-ui, sans-serif; text-align: left; cursor: pointer; transition: border-color .2s, background .2s; }
  .welcome-choice:hover { border-color: var(--acc); }
  .welcome-choice[aria-pressed="true"] { border-color: var(--acc); background: var(--accSoft); }
  .welcome-choice small { display: block; margin-top: 2px; color: var(--dim); font: 11px var(--mono); }
  .welcome-privacy { margin: 26px 0 24px; padding-top: 22px; border-top: 1px solid var(--line); }
  .welcome-privacy .k { display: block; margin-bottom: 12px; }
  .welcome-privacy p { display: flex; gap: 12px; margin: 11px 0; color: var(--dim); font-size: 12px; line-height: 1.5; }
  .welcome-privacy p::before { content: ""; flex: none; width: 5px; height: 5px; margin-top: 7px; border-radius: 50%; background: var(--acc); }
  .welcome-start { width: 100%; min-height: 44px; border: 0; border-radius: 12px; background: var(--acc); color: var(--accFg); font: 700 14px Onest, system-ui, sans-serif; cursor: pointer; }
  .welcome-start:hover { filter: brightness(1.08); }
  .welcome-foot { color: var(--dim); font: 11px var(--mono); letter-spacing: .03em; }
  body.as-widget .welcome { display: none !important; }
  @media (max-width: 760px) {
    .welcome-shell { padding: 24px; gap: 28px; }
    .welcome-body { grid-template-columns: 1fr; gap: 28px; align-items: start; }
    .welcome h1 { font-size: clamp(30px, 7vw, 42px); }
    .welcome-panel { padding: 20px; }
    .settings { grid-template-columns: 1fr; }
  }

  /* --------------------------------------------------------- трей-виджет */

  /*
    Страница одна: та же разметка и тот же скрипт, только в другой шкуре —
    body.as-widget прячет окно и показывает виджет. Рамку рисуем сами: окно
    у трея без системной.
  */
  .widget { display: none; }
  body.as-widget { background: transparent; overflow: hidden; }
  body.as-widget::before { display: none; }
  body.as-widget .app { display: none; }
  body.as-widget .widget {
    position: relative; z-index: 1; display: flex; flex-direction: column; height: 100%;
    border-radius: 16px; border: 1px solid var(--line); overflow: hidden;
    background: radial-gradient(rgba(var(--accRgb), 0.06) 1px, transparent 1.5px) 0 0 / 22px 22px, var(--bgcss, var(--bg));
  }
  .w-top { height: 42px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 10px 0 14px; border-bottom: 1px solid var(--line); background: rgba(var(--accRgb), 0.05); }
  .w-top .acts { display: flex; gap: 2px; }
  .w-top .acts button { width: 34px; height: 30px; border: 0; background: transparent; color: var(--dim); cursor: pointer; display: flex; align-items: center; justify-content: center; border-radius: 8px; }
  .w-top .acts button:hover { color: var(--fg); background: var(--accSoft); }
  .w-top .acts svg { width: 14px; height: 14px; }
  .w-hero { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 12px 14px; }
  .w-hero .ring { width: 148px; height: 148px; flex: none; }
  .w-hero .power { width: 116px; height: 116px; }
  .w-hero .power svg { width: 50px; height: 50px; }
  .w-hero .status { font-size: 20px; }
  .w-hero > div:last-child { width: 100%; min-width: 0; }
  .w-meta { max-width: 100%; text-align: center; font-size: 12px; line-height: 1.5; color: var(--dim); overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .w-bottom { padding: 0 14px 14px; display: flex; flex: none; flex-direction: column; gap: 8px; }
  .w-node { max-width: none; cursor: pointer; font: inherit; text-align: left; }
  .w-node > div { flex: 1; min-width: 0; }
  .w-node .name { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .w-tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .w-tiles .kpi { padding: 10px 12px; }
  .w-tiles .kpi .k { font-size: 11px; }
  .w-tiles .kpi .v { font-size: 14px; }
  .w-tiles .kpi .t { font-size: 10px; }
  .w-open { min-height: 40px; }
  .daily { flex: none; }
  .daily-bars { display: flex; gap: 3px; align-items: flex-end; height: 42px; padding-top: 5px; }
  .daily-bars i { flex: 1; min-width: 0; min-height: 2px; background: var(--acc); opacity: .55; border-radius: 2px 2px 0 0; transition: height .3s; }
  .daily-bars i[data-current] { opacity: 1; }
  .daily .axis { display: flex; justify-content: space-between; font-size: 10px; color: var(--dim); }
  .w-daily { padding: 10px 12px; border-radius: 12px; background: var(--surf); border: 1px solid var(--line); }
  .w-daily .card-head { font-size: 11px; color: var(--dim); }
  .w-daily .daily-bars { height: 28px; }
  .w-daily .mono { font-size: 11px; color: var(--fg); }
  .session-extra { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding: 4px 0; font-size: 11px; color: var(--dim); }
  .week-axis span { flex: 1; text-align: center; }
  .week-note { font-size: 11px; color: var(--dim); line-height: 1.45; margin: 0; }
  .session-extra strong { display: block; margin-top: 3px; font-family: var(--mono); font-size: 13px; font-weight: 500; color: var(--fg); }
  @media (max-height: 540px) {
    .w-hero { padding: 6px 12px; gap: 4px; }
    .w-hero .ring { width: 100px; height: 100px; }
    .w-hero .power { width: 80px; height: 80px; }
    .w-hero .power svg { width: 32px; height: 32px; }
    .w-tiles .kpi { padding: 7px 10px; }
    .w-node { padding: 10px 12px; }
    .w-daily .daily-bars { height: 20px; }
  }
  @media (max-height: 500px) {
    .w-top { height: 36px; }
    .w-hero .ring { width: 80px; height: 80px; }
    .w-hero .power { width: 64px; height: 64px; }
    .w-hero .power svg { width: 28px; height: 28px; }
    .w-hero .status { font-size: 17px; }
    .w-tiles .kpi { padding: 6px 10px; gap: 2px; }
    .w-tiles .kpi .k { font-size: 10px; line-height: 13px; }
    .w-tiles .kpi .v { font-size: 13px; line-height: 18px; }
    .w-tiles .kpi .t { font-size: 9px; line-height: 12px; }
    .w-node { padding: 8px 10px; }
    .w-open { min-height: 34px; }
    .w-bottom { gap: 6px; padding: 0 12px 12px; }
  }

  /* Свой фон: картинка или видео под всем окном; пелена держит читаемость. */
  #bg-layer { position: fixed; inset: 0; z-index: 0; overflow: hidden; }
  #bg-layer img, #bg-layer video { width: 100%; height: 100%; display: block; }
  #bg-veil { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  /* ───── Вид телефона ─────
     Окно повторяет главный экран телефона, а не просто красится той же темой:
     там его и хвалят. Числа взяты из Android-кода (Paint.card, HaloView,
     SpeedSpark), чтобы два клиента не расходились «на глаз». */

  /* Карточка — с лёгким отливом акцента из угла: --cardBg считает тема
     (look.js) теми же числами, что Paint.card на телефоне. */
  .card, .kpi { background: var(--cardBg, var(--surf)); }
  /* «Сегодня» — главная карточка, как на телефоне: отлив сильнее и тонкая
     акцентная обводка (Paint, тег feature). */
  .card.feature { background: var(--featureBg, var(--surf)); border-color: var(--featureLine, var(--cardLine)); }
  .card.feature #today-total { font-size: 22px; font-weight: 700; color: var(--acc); }
  .card.feature .card-head b { font-weight: 500; color: var(--dim); font-size: 14px; }
  .card, .kpi { transition: transform .35s var(--ease), border-color .3s, box-shadow .3s; }
  .card:hover, .kpi:hover { border-color: rgba(var(--accRgb), .3); }

  /* Ореол: кольца тают наружу, точки на орбите ярче, когда подключено. */
  .ring > svg.halo { inset: -55px; width: calc(100% + 110px); height: calc(100% + 110px); transform: none; z-index: 0; }
  body .ring .halo circle { fill: none; stroke: var(--acc); stroke-width: 1; stroke-dasharray: none; }
  .ring .halo circle:nth-child(1) { stroke-opacity: .16; }
  .ring .halo circle:nth-child(2) { stroke-opacity: .12; }
  .ring .halo circle:nth-child(3) { stroke-opacity: .08; }
  .ring .halo .orbit { stroke: none; fill: var(--acc); fill-opacity: .4; transition: fill-opacity .6s; }
  .ring .halo .orbit.b { fill-opacity: .22; }
  body[data-state="connected"] .ring .halo .orbit.a { fill-opacity: .63; }
  body[data-state="connected"] .ring .halo .orbit.b { fill-opacity: .33; }
  body[data-state="connecting"] .ring .halo { animation: drift 6s linear infinite; }
  @keyframes drift { to { transform: rotate(360deg); } }

  /* Состояние — крупно и светлым, как на телефоне; подпись — обычным текстом. */
  .status { font-size: 32px; letter-spacing: -.015em; color: var(--fg); }
  .detail { font-family: inherit; font-size: 13.5px; letter-spacing: 0; }

  /* Нода — одной капсулой «страна · город · отклик», как строка на телефоне. */
  .node { width: auto; max-width: 460px; padding: 9px 18px; border-radius: 999px; gap: 10px; cursor: default; }
  .node > div { display: flex; align-items: baseline; gap: 10px; flex: 0 1 auto; }
  .node .name { font-family: var(--mono); font-size: 13px; font-weight: 500; letter-spacing: .04em; white-space: nowrap; }
  .node .sub { display: none; }
  .node .ping { font-size: 13px; }

  /* Скорость: подпись и объём сессии сверху, цифра, под ней бегущая линия. */
  .kpi.spd { gap: 6px; padding: 14px 16px 12px; }
  .spd-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .spd-head .k { font-size: 13px; color: var(--dim); }
  .kpi.spd .v { font-size: 20px; }
  .spark { display: block; width: 100%; height: 30px; overflow: hidden; margin-top: 2px; }
  .spark .line { fill: none; stroke: var(--acc); stroke-width: 1.8; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; stroke-opacity: .25; transition: stroke-opacity .4s; }
  .spark .area { fill: rgba(var(--accRgb), .0); transition: fill .4s; }
  .spark.live .line { stroke-opacity: 1; }
  .spark.live .area { fill: rgba(var(--accRgb), .14); }
  .side .kpi { padding: 12px 14px; }
  .side .kpi .k { font-size: 13px; }
  .side .kpi .v { font-size: 19px; }
  /* ───── Образы ─────
     Живой фон рисует холст #field; статичная сетка body::before ему больше
     не нужна. Холст лежит над своей картинкой фона и под интерфейсом. */
  #field { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  body::before { display: none; }

  /* Шрифты и надпись состояния — переменными: их задаёт образ, а точная
     настройка переписывает поле за полем. */
  body { font-family: var(--uiFont, Onest, "Segoe UI", system-ui, sans-serif); }
  .status { font-family: var(--statusFont, inherit); font-size: var(--statusSize, 32px);
    text-transform: var(--statusCase, none); letter-spacing: var(--statusTrack, -.015em); }
  .kpi .v, #today-total, .session-extra strong { font-family: var(--numFont, var(--mono)); }
  body[data-caps="true"] .spd-head .k, body[data-caps="true"] .side .kpi .k,
  body[data-caps="true"] .card.feature .card-head b {
    font-family: var(--mono); text-transform: uppercase; letter-spacing: .14em; font-size: 10.5px; }
  /* Стекло: полупрозрачная карточка пропускает узор, размытие делает его
     фоном, а не шумом. Без размытия фильтра нет совсем — он не бесплатный. */
  .card, .kpi, .node, aside .sub-card { -webkit-backdrop-filter: var(--glassFilter, none); backdrop-filter: var(--glassFilter, none); }

  /* Знак — фирменный металл; в цвет акцента — только если так выбрано. */
  body:not([data-logo="tint"]) .logo::after { background: transparent; }
  .top .logo { filter: drop-shadow(0 1px 3px rgba(0,0,0,.35)); }

  /* Заставка. Если код окна не дошёл до неё, через три секунды она уходит
     сама: окно, закрытое заставкой навсегда, хуже окна без заставки. */
  #splash { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; align-content: center; gap: 18px;
    background: var(--bgcss, var(--bg)); transition: opacity .5s var(--ease), transform .5s var(--ease);
    animation: splash-failsafe 0s 3s forwards; cursor: pointer; }
  #splash canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #splash .logo { width: 84px; height: 84px; position: relative; z-index: 1;
    animation: mark-in .9s cubic-bezier(.2,.9,.25,1.05) .15s both; }
  #splash .wordmark { height: 22px; position: relative; z-index: 1;
    animation: word-in .7s var(--ease) .55s both; }
  #splash.gone { opacity: 0; transform: scale(1.04); pointer-events: none; }
  @keyframes mark-in { from { opacity: 0; transform: scale(.62) rotate(-8deg); filter: blur(10px); } to { opacity: 1; transform: none; filter: none; } }
  @keyframes word-in { from { opacity: 0; clip-path: inset(0 100% 0 0); } to { opacity: 1; clip-path: inset(0 0 0 0); } }
  @keyframes splash-failsafe { to { opacity: 0; pointer-events: none; visibility: hidden; } }
  body.arrive .top, body.arrive aside .tab, body.arrive aside .sub-card, body.arrive .page[data-open] > * {
    animation: arrive .6s var(--ease) both; }
  body.arrive aside .tab:nth-child(2) { animation-delay: .04s; }
  body.arrive aside .tab:nth-child(3) { animation-delay: .08s; }
  body.arrive aside .tab:nth-child(4) { animation-delay: .12s; }
  @keyframes arrive { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  /* Вкладка «Тема»: прокрутка целиком, лента образов в два ряда вбок. */
  .theme-scroll { display: flex; flex-direction: column; gap: var(--gap); flex: 1; min-height: 0; padding-right: 4px; }
  /* Лента листается рукой: «ладонь» над ней, «сжатая ладонь» при перетаскивании.
     Края растворяются только там, где лента продолжается, — сразу видно, в
     какую сторону ещё есть образы. */
  .vibes { display: grid; grid-auto-flow: column; grid-template-rows: repeat(2, auto); grid-auto-columns: 214px; gap: 12px;
    overflow-x: auto; overflow-y: hidden; padding: 4px 2px 6px; scrollbar-width: none; cursor: grab; user-select: none;
    --fadeL: 0px; --fadeR: 0px;
    -webkit-mask: linear-gradient(90deg, transparent 0, #000 var(--fadeL), #000 calc(100% - var(--fadeR)), transparent 100%);
            mask: linear-gradient(90deg, transparent 0, #000 var(--fadeL), #000 calc(100% - var(--fadeR)), transparent 100%); }
  .vibes::-webkit-scrollbar { display: none; }
  .vibes.more-left { --fadeL: 56px; }
  .vibes.more-right { --fadeR: 56px; }
  .vibes.dragging { cursor: grabbing; }
  .vibes.dragging .vibe { pointer-events: none; }
  .vibes-bar { position: relative; height: 4px; border-radius: 4px; background: rgba(var(--accRgb), .12); cursor: pointer; margin: 2px 2px 0; }
  .vibes-bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: inherit; background: var(--acc); opacity: .7;
    transition: width .3s var(--ease); }
  .vibes-bar:hover i { opacity: 1; }
  .vibe { display: flex; flex-direction: column; gap: 6px; padding: 8px 8px 12px; border-radius: calc(var(--r) + 4px);
    cursor: pointer; background: transparent; border: 1px solid var(--cardLine); color: var(--fg); text-align: left;
    transition: transform .35s cubic-bezier(.2,.9,.25,1.05), border-color .3s, background .3s; }
  .vibe:hover { background: rgba(var(--accRgb), .05); }
  .vibe:active { transform: scale(.97) !important; }
  .vibe[aria-pressed="true"] { border-color: var(--acc); box-shadow: 0 0 0 1px var(--acc) inset; }
  .vibe-art { position: relative; height: 88px; border-radius: var(--r); overflow: hidden; display: grid; place-items: center; }
  .vibe-btn { width: 36px; height: 36px; border-radius: 50%; box-shadow: 0 0 0 1.5px var(--vacc), 0 0 22px -4px var(--vacc);
    background: radial-gradient(circle at 40% 30%, color-mix(in srgb, var(--vfg) 18%, transparent), transparent 70%);
    transition: transform .5s cubic-bezier(.2,.9,.25,1.05); }
  .vibe:hover .vibe-btn { transform: scale(1.15) rotate(-90deg); }
  .vibe-btn::after { content: ""; position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px; border-radius: 50%;
    border: 2px solid var(--vacc); border-top-color: transparent; }
  .vibe-name { font-weight: 600; font-size: 14px; padding: 0 4px; }
  .vibe-line { font-size: 12px; line-height: 1.4; color: var(--dim); padding: 0 4px; }
  .fine-row { display: flex; gap: 10px; flex-wrap: wrap; }

  /* Точная настройка — свёрнута: образа хватает почти всем. */
  .fine-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--gap); align-items: start; }
  .fine-grid .col { display: flex; flex-direction: column; gap: var(--gap); min-width: 0; }
  .page[data-tab="theme"]:not(.fine-open) .fine-grid { display: none; }
  .page[data-tab="theme"].fine-open .fine-grid { animation: arrive .45s var(--ease) both; }
  .fine-list { display: flex; flex-direction: column; gap: 12px; }
  .fine-item { display: flex; flex-direction: column; gap: 6px; }
  .fine-head { display: flex; align-items: baseline; gap: 8px; font-size: 13px; }
  .fine-name { flex: 1; color: var(--fg); }
  .fine-val { font-family: var(--mono); font-size: 11px; color: var(--dim); }
  .fine-item.own .fine-val { color: var(--acc); }
  .fine-reset { border: 0; background: none; color: var(--dim); cursor: pointer; padding: 0 2px; font-size: 13px; }
  .fine-reset:hover { color: var(--acc); }
  .fine-item input[type="color"], .pick-row input[type="color"] { width: 100%; height: 30px; padding: 2px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--surf2); cursor: pointer; }
  .pick-row { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--dim); cursor: pointer; }
  .pick-row input[type="color"] { width: 46px; flex: none; }

  .power { overflow: hidden; }

  .dotunit { margin-left: .45em; font-size: .62em; font-family: var(--mono); letter-spacing: .04em; color: var(--dim); font-weight: 500; }
  body[data-vibe="dot"] .node .mark, body[data-vibe="paper"] .node .mark { background: var(--acc); box-shadow: 0 0 8px var(--acc); }

  @media (max-width: 1000px) { .fine-grid { grid-template-columns: minmax(0, 1fr); } }
  @media (prefers-reduced-motion: reduce) {
    #splash { display: none; }
    body.arrive * { animation: none !important; }
  }
  /* ───── Настройки: разделы слева, один открыт справа ───── */
  .settings { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: calc(var(--gap) * 1.5); align-items: start;
    overflow: hidden; min-height: 0; height: 100%; }
  .set-panes { overflow-y: auto; overflow-x: hidden; min-height: 0; max-height: 100%; padding: 0 6px 12px 0;
    scrollbar-width: thin; scrollbar-color: var(--dim) transparent; }
  .set-panes > .col { display: contents; }
  .set-panes .group { display: none; gap: 12px; }
  .set-panes .group.on { display: flex; animation: pane-in .42s var(--ease) both; }
  @keyframes pane-in { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: none; } }
  .set-head { padding: 2px 4px 4px; }
  .set-head h2 { margin: 0; font: 600 24px/1.15 var(--uiFont, Onest), sans-serif; letter-spacing: -.02em; color: var(--fg); }
  .set-head p { margin: 6px 0 0; font-size: 13px; line-height: 1.5; color: var(--dim); max-width: 560px; }

  .set-nav { position: relative; display: flex; flex-direction: column; gap: 4px; padding: 6px;
    border-radius: calc(var(--r) + 4px); background: var(--cardBg, var(--surf)); border: 1px solid var(--cardLine);
    -webkit-backdrop-filter: var(--glassFilter, none); backdrop-filter: var(--glassFilter, none); }
  .set-nav button { position: relative; z-index: 1; display: flex; gap: 12px; align-items: center; padding: 9px 10px;
    border: 0; background: none; color: var(--fg); text-align: left; border-radius: var(--r); cursor: pointer; min-width: 0; }
  .set-nav button:focus-visible { outline: 2px solid var(--acc); outline-offset: -2px; }
  .set-ico { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; flex: none;
    background: rgba(var(--accRgb), .10); color: var(--acc);
    transition: transform .35s cubic-bezier(.2,.9,.25,1.05), background .3s, color .3s; }
  .set-ico svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .set-nav button:hover .set-ico { transform: scale(1.08) rotate(-4deg); }
  .set-nav button[aria-current="true"] .set-ico { background: var(--acc); color: var(--accFg); }
  .set-txt { display: flex; flex-direction: column; min-width: 0; }
  .set-txt b { font-size: 14px; font-weight: 600; }
  .set-txt small { font-size: 11.5px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .set-pill { position: absolute; left: 6px; right: 6px; top: 0; height: 0; z-index: 0; border-radius: var(--r);
    background: var(--surf2); box-shadow: 0 1px 0 rgba(255,255,255,.05) inset;
    transition: transform .45s cubic-bezier(.2,.9,.25,1.05), height .45s cubic-bezier(.2,.9,.25,1.05); }

  /* Строки — отдельными плитками с промежутком, а не сплошной простынёй. */
  .set-panes .rows { background: none; border: 0; box-shadow: none; gap: 8px; overflow: visible; }
  .set-panes .rows > div { border-radius: var(--r); background: var(--cardBg, var(--surf)); border: 1px solid var(--cardLine);
    padding: 14px 16px; -webkit-backdrop-filter: var(--glassFilter, none); backdrop-filter: var(--glassFilter, none);
    transition: border-color .25s, transform .3s var(--ease); }
  .set-panes .rows > div + div { border-top: 1px solid var(--cardLine); }
  .set-panes .rows > div:hover { border-color: rgba(var(--accRgb), .35); }
  .rows > .has-switch .grow { cursor: pointer; }

  /* Переключатель: дорожка и бегунок. Надпись внутри скрыта глазу, но не
     диктору. */
  .rows .switch { position: relative; width: 50px; height: 30px; padding: 0; border-radius: 999px; flex: none;
    font-size: 0; color: transparent; background: rgba(var(--accRgb), .14); border: 1px solid var(--line);
    transition: background .25s, border-color .25s, box-shadow .25s; }
  .rows .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%;
    background: var(--fg); box-shadow: 0 2px 6px rgba(0,0,0,.35); transition: transform .32s cubic-bezier(.2,.9,.25,1.2), background .25s; }
  .rows .switch[aria-pressed="true"], .rows .switch[data-on="true"] { background: var(--acc); border-color: var(--acc); box-shadow: var(--glow, none); }
  .rows .switch[aria-pressed="true"]::after, .rows .switch[data-on="true"]::after { transform: translateX(20px); background: var(--accFg); }
  .rows .switch:active::after { width: 26px; }
  .rows .switch[aria-pressed="true"]:active::after, .rows .switch[data-on="true"]:active::after { transform: translateX(16px); }

  @media (max-width: 900px) { .settings { grid-template-columns: 64px minmax(0, 1fr); } .set-txt { display: none; } }

  /* ───── Заголовок окна ─────
     Системной полосы больше нет: шапка страницы и есть заголовок. За пустое
