   Человеческие форматы
   ──────────────────────────────────────────────────────────────────────── */

function bytes(n) {
  const units = L().bytes;
  // Голый «0» рядом с «12.4 ГБ» читается как другая величина, а не как ноль
  // байт. Держим единицу и на нуле, и на языке интерфейса («0 Б» / «0 B»).
  if (!n) return "0 " + units[0];
  let i = 0, v = n;
  while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
  // Целое пишем без «.0»: тариф «50 ГБ» в списке не должен выглядеть как
  // «50.0 ГБ», будто это замер, а не круглое число.
  const shown = v >= 100 || i === 0 || Number.isInteger(v) ? String(Math.round(v)) : v.toFixed(1);
  return shown + " " + units[i];
}

// shortDate отдаёт дату так, как её пишут на языке интерфейса.
//
// Своей раскладки не изобретаем: 09.10.2026 и 10/09/2026 — это один и тот же
// день, и человек, привыкший к своей записи, читает чужую с ошибкой ровно там,
// где ошибиться дороже всего — в сроке подписки.
function shortDate(iso) {
  if (!iso) return L().time.forever;
  const d = new Date(iso);
  if (isNaN(d)) return "—";
  return d.toLocaleDateString(L().lang, { day: "2-digit", month: "2-digit", year: "numeric" });
}

function dayLabel(day) {
  const p = day.split("-");
  if (p.length !== 3) return day;
  // На оси графика год не нужен, а порядок дня и месяца — нужен.
  return L().lang === "en" ? p[1] + "." + p[2] : p[2] + "." + p[1];
}

// sinceLabel — «когда нода последний раз выходила на связь». Панель считает
// ноду живой, если та отмечалась недавно: своего пинга у панели нет, а врать
// зелёным кружком нельзя.
function sinceLabel(iso) {
  // Словарь берём через L(), а не через d18 — и вот почему.
  //
  // d18 — локальная переменная внутри renderVals, снаружи такого имени нет.
  // Обращение к нему отсюда роняло всю отрисовку — но только когда на связь
  // выходила хотя бы одна нода: без нод эта функция не вызывается. На пустой
  // панели всё выглядело здоровым, а у продавца с нодами страница навсегда
  // замирала на «Обновляю…».
  const w = L();
  if (!iso) return w.time.never;
  const d = new Date(iso);
  if (isNaN(d)) return "—";
  const mins = Math.floor((Date.now() - d.getTime()) / 60000);
  if (mins < 1) return w.time.now;
  if (mins < 60) return mins + w.time.min;
  const hours = Math.floor(mins / 60);
  if (hours < 24) return hours + w.time.hour;
  return Math.floor(hours / 24) + w.time.day;
}

function nodeAlive(node) {
  if (!node.enabled || !node.last_seen) return false;
  return Date.now() - new Date(node.last_seen).getTime() < 10 * 60 * 1000;
}

function keyShort(user) {
  const cred = (user.credentials || [])[0];
  if (!cred || !cred.secret) return "—";
  return cred.secret.slice(0, 4) + "…" + cred.secret.slice(-4);
}

function daysLeft(iso) {
  if (!iso) return null;
  const d = new Date(iso);
  if (isNaN(d)) return null;
  return Math.ceil((d.getTime() - Date.now()) / 86400000);
}

// Относительная подпись нужна только рядом со сроком, который требует
// внимания. Дальняя дата и так отвечает на вопрос, а отключённого клиента
// сначала нужно включить — обещать ему продление одной подписью нельзя.
function expiryNote(iso, enabled, words) {
  if (!enabled) return "";
  const left = daysLeft(iso);
  if (left === null || left > 7) return "";
  return left < 0 ? words.dash.agoDays(-left) : words.dash.inDays(left);
}

/* ────────────────────────────────────────────────────────────────────────────
   Значения для шаблона
   ──────────────────────────────────────────────────────────────────────── */

// Разделы: только те, за которыми есть данные. «Тарифы», «Платежи»,
// «Рассылка», «Логи и аудит» в дизайне нарисованы, но панель о них ничего не
// знает — пункта меню, который ведёт в выдуманное, здесь нет.
// Порядок разделов в меню. Названия берутся из словаря по этому же ключу:
// держать их здесь значило бы иметь два места, где они разъезжаются.
//
// Разделы сгруппированы по тому, зачем человек туда идёт: продавать, следить
// за сетью, настраивать. Девять пунктов одним столбцом читались списком, где
// «Журнал» стоял между «Оповещениями» и «Обновлениями» без причины.
const NAV_GROUPS = [
  ["sales", ["dash", "clients", "keys"]],
  ["network", ["nodes", "stats"]],
  ["settings", ["alerts", "journal", "updates", "look"]],
];

// ADMIN_PAGES — разделы, которые открывает только админский токен. Ключу бота
// их не показываем: кнопка, за которой всегда «не положено», — пустое обещание.
const ADMIN_PAGES = ["keys", "alerts", "journal", "updates"];


// Сколько строк на странице. Полсотни — столько влезает в экран прокруткой и
// столько человек ещё готов просмотреть глазами, не листая.
const ROWS = 50;

function setState(patch) {
  // Смена раздела или запроса сбрасывает лист. Иначе продавец, стоявший на
  // четвёртой странице, ищет одного человека и видит «никого нет»: найденных
  // трое, а он смотрит на четвёртую полусотню.
  if ("page" in patch || "q" in patch || "filter" in patch) state.rowsPage = 1;
  if ("filter" in patch) { try { localStorage.setItem("marvia-filter", patch.filter); } catch (_) { /* приватное окно */ } }
  Object.assign(state, patch);
  if (Look.KEYS.some((k) => k in patch)) saveLook();
  render();

  // Настройки оповещений подтягиваем при открытии их страницы: они нужны
  // только там, а ходить за ними при каждой отрисовке незачем.
  if (patch.page === "alerts") {
    if (state.alerts) fillAlerts();
    else loadAlerts();
  }
  if (patch.page === "journal") loadJournal();
  if (patch.page === "updates") loadUpdates();
}

// CTA — какая кнопка стоит в углу раздела. Разделы без действия остаются без
// кнопки: пустой угол честнее нажимаемой заглушки.
const CTA = {
  dash: () => newUserSheet(),
  clients: () => newUserSheet(),
  nodes: () => newNodeSheet(),
  keys: () => newKeySheet(),
};

// older — старше ли версия a версии b: числа vX.Y.Z, затем хвост тестового
// выпуска (alpha.5 раньше alpha.6, alpha раньше beta и rc, все они раньше
// выпуска без хвоста). Неразборчивое (dev) старше ничего не считается: нода
// или панель из свежей сборки бывает новее релиза, и кнопка «обновить»
// откатила бы её назад. Тот же порядок, что у OlderVersion в store.go.
function older(a, b) {
  const parse = (v) => {
    const m = /^v?(\d+)\.(\d+)\.(\d+)(?:-([0-9A-Za-z.]+))?$/.exec(v || "");
    return m ? { core: [+m[1], +m[2], +m[3]], pre: m[4] ? m[4].split(".") : [] } : null;
  };
  const pa = parse(a), pb = parse(b);
  if (!pa || !pb) return false;
  for (let i = 0; i < 3; i++) if (pa.core[i] !== pb.core[i]) return pa.core[i] < pb.core[i];
  if (!pa.pre.length) return false;
  if (!pb.pre.length) return true;
  for (let i = 0; i < pa.pre.length && i < pb.pre.length; i++) {
    const x = pa.pre[i], y = pb.pre[i];
    if (x === y) continue;
    const nx = /^\d+$/.test(x), ny = /^\d+$/.test(y);
    if (nx && ny) return +x < +y;
    if (nx !== ny) return nx;
    return x < y;
  }
  return pa.pre.length < pb.pre.length;
}

// updatesView — страница «Обновления». Кнопка появляется только там, где ей
// есть что делать: панель уже на последней версии или службы обновления нет —
// кнопки нет, а вместо неё сказано, почему.
function updatesView(t, d, dict) {
  const u = state.updates;
  const up = dict.updates;
  const latest = (u && u.latest) || "";
  const svc = (u && u.panel && u.panel.updater) || {};
  const panelVersion = (u && u.panel && u.panel.version) || "";
  const nodes = (u && u.nodes) || [];
  // Нода без версии — старше этой возможности: просьбу она не услышит, и
  // кнопка, которая её считает, обещала бы то, чего не будет.
  const stale = nodes.filter((n) => n.enabled && n.version && latest && older(n.version, latest));

  let panelLine = "";
  if (state.updRestarting) panelLine = up.restarting;
  else if (svc.pending) panelLine = up.state.pending;
  else if (svc.state === "wait") panelLine = up.waitLine(updWaitLeft(svc));
  else if (svc.state === "running") panelLine = up.state.running;
  else if (svc.state) panelLine = up.state[svc.state] + (svc.at ? " · " + journalWhen(svc.at) : "") + (svc.reason ? " · " + svc.reason : "");

  // Ход обновления шагами: просьба → выпуск → подпись → установка →
  // перезапуск → готово. Служба пишет шаг в причину состояния (agent.sh).
  let step = -1;
  if (state.updRestarting) step = 4;
  else if (svc.pending || (svc.state === "wait" && state.updWaiting)) step = 0;
  else if (svc.state === "running") step = svc.reason === "verify" ? 2 : String(svc.reason || "").startsWith("install") ? 3 : 1;
  const stepsShown = step >= 0;
  const steps = up.steps.map((label, i) => ({
    label,
    cls: "upd-step" + (i < step ? " done" : i === step ? " now" : ""),
  }));

  const rows = nodes.map((n) => {
    let label = up.fresh, warn = false;
    if (!n.enabled) label = dict.nodesPage.offShort;
    else if (n.upgrade_to && n.version !== n.upgrade_to) label = up.going(n.upgrade_to);
    else if (!n.version) { label = up.old; warn = true; }
    else if (latest && older(n.version, latest)) { label = up.stale; warn = true; }
    // Нода, которую попросили, — с бегущей полоской: она получит просьбу на
    // ближайшей сверке и перезапустится; когда версия дойдёт, полоска уйдёт.
    const going = !!(n.enabled && n.upgrade_to && n.version !== n.upgrade_to);
    return {
      name: n.name,
      version: n.version ? n.version + (n.arch ? " · " + n.arch : "") : "—",
      state: label,
      going,
      // Вспышка — только в тот миг, когда нода дошла: была в пути и стала
      // свежей. Иначе она мигала бы на каждой перерисовке.
      cls: "row-item upd-row upd-node" + (going ? " going" : (!warn && (state.updGoing || {})[n.id] ? " fresh" : "")),
      badge: "pill " + (warn ? "warn" : going ? "acc" : n.enabled ? "ok" : ""),
    };
  });

  state.updGoing = Object.fromEntries(nodes.map((n) => [n.id, !!(n.enabled && n.upgrade_to && n.version !== n.upgrade_to)]));
  const updCanPanelNow = !!u && svc.installed && !svc.pending && svc.state !== "running" && !state.updRestarting
    && !!latest && older(panelVersion, latest);
  return {
    updLatestErr: !!(u && u.latest_error),
    updLatestErrText: u && u.latest_error ? up.latestErr(u.latest_error) : "",
    updPanelVersion: panelVersion || up.unknown,
    updLatest: latest || up.unknown,
    updPanelLine: panelLine,
    updLineCls: "help" + (svc.state === "failed" && !svc.pending ? " tone-warn" : ""),
    updNoService: !!u && !svc.installed,
    updHasChannel: !!u && !!u.channel,
    updChannelText: u && u.channel === "test" ? up.channelTest : up.channelStable,
    updChannelCmd: u && u.channel === "test" ? up.commandStable : up.commandTest,
    updCanPanel: updCanPanelNow,
    updHasLog: !!svc.log,
    updLog: svc.log || "",
    updNodes: rows,
    updNoNodes: !!u && !nodes.length,
    updCanNodes: stale.some((n) => !n.upgrade_to || n.upgrade_to !== latest),
    updNodesCta: up.upNodes(stale.length),

    doUpgradePanel: () => act(async () => {
      if (!(await ask(up.upPanel, up.confirmPanel(latest)))) return;
      await api("/api/v1/updates/panel", "POST");
      state.updWaiting = true;
      toast(up.state.pending);
      await loadUpdates();
    }),
    updShowSteps: stepsShown,
    updSteps: steps,
    updAutoSwitch: "upd-switch" + (state.updAuto && state.updAuto.enabled ? " on" : ""),
    updAutoPressed: String(!!(state.updAuto && state.updAuto.enabled)),
    updAutoHour: String(state.updAuto ? state.updAuto.hour : 4).padStart(2, "0") + ":00",
    doAutoToggle: () => saveAuto({ enabled: !(state.updAuto && state.updAuto.enabled) }),
    doAutoEarlier: () => saveAuto({ hour: ((state.updAuto ? state.updAuto.hour : 4) + 23) % 24 }),
    doAutoLater: () => saveAuto({ hour: ((state.updAuto ? state.updAuto.hour : 4) + 1) % 24 }),
    // Сколько минут назад панель спрашивала GitHub: без этого не понять,
    // свежий ли номер «последнего релиза» на экране.
    updCheckedLine: u && u.checked_at
      ? up.checked(Math.max(0, Math.floor((Date.now() - Date.parse(u.checked_at)) / 60000))) : "",
    updCheckLabel: state.updChecking ? up.checking : up.checkNow,
    updCheckCls: "btn btn-secondary" + (state.updChecking ? " spin" : ""),
    updCanAll: (updCanPanelNow || stale.some((n) => !n.upgrade_to || n.upgrade_to !== latest)),
    doCheckNow: () => act(async () => {
      if (state.updChecking) return;
      state.updChecking = true;
      render();
      try {
        state.updates = await api("/api/v1/updates?fresh=1");
      } finally {
        state.updChecking = false;
        render();
      }
    }),
    doUpgradeAll: () => act(async () => {
      if (!(await ask(up.upAll, up.confirmAll(latest)))) return;
      const res = await api("/api/v1/updates/all", "POST");
      if (res && res.panel) state.updWaiting = true;
      toast(up.allAsked(res ? res.asked : 0, !!(res && res.panel)));
      await loadUpdates();
    }),
    doUpgradeNodes: () => act(async () => {
      if (!(await ask(up.upNodes(stale.length), up.confirmNodes(latest)))) return;
      const res = await api("/api/v1/updates/nodes", "POST");
      toast(res && res.asked ? up.asked(res.asked, res.target) : up.noneToAsk);
      await loadUpdates();
    }),
  };
}

function renderVals() {
  const t = theme();
  const d = DENSITY[state.density] || DENSITY.normal; // отступы; скругление — t.r
  const page = state.page;

  // Словарь зовём d18, а не t: t здесь уже занято темой, и перепутать их —
  // значит получить цвет вместо надписи в самом неожиданном месте.
  const d18 = L();

  const vars = Look.vars(t) + ";" + schemeVars(t);

  // Пока первый ответ в пути и ошибки нет — скелеты на месте чисел. После
  // ошибки скелет врал бы, что вот-вот придёт; там прочерк и объяснение.
  const waiting = !state.known && !state.error;

  const users = state.users || [];
  const nodes = state.nodes || [];
  const byDay = (state.stats && state.stats.by_day) || [];
  const byNode = (state.stats && state.stats.by_node) || [];
  const total = (state.stats && state.stats.total) || 0;

  const activeUsers = users.filter((u) => u.enabled).length;
  const expiring = users.filter((u) => {
    const left = daysLeft(u.expires_at);
    return u.enabled && left !== null && left >= 0 && left <= 7;
  }).length;
  const liveNodes = nodes.filter(nodeAlive).length;

  // Показатели считаем по всем: поиск — это способ найти одного, а не
  // основание врать про то, сколько у продавца покупателей.
  const q = state.q.trim().toLowerCase();
  const found = q
    ? users.filter((u) => ((u.label || "") + " " + (u.external_id || "") + " #" + u.id).toLowerCase().includes(q))
    : users;

  // Готовые фильтры — те вопросы, ради которых продавец открывает список:
  // кому продлевать, у кого кончается трафик, кто перестал заходить.
  const weekAgo = Date.now() - 7 * 86400000;
  const FILTERS = [
    ["all", () => true],
    ["expiring", (u) => { const left = daysLeft(u.expires_at); return u.enabled && left !== null && left >= 0 && left <= 7; }],
    ["traffic", (u) => u.enabled && u.traffic_limit > 0 && (u.traffic_limit - u.used) * 10 < u.traffic_limit],
    ["idle", (u) => u.enabled && !u.online && (!u.last_seen || new Date(u.last_seen).getTime() < weekAgo)],
    ["off", (u) => !u.enabled],
    ...(state.plans || []).map((p) => ["plan:" + p.id, (u) => u.plan_id === p.id, p.name]),
  ];
  const active = FILTERS.find(([k]) => k === state.filter) || FILTERS[0];
  const shown = found.filter(active[1]);
  const filterChips = FILTERS.map(([k, fn, name]) => {
    const on = k === active[0];
    const count = found.filter(fn).length;
    return {
      label: name || d18.filters[k],
      // Строкой: ноль — тоже ответ («отключённых нет»), а число 0 шаблон
      // счёл бы ложью и спрятал.
      count: k === "all" ? "" : String(count),
      pressed: String(on),
      onClick: () => setState({ filter: k }),
      cls: "chip" + (on ? " on" : ""),
    };
  });

  // Пока не знаем, что в панели (первый ответ ещё в полёте) — подзаголовки,
  // считающие клиентов, ноды, трафик и приложения, показали бы нули и
  // «ничего не выложено». Это враньё: данных ещё нет, а не «их ноль». Пока
  // !known говорим честное «пока не знаю», а не рисуем пустоту как факт.
  const subFor = {
    dash: d18.sub.dash,
    clients: state.known ? d18.sub.clients(shown.length, users.length, activeUsers, !!q || active[0] !== "all") : d18.err.unknown,
    keys: d18.sub.keys,
    nodes: state.known ? d18.sub.nodes(nodes.length, liveNodes) : d18.err.unknown,
    stats: state.known ? d18.sub.stats(bytes(total)) : d18.err.unknown,

    alerts: d18.sub.alerts,
    journal: d18.sub.journal,
    updates: d18.sub.updates(state.updates && state.updates.latest),
    look: d18.sub.look,
  };

  // Все разделы видны всегда: прятать половину за переключателем значило
  // заставлять искать то, что есть.
  // На телефоне меню закрывается выбором раздела: иначе человек нажал пункт
  // и смотрит на то же меню поверх уже открытой страницы.
  const navGroups = NAV_GROUPS.map(([g, keys]) => ({
    label: d18.navGroups[g],
    items: keys.filter((k) => state.admin !== false || !ADMIN_PAGES.includes(k)).map((k) => ({
      k, label: d18.nav[k], current: page === k ? "page" : null,
      onClick: () => setState({ page: k, navOpen: false }),
      cls: "nav-item" + (page === k ? " on" : ""),
    })),
  })).filter((g) => g.items.length);
  const crumbGroup = (navGroups.find((g) => g.items.some((n) => n.k === page)) || {}).label || "";

  // ── обзор ────────────────────────────────────────────────────────────────
  // Пока не знаем — прочерк, а не ноль.
  //
  // Ноль здесь читается как утверждение: «клиентов нет», «трафика нет». Если
  // панель на самом деле ещё не ответила, это ложь, и ложь дорогая: продавец
  // видит пустую панель и думает, что потерял базу.
  const num = (v) => (state.known ? String(v) : "—");
  const size = (v) => (state.known ? bytes(v) : "—");

  const plans = state.plans || [];

  // kpi — плитка показателя. tone: ok — хорошо, warn — стоит взглянуть,
  // пусто — просто факт. Цвет у подписи, а не у числа: число читают первым,
  // и красить его значит кричать даже там, где всё в порядке.
  const kpi = ([label, value, delta, tone, icon, trend]) => ({
    label, value, icon: icon || "stats",
    skel: waiting, ready: !waiting,
    delta: waiting ? "" : delta,
    deltaCls: tone === "ok" ? "tone-ok" : tone === "warn" ? "tone-warn" : "",
    trend: trend ? trend.text : "", trendIco: trend ? trend.ico : "", trendTitle: trend ? trend.title : "",
  });

  // ── график трафика ───────────────────────────────────────────────────────
  // Все тридцать дней подряд, с нулями: день без трафика — тоже ответ, и
  // сжимать ось ради него нельзя.
  const days30 = [];
  for (let i = 29; i >= 0; i--) days30.push(new Date(Date.now() - i * 86400000).toISOString().slice(0, 10));
  const dayRec = new Map(byDay.map((x) => [x.day, x]));
  const series = days30.map((day) => {
    const x = dayRec.get(day);
    return [day, x ? (x.up || 0) + (x.down || 0) : 0, x ? x.up || 0 : 0, x ? x.down || 0 : 0];
  });
  const seriesPeak = series.reduce((m, [, v]) => Math.max(m, v), 0);

  // Неделя к неделе — из тех же тридцати дней, а не выдуманная: последние
  // семь против семи перед ними. Пустая прошлая неделя — сравнивать не с
  // чем, и стрелки нет вовсе.
  const sumOf = (from, to) => series.slice(from, to).reduce((s, [, v]) => s + v, 0);
  const thisWeek = sumOf(23, 30), lastWeek = sumOf(16, 23);
  const weekPct = lastWeek > 0 ? Math.round(((thisWeek - lastWeek) / lastWeek) * 100) : null;
  const trafficTrend = state.known && weekPct !== null ? {
    text: (weekPct > 0 ? "+" : weekPct < 0 ? "−" : "") + Math.abs(weekPct) + "%",
    ico: weekPct >= 0 ? "up" : "down",
    title: d18.kpi.weekTrend,
  } : null;

  const kpis = [
    [d18.kpi.activeKeys, num(activeUsers), state.known ? d18.kpi.allTotal(users.length) : d18.err.unknown, "", "clients"],
    [d18.kpi.traffic30, size(total), trafficTrend ? d18.kpi.vsWeek : d18.kpi.byAllNodes, "", "traffic", trafficTrend],
    // При нуле нод «все отвечают» — формально верно и совершенно бесполезно:
    // отвечать некому, и продавать пока нечего.
    [d18.kpi.nodesLive, state.known ? liveNodes + " / " + nodes.length : "—",
      !state.known ? d18.err.unknown
        : nodes.length === 0 ? d18.kpi.noNodes
        : liveNodes === nodes.length ? d18.kpi.allAnswer : d18.kpi.notAllAnswer,
      !state.known || nodes.length === 0 ? "" : liveNodes === nodes.length ? "ok" : "warn", "nodes"],
    [d18.kpi.expiring, num(expiring), d18.kpi.inSevenDays, expiring > 0 ? "warn" : "", "clock"],
  ].map(kpi);

  const points = series.map(([, v], i) => [(i / (series.length - 1)) * CHART_W, chartY(v, seriesPeak)]);
  const chartLine = seriesPeak ? smoothPath(points) : "";
  const chartArea = chartLine ? chartLine + "L" + CHART_W + " " + CHART_BASE + "L0 " + CHART_BASE + "Z" : "";
  const chartTotal = state.known ? bytes(total) : "";
  const chartEmpty = state.known && !seriesPeak ? d18.dash.noTrafficDays : "";
  // Наведение: ближайший день под курсором, точка на кривой и подсказка.
  const chartHover = (e) => {
    if (!seriesPeak) return;
    const box = e.currentTarget, r = box.getBoundingClientRect();
    const n = series.length;
    const i = Math.max(0, Math.min(n - 1, Math.round(((e.clientX - r.left) / r.width) * (n - 1))));
    const x = (i / (n - 1)) * r.width;
    const y = (chartY(series[i][1], seriesPeak) / CHART_H) * r.height;
    showTip(box, x, y, dayLong(series[i][0]), bytes(series[i][1]));
  };
  const barsHover = (e) => {
    if (!seriesPeak) return;
    const box = e.currentTarget, r = box.getBoundingClientRect();
    const cols = box.querySelectorAll(".bar-col");
    const i = Math.max(0, Math.min(cols.length - 1, Math.floor(((e.clientX - r.left) / r.width) * cols.length)));
    const [day, sum, up, down] = series[i];
    box.classList.add("hovering");
    cols.forEach((c, j) => c.classList.toggle("hot", j === i));
    const top = r.height - (sum / seriesPeak) * r.height;
    showTip(box, ((i + 0.5) / cols.length) * r.width, top, dayLong(day)
      + " · " + d18.statsPage.down.toLowerCase() + " " + bytes(down) + ", " + d18.statsPage.up.toLowerCase() + " " + bytes(up), bytes(sum));
  };

  // ── расход по нодам ──────────────────────────────────────────────────────
  // По node_id, а не по имени: у облачных образов имена сплошь одинаковые
  // (см. «ноды» ниже). Сначала те, что везут больше: перегруз видно сверху.
  const dashTraffic = new Map();
  for (const x of byNode) dashTraffic.set(x.node_id, (x.up || 0) + (x.down || 0));
  const dashPeak = Math.max(1, ...dashTraffic.values());
  // Точка состояния: живая пульсирует, молчащая горит ровным янтарём,
  // выключенная — пустое кольцо.
  const nodeDot = (n) => (nodeAlive(n) ? "dot ok live" : n.enabled ? "dot warn" : "dot off");
  const dashNodes = nodes.slice()
    .sort((a, b) => (dashTraffic.get(b.id) || 0) - (dashTraffic.get(a.id) || 0))
    .slice(0, 6).map((n) => {
      const alive = nodeAlive(n);
      const v = dashTraffic.get(n.id) || 0;
      return Object.assign({
        name: n.name || n.address,
        load: bytes(v),
        share: total ? Math.round((v / total) * 100) + "%" : "0%",
        state: alive ? d18.nodesPage.online : n.enabled ? d18.nodesPage.silent : d18.nodesPage.off,
        onClick: () => nodeSheet(n),
        dotCls: nodeDot(n),
        fillCls: alive ? "" : "warn",
        fill: "width:" + Math.round((v / dashPeak) * 100) + "%",
      }, flagOf(n.country));
    });

  // ── скоро кончается срок ─────────────────────────────────────────────────
  // Неделя до срока и неделя после: первым — напомнить, вторых — вернуть.
  // Кто ушёл больше недели назад, тот уже не продление, а новая продажа.
  // Сверху — у кого срок ближе всего, ушедшие — следом, свежие первыми.
  const now = Date.now();
  const soonAllList = users.filter((u) => {
    if (!u.enabled || !u.expires_at) return false;
    const ms = new Date(u.expires_at).getTime() - now;
    return ms > -7 * 86400000 && ms < 7 * 86400000;
  }).sort((a, b) => {
    const ma = new Date(a.expires_at).getTime() - now, mb = new Date(b.expires_at).getTime() - now;
    if ((ma >= 0) !== (mb >= 0)) return ma >= 0 ? -1 : 1;
    return Math.abs(ma) - Math.abs(mb);
  });
  const planOf = new Map(plans.map((p) => [p.id, p]));
  const soon = soonAllList.slice(0, 8).map((u) => {
    const ms = new Date(u.expires_at).getTime() - now;
    const p = planOf.get(u.plan_id);
    return {
      name: u.label || ("#" + u.id),
      plan: p ? p.name : d18.dash.ownTerms,
      when: ms >= 0 ? d18.dash.inDays(Math.floor(ms / 86400000)) : d18.dash.agoDays(Math.floor(-ms / 86400000)),
      whenCls: "when" + (ms < 0 ? " past" : ms < 2 * 86400000 ? " near" : ""),
      renew: plans.length ? d18.dash.renew : d18.dash.extend,
      onClick: () => userSheet(u),
      // Кнопка внутри строки: без stopPropagation нажатие открыло бы ещё и
      // карточку покупателя поверх листа продления.
      onRenew: (e) => { e.stopPropagation(); quickRenew(u); },
    };
  });

  // ── кто на каком тарифе ──────────────────────────────────────────────────
  // Только живые: включённые и со сроком впереди. Истёкшие по тарифу ещё
  // числятся, но это уже не «на тарифе», а кандидаты в список выше.
  const onPlan = new Map();
  for (const u of users) {
    const left = daysLeft(u.expires_at);
    if (u.enabled && u.plan_id && (left === null || left >= 0)) onPlan.set(u.plan_id, (onPlan.get(u.plan_id) || 0) + 1);
  }
  const onPlanPeak = Math.max(1, ...onPlan.values());
  const planRows = plans.map((p) => [p, onPlan.get(p.id) || 0])
    .sort((a, b) => b[1] - a[1]).slice(0, 5).map(([p, count]) => ({
      name: p.name,
      sum: d18.dash.onPlan(count),
      count: planLine(p),
      fill: "width:" + Math.round((count / onPlanPeak) * 100) + "%",
    }));

  function clientStatus(u) {
    if (u.frozen_at) return [d18.status.frozen, ""];
    if (!u.enabled) return [d18.status.off, ""];
    const left = daysLeft(u.expires_at);
    if (left !== null && left < 0) return [d18.status.expired, "warn"];
    if (left !== null && left <= 7) return [d18.status.expiring, "warn"];
    return [d18.status.active, "ok"];
  }

  // ── таблицы ──────────────────────────────────────────────────────────────
  // Ячейка — текст и, по надобности, вторая строка, полоса или метка.
  // Подсказка с полным текстом у каждой: длинное имя обрезано многоточием,
  // и прочитать его целиком должно быть можно без открытия карточки.
  const cell = (text, o) => Object.assign({ text: String(text), title: String(text), plain: true, cls: "t-cell" }, o || {});
  const pillCell = (text, tone) => cell(text, { plain: false, pill: "pill " + tone });
  const TABLES = {
    clients: {
      cols: [d18.col.client, d18.col.key, d18.col.until, d18.col.devices, d18.col.traffic, d18.col.status],
      grid: "minmax(0,2fr) minmax(0,1.3fr) minmax(0,1.3fr) minmax(0,.8fr) minmax(0,1.2fr) minmax(0,1fr)",
      rows: shown.map((u) => {
        const [status, st] = clientStatus(u);
        const note = expiryNote(u.expires_at, u.enabled, d18);
        const left = daysLeft(u.expires_at);
        const limit = u.traffic_limit > 0 ? u.traffic_limit : 0;
        const usedPart = limit ? Math.min(1, (u.used || 0) / limit) : 0;
        return [
          cell(u.label || ("#" + u.id), { cls: "t-cell lead-cell" }),
          cell(keyShort(u), { cls: "t-cell mono" }),
          cell(shortDate(u.expires_at), { sub: note, subCls: "t-sub" + (left !== null && left < 2 ? " warn" : ""),
            title: shortDate(u.expires_at) + (note ? " · " + note : "") }),
          cell(String(u.max_ips || "—"), { cls: "t-cell" + (u.online ? " on" : ""), title: u.online ? d18.col.online : String(u.max_ips || "—") }),
          cell(bytes(u.used) + (limit ? " / " + bytes(limit) : ""), {
            bar: limit ? "width:" + Math.round(usedPart * 100) + "%" : "", barCls: usedPart > 0.9 ? "warn" : "" }),
          pillCell(status, st),
        ];
      }),
      empty: users.length === 0 ? d18.table.noClients : (q ? d18.table.noFound : d18.table.noInFilter),
      // Строка открывает карточку подписчика. Индекс тот же, что у rows:
      // список строится из shown одним проходом.
      onRow: (i) => () => userSheet(shown[i]),
      // Галочки — только у клиентов и только у админа: ключ бота с правом
      // «read» смотрит, но не трогает.
      ids: state.admin ? shown.map((u) => u.id) : null,
    },
    keys: {
      cols: [d18.col.name, d18.col.rights, d18.col.created, d18.col.lastSeen, d18.col.status],
      grid: "minmax(0,1.6fr) minmax(0,1.6fr) minmax(0,1.1fr) minmax(0,1.1fr) minmax(0,.9fr)",
      rows: ((state.keys || [])).map((k) => [
        cell(k.name, { cls: "t-cell lead-cell" }),
        cell((k.scopes || []).join(", ") || d18.key.allRights, { cls: "t-cell mono" }),
        cell(shortDate(k.created_at)),
        cell(k.last_used_at ? shortDate(k.last_used_at) : d18.key.never),
        pillCell(k.revoked_at ? d18.status.revoked : d18.status.active, k.revoked_at ? "" : "ok"),
      ]),
      empty: d18.table.noKeys,
      onRow: (i) => () => keySheet((state.keys || [])[i]),
    },
  };

  const tbl = TABLES[page] || TABLES.clients;
  const tableCols = tbl.cols;
  const pickable = !!tbl.ids && tbl.rows.length > 0;
  // Колонка галочки — впереди сетки и шапки, иначе подписи съедут.
  const grid = (pickable ? "18px " : "") + tbl.grid;
  // Ни высоты, ни своей прокрутки: таблица длиной в свои строки, а листает
  // её рабочая область целиком. Своя прокрутка здесь превращала пустую
  // таблицу в рамку во весь экран, а заголовок прилипал бы к ней, а не к
  // верху окна.
  const tableViewport = "display:flex;flex-direction:column";
  // Над пустым списком шапка с колонками ничего не подписывает — прячем её,
  // остаётся одна строка о том, почему пусто и что сделать.
  const headHidden = state.known && tbl.rows.length === 0;
  const tableHead = "position:sticky;top:0;z-index:1;flex:none;display:" + (headHidden ? "none" : "grid") + ";grid-template-columns:" + grid
    + ";gap:16px;padding:0 16px;height:40px;align-items:center;font-size:12px;font-weight:500;color:var(--dim)"
    + ";background:var(--surf);border-radius:var(--r) var(--r) 0 0";
  // Постраничность. Рисовать тысячу строк разом браузер умеет, но человек их
  // не читает, а прокрутка перестаёт быть навигацией.
  const totalRows = tbl.rows.length;
  const lastPage = Math.max(1, Math.ceil(totalRows / ROWS));
  // Лист мог уехать за конец: покупателя удалили, найденных стало меньше.
  const curPage = Math.min(state.rowsPage, lastPage);
  const from = (curPage - 1) * ROWS;
  const pageRows = tbl.rows.slice(from, from + ROWS);

  const pageIDs = pickable ? tbl.ids.slice(from, from + ROWS) : [];
  const picked = state.picked;
  const togglePick = (ids, on) => {
    const next = new Set(picked);
    for (const id of ids) on ? next.add(id) : next.delete(id);
    setState({ picked: next });
  };
  const shownPicked = pickable ? users.filter((u) => picked.has(u.id)) : [];
  const pageAll = pageIDs.length > 0 && pageIDs.every((id) => picked.has(id));
  const pageSome = pageIDs.some((id) => picked.has(id));
  const tableRows = pageRows.map((cells, i) => ({
    onClick: tbl.onRow ? tbl.onRow(from + i) : null,
    cls: "t-row" + (pickable && picked.has(pageIDs[i]) ? " picked" : ""),
    picked: pickable && picked.has(pageIDs[i]) ? "true" : "false",
    // Нажатие на галочку не открывает карточку: событие до строки не доходит.
    onPick: pickable ? (e) => { e.stopPropagation(); togglePick([pageIDs[i]], !picked.has(pageIDs[i])); } : null,
    style: "grid-template-columns:" + grid,
    // Подпись колонки — для телефона, где строка становится карточкой.
    cells: cells.map((c, j) => Object.assign({ label: tbl.cols[j] }, c)),
  }));

  // Действие в пустом списке — то же, что в углу, и только когда список
  // пуст по-настоящему. «Никого не нашлось» по поиску не повод заводить
  // нового покупателя.
  const emptyCta = !!CTA[page] && (page === "keys" ? !(state.keys || []).length : users.length === 0);

  // Те же num()/size(), что на обзоре: пока !known — прочерк, а не голый ноль.
  // Карточка с «0» на разделе клиентов читается как «базу потеряли».
  const KPI = {
    keys: [
      [d18.kpi.keysCount, num((state.keys || []).length), d18.kpi.forBots, "", "keys"],
    ],
    stats: [
      [d18.col.traffic, size(total), d18.kpi.forPeriod, "", "traffic"],
      [d18.kpi.nodesWithTraffic, num(byNode.length), state.known ? d18.kpi.outOf(nodes.length) : d18.err.unknown, "", "nodes"],
      [d18.kpi.perDay, size(byDay.length ? total / byDay.length : 0), d18.kpi.onAverage, "", "stats"],
      [d18.statsPage.online, num(users.filter((u) => u.online).length), d18.statsPage.nowLabel, "", "clients"],
      [d18.statsPage.fresh, num(users.filter((u) => u.created_at && Date.now() - Date.parse(u.created_at) < 30 * 86400e3).length), d18.kpi.forPeriod, "", "plus"],
    ],
  };
  const pageKpis = (KPI[page] || []).map(kpi);

  // ── ноды ─────────────────────────────────────────────────────────────────
  // Трафик сводим по node_id, а не по имени. Имя ноды по умолчанию — hostname
  // сервера, и у облачных образов оно сплошь одинаковое (ubuntu/vps/localhost):
  // по имени две разные ноды слились бы в одну, и обе карточки показали бы долю
  // последней. Плюс имя вроде «constructor»/«__proto__» в объекте-литерале
  // достало бы поле из прототипа и дало бы «NaN Б» и width:NaN%. Map по
  // идентификатору снимает и совпадение имён, и ловушку прототипа разом.
  const nodeTraffic = new Map();
  for (const x of byNode) nodeTraffic.set(x.node_id, (x.up || 0) + (x.down || 0));
  const nodePeak = [...nodeTraffic.values()].reduce((m, v) => Math.max(m, v), 0) || 1;

  const nodeName = new Map(nodes.map((n) => [n.id, n.name || n.address]));
  const nodeCards = nodes.map((n) => {
    const alive = nodeAlive(n);
    const slow = alive && !!n.throttled;
    const traffic = nodeTraffic.get(n.id) || 0;
    const fl = flagOf(n.country);
    // Вход каскада сам трафика не считает — его считает выход, — поэтому
    // вместо доли важнее, куда он ведёт.
    const via = n.exit_id ? d18.nodesPage.via(nodeName.get(n.exit_id) || "?") + " · " : "";
    return Object.assign({}, fl, {
      onClick: () => nodeSheet(n),
      name: n.name || n.address,
      // Страну, у которой есть флаг, флаг и называет (полностью — в
      // подсказке); незнакомую оставляем словом, как её написал продавец.
      host: via + n.address + (n.country && !fl.flag ? " · " + n.country : "") + (n.version ? " · " + n.version : ""),
      load: bytes(traffic),
      share: total ? Math.round((traffic / total) * 100) + "%" : "0%",
      // «Режут» — нода на связи, но покупатели тянут с неё еле-еле (отчёты
      // приложений). «На связи» этого не видит, а продавцу это важнее всего.
      seen: slow ? d18.nodesPage.kbps(n.fetch_kbps) : alive ? sinceLabel(n.last_seen) : n.enabled ? d18.nodesPage.silentShort : d18.nodesPage.offShort,
      seenCls: "stat-value " + (slow ? "warn" : alive ? "ok" : n.enabled ? "warn" : ""),
      state: slow ? d18.nodesPage.slow : alive ? d18.nodesPage.online : n.enabled ? d18.nodesPage.silent : d18.nodesPage.off,
      cls: "card node-card rise lift" + (alive && !slow ? "" : " warn"),
      badgeCls: "pill " + (alive && !slow ? "ok" : n.enabled ? "warn" : ""),
      fillCls: alive ? "" : "warn",
      fill: "width:" + Math.round((traffic / nodePeak) * 100) + "%",
    });
  });

  // ── статистика ───────────────────────────────────────────────────────────
  // Столбик дня — две части: снизу скачанное, сверху отданное. Высота — от
  // самого загруженного дня, доли внутри — от суммы самого столбика.
  const dayBars = series.map(([, sum, up, down]) => ({
    h: "height:" + (sum ? Math.max(1.5, (sum / (seriesPeak || 1)) * 100) : 0) + "%",
    down: "height:" + (sum ? (down / sum) * 100 : 0) + "%",
    up: "height:" + (sum ? (up / sum) * 100 : 0) + "%",
  }));

  const nowMs = Date.now();
  const topPeak = users.reduce((m, u) => Math.max(m, u.used || 0), 0) || 1;
  const topRows = users.filter((u) => u.used > 0).sort((a, b) => b.used - a.used).slice(0, 8).map((u) => ({
    name: u.label || ("#" + u.id),
    load: bytes(u.used),
    fill: "width:" + Math.round((u.used / topPeak) * 100) + "%",
    onClick: () => userSheet(u),
  }));
  const base = { active: 0, expired: 0, off: 0 };
  for (const u of users) {
    if (!u.enabled) base.off++;
    else if (u.expires_at && Date.parse(u.expires_at) < nowMs) base.expired++;
    else base.active++;
  }
  const mixAll = users.length || 1;
  const mixRows = [["active", "ok"], ["expired", "warn"], ["off", "dim"]].map(([k, cls]) => ({
    label: d18.statsPage.mix[k], n: num(base[k]), pct: Math.round((base[k] / mixAll) * 100) + "%",
    fill: "width:" + Math.round((base[k] / mixAll) * 100) + "%", cls: "mix-fill " + cls,
  }));

  const shareRows = byNode.map((x) => {
    const traffic = (x.up || 0) + (x.down || 0);
    const f = total ? traffic / total : 0;
    return Object.assign({
      name: x.name,
      load: bytes(traffic),
      pct: Math.round(f * 100) + "%",
      fill: "width:" + Math.round(f * 100) + "%",
    }, flagOf(x.country));
  });

  // ── вид ──────────────────────────────────────────────────────────────────
  // Ручки темы. Всё, что здесь, — про выбор; сами цвета считает Look.
  // Выбор из нескольких — сегменты: выбранный приподнят, как в переключателе
  // вида у системных настроек, а не залит акцентом — пять залитых кнопок
  // подряд на странице «Вид» спорили бы с самим акцентом.
  const seg = (on) => "seg" + (on ? " on" : "");
  const pills = (keys, field, names) => keys.map((k) => ({
    focus: field + "-" + k, selected: state[field] === k,
    label: names[k] || k, onClick: () => setState({ [field]: k }), cls: seg(state[field] === k),
  }));
  const swatch = (bg, on) => "width:26px;height:26px;border-radius:" + Math.min(t.r, 8) + "px;cursor:pointer;background:" + bg
    + ";box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);outline:2px solid " + (on ? t.fg : "transparent") + ";outline-offset:2px";

  const accents = Look.ACCENTS.map((c) => ({
    label: d18.look.accent + " " + c, selected: t.acc === c,
    onClick: () => setState({ acc: c }), style: swatch(c, state.acc === c),
  }));
  // Оттенок светлой стороны: «как акцент» и любой из палитры.
  const tints = [null].concat(Look.ACCENTS).map((c) => ({
    label: c ? d18.look.tint + " " + c : d18.look.tintAuto, selected: state.tint === c,
    onClick: () => setState({ tint: c }),
    style: swatch("linear-gradient(135deg," + (c || t.acc) + "," + mix(c || t.acc, "#000000", 0.6) + ")", state.tint === c),
  }));

  // Лампа: экран, залитый настоящим фоном; нажатие в угол переносит свет.
  const litBg = (kind, dir) => Look.theme(Object.assign({}, state, { kind, dir })).bgcss;
  const LAMP = ["nw", "n", "ne", "w", "c", "e", "sw", "s", "se"];
  const lampWrap = "position:relative;height:120px;border-radius:" + t.r + "px;overflow:hidden;background:"
    + litBg(state.kind === "flat" ? "linear" : state.kind, state.dir)
    + ";border:1px solid " + t.line + ";display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr)";
  const lampHint = "position:absolute;left:0;right:0;bottom:6px;text-align:center;pointer-events:none;font-size:11px;color:" + t.dim;
  const lampZones = LAMP.map((k) => ({
    label: d18.look.dirs[k], selected: state.dir === k,
    onClick: () => setState({ dir: k, kind: state.kind === "flat" ? "linear" : state.kind }),
    cell: "display:flex;align-items:center;justify-content:center;cursor:pointer",
    sun: state.dir === k
      ? "width:22px;height:22px;border-radius:50%;background:" + t.acc + ";box-shadow:0 0 0 5px " + t.accSoft + ",0 0 22px 4px rgba(" + t.accRgb + ",.55)"
      : "width:7px;height:7px;border-radius:50%;background:" + t.fg + ";opacity:.22",
  }));
  const lightNote = state.kind === "flat" ? d18.look.lightOff : d18.look.dirs[state.dir];
  const kinds = Look.KINDS.map((k) => {
    const on = state.kind === k;
    return {
      name: d18.look.kinds[k], selected: on, onClick: () => setState({ kind: k }),
      wrap: "flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:4px;cursor:pointer;padding:3px;border-radius:"
        + (t.r + 3) + "px;border:" + (on ? "2px solid " + t.acc : "1px solid " + t.line) + ";background:" + (on ? t.accSoft : "transparent"),
      canvas: "height:36px;border-radius:" + Math.max(t.r - 3, 5) + "px;background:" + litBg(k, state.dir),
      label: "font-size:10px;text-align:center;color:" + (on ? t.acc : t.dim),
    };
  });
  const depthPct = Math.round(state.depth * 100);
  const depthNote = state.depth <= 0.3 ? d18.look.depths[0] : state.depth <= 0.5 ? d18.look.depths[1]
    : state.depth <= 0.7 ? d18.look.depths[2] : state.depth <= 0.85 ? d18.look.depths[3] : d18.look.depths[4];
  const setDepth = (e) => setState({ depth: Number(e.target.value) / 100 });

  // Фон. Ползунки не перерисовывают панель: перерисовка собирает разметку
  // заново, палец теряет ползунок на первом же движении, и затемнение
  // пришлось бы подбирать щелчками. Правим слой и подпись на месте.
  const hasBackdrop = !!state.backdropKind;
  const bd = Look.normalizeBackdrop(state.backdrop);
  state.backdrop = bd;
  const dimPct = Math.round(bd.dim * 100);
  const blurPx = bd.blur;
  const dimNote = dimPct + "%";
  const blurNote = blurPx ? blurPx + " px" : d18.look.backdropSharp;
  const keepBackdrop = (patch, noteId, text) => {
    Object.assign(state.backdrop, patch);
    Look.saveBackdrop(state.backdrop);
    paintBackdrop();
    const note = document.getElementById(noteId);
    if (note) note.textContent = text();
  };
  const setDim = (e) => keepBackdrop({ dim: Number(e.target.value) / 100 }, "bg-dim-note",
    () => e.target.value + "%");
  const setBlur = (e) => keepBackdrop({ blur: Number(e.target.value) }, "bg-blur-note",
    () => (Number(e.target.value) ? e.target.value + " px" : d18.look.backdropSharp));
  const fits = Look.FITS.map((k) => ({
    focus: "fit-" + k, selected: bd.fit === k,
    label: d18.look.fits[k],
    cls: seg(bd.fit === k),
    onClick: () => { state.backdrop.fit = k; Look.saveBackdrop(state.backdrop); paintBackdrop(); render(); },
  }));
  const pickLabel = hasBackdrop ? d18.look.backdropChange : d18.look.backdropPick;
  const pickBackdrop = () => { const el = document.getElementById("bg-file"); if (el) el.click(); };
  const tookBackdrop = async (e) => {
    const file = e.target.files && e.target.files[0];
    // Поле чистим сразу: иначе второй выбор того же файла не считается
    // изменением и события не будет вовсе.
    e.target.value = "";
    if (!file) return;
    if (!/^(image|video)\//.test(file.type || "")) { setState({ backdropBad: d18.look.backdropWrong }); return; }
    if (file.size > Look.BACKDROP_MAX) { setState({ backdropBad: d18.look.backdropBig }); return; }
    try {
      await Look.putBackdropFile(file);
    } catch (_) {
      setState({ backdropBad: d18.look.backdropNoRoom });
      return;
    }
    state.backdropBad = "";
    useBackdropFile(file);
    render();
  };
  const dropBackdrop = async () => {
    try { await Look.dropBackdropFile(); } catch (_) { /* его там и не было */ }
    state.backdropBad = "";
    useBackdropFile(null);
    render();
  };

  const radii = pills(Object.keys(Look.RADII), "radius", d18.look.radii);
  const densities = pills(Object.keys(DENSITY), "density", d18.look);
  const cards = pills(Look.CARDS, "card", d18.look.cardKinds);
  const glows = pills(Object.keys(Look.GLOWS), "glow", d18.look.glows);

  const looks = LOOKS.map((lk, i) => {
    const name = d18.themes[i];
    const on = Look.same(state, lk);
    const lt = Look.theme(Object.assign({}, lk, { acc: null, tint: null }));
    const lr = lt.r;
    return {
      name,
      sub: d18.look[lk.density], selected: on,
      // Вид задаёт всё разом; акцент и оттенок сбрасываются: у каждого свой.
      onClick: () => setState(Object.assign({ acc: null, tint: null }, lk)),
      wrap: "min-width:0;display:flex;flex-direction:column;gap:7px;cursor:pointer;padding:4px;border-radius:"
        + (t.r + 4) + "px;border:" + (on ? "2px solid " + t.acc : "1px solid " + t.line)
        + ";background:" + (on ? t.accSoft : "transparent"),
      canvas: "position:relative;height:104px;border-radius:" + Math.max(t.r - 3, 6) + "px;overflow:hidden;background:" + lt.bgcss,
      side: "position:absolute;left:0;top:0;bottom:0;width:26%;background:" + lt.surf + ";border-right:1px solid " + lt.line,
      navA: "position:absolute;left:5%;top:9%;width:17%;height:5%;border-radius:3px;background:" + lt.acc,
      navB: "position:absolute;left:5%;top:19%;width:15%;height:4%;border-radius:3px;background:" + lt.fg + ";opacity:.35",
      navC: "position:absolute;left:5%;top:27%;width:15%;height:4%;border-radius:3px;background:" + lt.fg + ";opacity:.2",
      kpiA: "position:absolute;left:31%;top:10%;width:20%;height:22%;border-radius:" + Math.round(lr * 0.3) + "px;background:" + lt.surf + ";border:1px solid " + lt.cardLine,
      kpiB: "position:absolute;left:54%;top:10%;width:20%;height:22%;border-radius:" + Math.round(lr * 0.3) + "px;background:" + lt.surf + ";border:1px solid " + lt.cardLine,
      kpiC: "position:absolute;left:77%;top:10%;width:18%;height:22%;border-radius:" + Math.round(lr * 0.3)
        + "px;background:" + lt.accSoft + ";border:1px solid " + lt.acc,
      chart: "position:absolute;left:31%;top:38%;right:5%;bottom:8%;border-radius:" + Math.round(lr * 0.3)
        + "px;background:" + lt.surf2 + ";background-image:linear-gradient(180deg,transparent 62%," + lt.acc + " 62%)",
      label: "display:flex;align-items:baseline;justify-content:space-between;gap:6px;padding:0 3px",
      name2: "font-size:12px;color:" + (on ? t.acc : t.fg),
      sub2: "font-family:JetBrains Mono,monospace;font-size:9px;color:" + t.dim,
    };
  });

  // Профили — три слота с кодами в localStorage. Пустой слот занимается
  // кнопкой «сохранить сюда»; занятый по нажатию применяется.
  const slots = Look.loadProfiles();
  const profiles = [0, 1, 2].map((i) => ({
    focus: "profile-" + i, selected: (state.slot || 0) === i,
    label: (slots[i] ? d18.look.slotFull : d18.look.slotEmpty) + " " + (i + 1),
    onClick: () => {
      const st = slots[i] ? Look.decode(slots[i]) : null;
      setState(Object.assign({ slot: i }, st || {}));
    },
    cls: seg((state.slot || 0) === i),
  }));
  const saveProfile = () => {
    slots[state.slot || 0] = Look.encode(state);
    Look.saveProfiles(slots);
    render();
  };
  const randomize = () => {
    const pick = (a) => a[Math.floor(Math.random() * a.length)];
    setState({
      preset: pick(Object.keys(PRESETS)), acc: pick([null].concat(Look.ACCENTS)), tint: pick([null, null].concat(Look.ACCENTS)),
      kind: pick(["linear", "radial", "aurora"]), dir: pick(Object.keys(Look.DIRS)),
      depth: Math.round((0.2 + Math.random() * 0.75) * 100) / 100,
      radius: pick(Object.keys(Look.RADII)), density: pick(Object.keys(DENSITY)),
      btn: pick(Look.BUTTONS), glow: pick(Object.keys(Look.GLOWS)), card: pick(Look.CARDS),
    });
  };
  const themeCode = Look.encode(state);
  const copyCode = async () => {
    try {
      await navigator.clipboard.writeText(themeCode);
      toast(d18.act.copied);
    } catch (_) { toast(d18.act.noCopy, true); }
  };
  const setCodeDraft = (e) => { state.codeDraft = e.target.value; };
  const applyCode = () => {
    const st = Look.decode(state.codeDraft);
    if (!st) { setState({ codeBad: true }); return; }
    setState(Object.assign({ codeBad: false, codeDraft: "" }, st));
  };
  const codeKeyDown = (e) => { if (e.key === "Enter") { e.preventDefault(); applyCode(); } };
  const resetLook = () => {
    setState(Object.assign({ codeBad: false, codeDraft: "" }, Look.DEFAULT));
    toast(d18.look.resetDone);
  };
  // ── с чего начать ────────────────────────────────────────────────────────
  //
  // Путь от пустой панели до первой продажи — три шага, и до сих пор нигде не
  // было сказано, в каком порядке. Показываем, пока хоть один не пройден, и
  // убираем сам собой, когда пройдены все: постоянная подсказка на рабочем
  // экране быстро становится мусором.
  const steps = [
    [nodes.length > 0, ...d18.start.node, () => setState({ page: "nodes" })],
    [users.length > 0, ...d18.start.client, () => setState({ page: "clients" })],
    [(state.keys || []).length > 0 || state.admin === false, ...d18.start.key, () => setState({ page: "keys" })],
  ];
  const doneSteps = steps.filter(([done]) => done).length;
  const startSteps = steps.map(([done, title, note, onClick], i) => ({
    num: String(i + 1), done, todo: !done,
    title, note,
    onClick: done ? null : onClick,
    cls: "start-step" + (done ? " done" : ""),
  }));

  // Пункты действий: «+» рисует значок, поэтому из подписи его убираем.
  const ctaText = (s) => String(s || "").replace(/^\+\s*/, "");
  // Ссылки «Все ноды →»: стрелку рисует значок.
  const linkText = (s) => String(s || "").replace(/\s*→$/, "");

  return {
    vars,
    // Словарь целиком: шаблон достаёт из него надписи путём через точку.
    d18,
    host: location.host,
    page,
    shellCls: state.navOpen ? "nav-open" : "",
    navOpen: !!state.navOpen,
    navOpenStr: String(!!state.navOpen),
    toggleNav: () => setState({ navOpen: !state.navOpen }),
    closeNav: () => setState({ navOpen: false }),
    // Отметка свежести — только после первого настоящего ответа: «обновлено
    // только что» над прочерками было бы неправдой.
    hasFresh: !!state.fetchedAt,
    freshText: state.fetchedAt ? d18.head.fresh(Math.floor((Date.now() - state.fetchedAt) / 1000)) : "",
    freshTitle: AUTO_PAGES.includes(page) ? d18.head.freshAuto(AUTO_EVERY / 1000) : d18.head.freshPaused,
    freshDot: "dot " + (state.error ? "warn" : AUTO_PAGES.includes(page) ? "ok live" : "off"),
    reloadLabel: state.loading ? d18.head.reloading : d18.head.reload,
    reloadCls: "btn btn-ghost btn-sm" + (state.loading ? " spin" : ""),
    doReload: () => { if (!state.loading) loadAll(); },
    doLang: () => setLang(state.lang === "ru" ? "en" : "ru"),
    doLogout: logout,
    doBackup: downloadBackup,
    isAdmin: state.admin !== false,

    navGroups,
    crumbGroup,
    pageTitle: d18.nav[page],
    pageSub: subFor[page] || "",

    // Кнопка действия есть только там, где действие вправду работает.
    // Нарисованная кнопка — это обещание, и «Скачать журнал» на разделе,
    // которого нет, стоит дороже пустого угла.
    // Подсказку «с чего начать» показываем только когда точно знаем, что
    // шаг не пройден. До первого ответа ноды/клиенты/ключи ещё пусты не
    // потому что их нет, а потому что мы их не загрузили — развернуть на
    // весь обзор «заведи первую ноду» у продавца с полной базой значит
    // соврать. Поэтому state.known впереди.
    showStart: state.known && page === "dash" && doneSteps < steps.length,
    startSteps,
    startCount: doneSteps + " / " + steps.length,
    startFill: "width:" + Math.round((doneSteps / steps.length) * 100) + "%",

    hasCta: !!CTA[page],
    pageCta: ctaText(d18.cta[page]),
    doCta: CTA[page] || null,
    // Тарифы правит только админ: тариф решает, что получат за деньги все
    // следующие покупатели. Ключ бота их видит, но кнопки ему не нужно.
    hasCta2: (page === "clients" || page === "nodes") && state.admin,
    pageCta2: page === "nodes" ? d18.cta.guard : d18.cta.plans,
    doCta2: () => (page === "nodes" ? guardSheet() : plansSheet()),

    hasError: !!state.error,
    errText: state.error || "",

    isDash: page === "dash",
    isTable: page === "clients" || page === "keys",
    isNodesPage: page === "nodes",
    isStatsPage: page === "stats",
    isLook: page === "look",
    isAlerts: page === "alerts",
    isJournal: page === "journal",
    isUpdates: page === "updates",

    // Журнал приезжает отдельным запросом и только админским токеном: это
    // летопись действий над панелью, и в общий loadAll ей незачем.
    journal: (state.journal || []).map((e) => ({
      when: journalWhen(e.at),
      actor: e.actor === "admin" ? d18.journal.admin : e.actor === "auto" ? d18.journal.auto
        : e.actor === "schedule" ? d18.journal.schedule : e.actor,
      // Кто делал — меткой: админ нейтрально, автомат акцентом, ключ бота
      // своим именем без цвета.
      actorCls: "pill plain j-actor" + (e.actor === "auto" || e.actor === "schedule" ? " acc" : ""),
      what: (d18.journal.action[e.action] || e.action) + (e.detail ? " · " + e.detail : ""),
    })),
    journalEmpty: !(state.journal || []).length,

    // ── обновления ──
    ...updatesView(t, d, d18),

    // Подписи полей плоскими значениями: разметка не умеет индексы массива,
    // и {{ d18.alerts.token[0] }} уехало бы на страницу как есть.
    alertTokenLabel: d18.alerts.token[0],
    alertTokenNote: d18.alerts.token[1],
    alertChatLabel: d18.alerts.chat[0],
    alertChatNote: d18.alerts.chat[1],
    alertTokenHint: (state.alerts && state.alerts.has_token) ? d18.alerts.tokenSaved : d18.alerts.tokenHint,
    sellerSupportLabel: d18.seller.support[0],
    sellerSupportNote: d18.seller.support[1],
    sellerRenewLabel: d18.seller.renew[0],
    sellerRenewNote: d18.seller.renew[1],
    sellerAnnounceLabel: d18.seller.announce[0],
    sellerAnnounceNote: d18.seller.announce[1],

    saveAlerts: () => act(async () => {
      const d = L();
      await api("/api/v1/alerts", "PUT", {
        enabled: document.getElementById("al-on").checked,
        // Пустой токен означает «оставить прежний»: страница его не
        // показывает и отправить обратно то, чего не знает, не может.
        bot_token: val("al-token"),
        chat_id: val("al-chat"),
      });
      await loadAlerts();
      toast(d.alerts.saved);
    }),

    scheduledBackupStatus: state.scheduledBackups?.last_error
      || (state.scheduledBackups?.last_success && !state.scheduledBackups.last_success.startsWith("0001-")
        ? d18.bk.last + new Date(state.scheduledBackups.last_success).toLocaleString(state.lang === "en" ? "en-GB" : "ru-RU") : d18.bk.never),
    webhookStatus: state.webhooks
      ? (state.webhooks.enabled ? d18.wh.pending(state.webhooks.pending || 0) : d18.wh.off) : "",
    saveWebhooks: () => act(async () => {
      await api("/api/v1/webhooks", "PUT", {
        enabled: document.getElementById("wh-on").checked,
        urls: document.getElementById("wh-urls").value.split("\n").map((s) => s.trim()).filter(Boolean),
        secret: document.getElementById("wh-secret").value,
      });
      document.getElementById("wh-secret").value = "";
      await loadAlerts();
      toast(L().wh.saved);
    }),
    // Секрет — 32 случайных байта в шестнадцатеричном виде, прямо в браузере.
    // Показываем его в поле, чтобы продавец скопировал в бота: после
    // сохранения панель его больше не отдаст.
    newWebhookSecret: () => {
      const bytes = crypto.getRandomValues(new Uint8Array(32));
      const field = document.getElementById("wh-secret");
      field.type = "text";
      field.value = Array.from(bytes, (b) => b.toString(16).padStart(2, "0")).join("");
      field.select();
      toast(L().wh.generated);
    },
    saveScheduledBackups: () => act(async () => {
      await api("/api/v1/backups", "PUT", {
        enabled: document.getElementById("bk-on").checked,
        time: val("bk-time"), keep: Number(val("bk-keep")),
        password: document.getElementById("bk-password").value,
        telegram: document.getElementById("bk-telegram").checked,
        s3: {
          enabled: document.getElementById("bk-s3").checked,
          endpoint: val("bk-endpoint"), region: val("bk-region"), bucket: val("bk-bucket"),
          prefix: val("bk-prefix"), access_key: val("bk-access"),
          secret_key: val("bk-secret"), session_token: val("bk-session"),
        },
      });
      await loadAlerts();
      toast(L().bk.saved);
    }),
    runScheduledBackup: () => act(async () => {
      toast(L().bk.sending);
      try {
        await api("/api/v1/backups/run", "POST");
        toast(L().bk.delivered);
      } finally { await loadAlerts(); }
    }),

    // Проверяет панель, а не страница: правила одни с клиентом (internal/
    // seller), и второй их копии на JavaScript разойтись с первой незачем.
    // Отказ приходит текстом — act покажет его как есть.
    saveSeller: () => act(async () => {
      const d = L();
      state.seller = await api("/api/v1/seller", "PUT", {
        support_url: val("sl-support"),
        renew_url: val("sl-renew"),
        announce: val("sl-announce"),
      });
      fillAlerts();
      toast(d.seller.saved);
    }),

    // Поиск нужен там, где список длинный и растёт. У нод и ключей их
    // единицы — поле поиска над тремя строками только мешает.
    hasSearch: page === "clients",
    filterChips,
    // Действия со списком — тем, у кого есть право users: ключу «только
    // смотреть» кнопка обещала бы то, чего ему не дадут.
    hasBulk: page === "clients" && state.admin && shown.length > 0,
    bulkLabel: d18.bulk.button(shown.length),
    pickable,
    pageAllPicked: pageAll ? "true" : pageSome ? "mixed" : "false",
    pickPage: (e) => { e.stopPropagation(); togglePick(pageIDs, !pageAll); },
    // Отмеченные, которых уже нет (удалили с другого устройства), не
    // считаем: действие над ними просто не выйдет.
    hasPicked: pickable && shownPicked.length > 0,
    pickedText: d18.bulk.picked(shownPicked.length),
    pickedActions: () => bulkSheet(shownPicked),
    pickedRemove: () => bulkRemove(shownPicked.map((u) => u.id)),
    pickClear: () => setState({ picked: new Set() }),
    doBulk: () => bulkSheet(shown),
    q: state.q,
    doSearch: (e) => setState({ q: e.target.value }),

    // Пока ждём ответа, на месте данных — только скелеты: смесь старых
    // строк с заготовками читалась бы как «загрузилась половина».
    kpis, chartTotal, chartEmpty, nodes: waiting ? [] : dashNodes,
    hasChart: !!seriesPeak && !waiting,
    chartSkel: waiting,
    chartLine, chartArea,
    chartPeak: seriesPeak ? bytes(seriesPeak) : "",
    chartHalf: seriesPeak ? bytes(seriesPeak / 2) : "",
    chartLabel: d18.dash.traffic + (state.known ? " · " + bytes(total) : ""),
    chartHover, barsHover, chartLeave: hideTip,
    firstDay: dayLabel(days30[0]),
    midDay: dayLabel(days30[15]),
    lastDay: dayLabel(days30[days30.length - 1]),
    nodesSkel: waiting,
    skelCards: [1, 2, 3],
    allNodesLabel: linkText(d18.dash.allNodes),
    soon, soonNote: state.known ? d18.dash.soonNote(soonAllList.length) : "",
    noSoon: state.known && !soonAllList.length ? d18.dash.noSoon : "",
    planRows,
    noPlanRows: !state.known ? "" : !plans.length ? d18.dash.noPlans : "",
    canPlans: !!state.admin,
    goPlans: () => plansSheet(),
    goNodes: () => setState({ page: "nodes" }),
    // «Ни одной ноды» говорим только когда действительно знаем. Иначе пусто —
    // пусть лучше будет пустое место, чем неверное утверждение.
    noNodes: state.known && nodes.length === 0,
    soonAll: state.known ? linkText(d18.dash.allClients(users.length)) : "",
    goSoon: () => setState({ page: "clients" }),

    hasTableKpis: pageKpis.length > 0,
    pageKpis, tableCols, tableViewport, tableHead,
    tableRows: waiting ? [] : tableRows,
    // Пока список в пути — шесть строк-заготовок той же сетки.
    tableSkel: waiting,
    skelRows: [1, 2, 3, 4, 5, 6].map(() => "grid-template-columns:" + tbl.grid),
    noTableRows: state.known && tableRows.length === 0,
    emptyTable: tbl.empty,
    emptyCta,
    emptyIcon: emptyCta ? (page === "keys" ? "keys" : "clients") : "search",

    hasPages: totalRows > ROWS,
    pagerText: d18.table.range(from + 1, Math.min(from + ROWS, totalRows), totalRows),
    prevPage: curPage > 1 ? () => setState({ rowsPage: curPage - 1 }) : null,
    nextPage: curPage < lastPage ? () => setState({ rowsPage: curPage + 1 }) : null,
    prevOff: String(curPage <= 1),
    nextOff: String(curPage >= lastPage),

    nodeCards: waiting ? [] : nodeCards,
    dayBars: waiting ? [] : dayBars, shareRows,
    topRows: waiting ? [] : topRows, noTop: state.known && topRows.length === 0,
    mixRows: waiting ? [] : mixRows,
    noShare: state.known && shareRows.length === 0,
    accents, looks, tints, lampWrap, lampHint, lampZones, lightNote, kinds,
    depthPct, depthNote, setDepth, radii, densities, cards, glows, profiles, saveProfile, randomize,
    hasBackdrop, fits, dimPct, blurPx, dimNote, blurNote, setDim, setBlur,
    pickLabel, pickBackdrop, tookBackdrop, dropBackdrop,
    backdropBad: state.backdropBad,
    themeCode, copyCode, applyCode, setCodeDraft, codeKeyDown, codeBad: !!state.codeBad, codeDraft: state.codeDraft || "", resetLook,
  };
}

/* ────────────────────────────────────────────────────────────────────────────
   Отрисовка
   ──────────────────────────────────────────────────────────────────────── */

const shell = document.getElementById("shell");

// Движение выключено, если человек попросил об этом систему. CSS гасит
// анимации сам, а счёт чисел идёт из скрипта — его выключаем здесь.
const calm = () => window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

// enterMotion проигрывает появление карточек при входе в раздел — и только
// тогда. Разметка пересобирается на каждое нажатие, поэтому вход отмечаем по
// смене раздела (и по первому ответу панели: до него карточки пустые), а не по
// перерисовке. Перерисовка в первые мгновения входа — подъехал ответ
// оповещений, например, — не начинает движение заново: задержка каждой
// карточки сдвигается на уже прошедшее время, и она продолжает с того же места.
let enterKey = "";
let enterAt = 0;
const ENTER_MS = 700;
function enterMotion(app) {
  const key = state.page + (state.known ? "+" : "");
  const now = performance.now();
  if (key !== enterKey) { enterKey = key; enterAt = now; }
  const past = now - enterAt;
  const on = past < ENTER_MS;
  app.classList.toggle("enter", on);
  if (!on) return;
  // Лесенка в 35 мс, но не дольше десятой карточки: на тридцати видах темы
  // последняя иначе появлялась бы через секунду. Столбики графика растут
  // своей лесенкой, чаще: их тридцать, и волна слева направо читается как
  // ось времени.
  let i = 0, g = 0;
  // Кривая трафика прорисовывается слева направо следом за своей карточкой.
  for (const el of app.querySelectorAll(".rise, .grow, .reveal")) {
    const delay = el.classList.contains("grow") ? 90 + Math.min(g++, 30) * 12
      : el.classList.contains("reveal") ? 140 : Math.min(i++, 10) * 35;
    el.style.setProperty("--d", Math.round(delay - past) + "ms");
  }
}

// countUp коротко досчитывает показатель до нового значения, когда тот
// изменился, — глаз замечает, что число новое. Помним, что было в плитке
// в прошлый раз; совпало — не трогаем: счёт на каждую перерисовку превратил
// бы плитки в игровой автомат.
const counted = new Map();
const NUMBER = /\d+(?:[.,]\d+)?/;
function countUp(app) {
  const quiet = calm();
  for (const el of app.querySelectorAll("[data-count]")) {
    const key = state.page + "|" + el.dataset.count;
    const text = el.textContent;
    const before = counted.get(key);
    counted.set(key, text);
    if (quiet || before === text) continue;
    const m = NUMBER.exec(text);
    if (!m) continue;
    const to = parseFloat(m[0].replace(",", "."));
    // С прежнего числа, если единица та же («1.8 ТБ» → «1.9 ТБ»); иначе с
    // нуля: из «900 ГБ» в «1.0 ТБ» счёт по числам соврал бы о движении.
    const pm = before && NUMBER.exec(before);
    const from = pm && before.replace(pm[0], "") === text.replace(m[0], "") ? parseFloat(pm[0].replace(",", ".")) : 0;
    if (from === to) continue;
    const decimals = (m[0].split(/[.,]/)[1] || "").length;
    const comma = m[0].includes(",");
    const head = text.slice(0, m.index), tail = text.slice(m.index + m[0].length);
    const start = performance.now();
    const step = (now) => {
      if (!el.isConnected) return;
      const k = Math.min(1, (now - start) / 650);
      const v = from + (to - from) * (1 - Math.pow(1 - k, 3));
      const shown = v.toFixed(decimals);
      el.textContent = k < 1 ? head + (comma ? shown.replace(".", ",") : shown) + tail : text;
      if (k < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }
}

// Часы панели: раз в секунду переписывают «обновлено N с назад» и, когда
// пора, тихо забирают данные заново. Перерисовкой подпись не обновляем —
// пересборка всей панели раз в секунду ради одной строки обошлась бы дорого
// и сбивала бы наведение. Пока вкладка скрыта, панель не спрашиваем вовсе:
// смотреть некому, а сервер у продавца один. Открытое окно тоже пауза:
// человек посреди действия, и данные под ним меняться не должны.
let autoNext = 0;
setInterval(() => {
  if (!state.token || document.getElementById("app").hidden || !state.fetchedAt) return;
  const note = document.getElementById("fresh-text");
  if (note) note.textContent = L().head.fresh(Math.floor((Date.now() - state.fetchedAt) / 1000));
  if (document.hidden || state.loading || !AUTO_PAGES.includes(state.page) || document.getElementById("veil")) return;
  const now = Date.now();
  if (now - state.fetchedAt < AUTO_EVERY || now < autoNext) return;
  // Следующая попытка не раньше чем через тот же срок, даже если эта не
  // удалась: упавшую панель не долбим запросами каждую секунду.
  autoNext = now + AUTO_EVERY;
  loadAll(true);
}, 1000);

function render() {
  const app = document.getElementById("app");
  const vals = renderVals();

  // Свой фон отменяет фон темы: иначе он же его и закроет. Пелена поверх
  // картинки берёт на себя то, ради чего фон темы был — читаемость текста.
  const own = !!backdropURL;
  app.setAttribute("style", vals.vars + ";height:100%;color-scheme:" + (theme().dark ? "dark" : "light") + (own ? ";--bgcss:transparent" : ""));
  app.classList.toggle("busy", state.loading);
  document.body.style.background = own ? "transparent" : theme().bgcss;
  paintBackdrop();

  // Перерисовка собирает разметку заново, а значит поле поиска — уже другой
  // элемент, и набор текста терял бы фокус на каждой букве. Запоминаем, где
  // стоял курсор, и возвращаем его в новое поле.
  const old = document.getElementById("q");
  const hadFocus = old && document.activeElement === old;
  const caret = hadFocus ? old.selectionStart : null;
  const focused = app.contains(document.activeElement) ? document.activeElement : null;
  const focusKey = focused && focused.dataset.focus;

  // Прокрутка списков тоже пропадала бы с разметкой: человек листает виды,
  // нажимает один — и оказывается наверху. Запоминаем и возвращаем.
  const scrolled = {};
  for (const el of app.querySelectorAll("[data-keep-scroll]")) scrolled[el.dataset.keepScroll] = el.scrollTop;

  const frag = document.createDocumentFragment();
  buildInto(shell.content, frag, vals);
  app.replaceChildren(frag);
  enterMotion(app);
  countUp(app);

  if (focusKey) {
    const next = Array.from(app.querySelectorAll("[data-focus]")).find((e) => e.dataset.focus === focusKey);
    if (next) next.focus({ preventScroll: true });
  }

  for (const el of app.querySelectorAll("[data-keep-scroll]")) {
    if (scrolled[el.dataset.keepScroll]) el.scrollTop = scrolled[el.dataset.keepScroll];
  }

  if (hadFocus) {
    const next = document.getElementById("q");
    if (next) {
      next.focus();
      const at = caret == null ? next.value.length : caret;
      next.setSelectionRange(at, at);
    }
  }
}

/* ────────────────────────────────────────────────────────────────────────────
   Вход
   ──────────────────────────────────────────────────────────────────────── */

function enter(token) {
  state.token = token;
  document.getElementById("login").hidden = true;
  document.getElementById("app").hidden = false;
  loadAll();
}

document.getElementById("login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const submit = document.getElementById("login-enter");
  if (submit.disabled) return;
  const err = document.getElementById("login-err");
  const token = document.getElementById("login-token").value.trim();
  if (!token) { err.textContent = L().login.empty; return; }

  submit.disabled = true;
  submit.textContent = L().login.checking;
  err.textContent = L().login.checking;
  state.token = token;
  try {
    // Проверяем токен самой дешёвой ручкой: узнать версию может только тот,
    // кто уже вошёл, так что отказ здесь — это отказ везде.
    await api("/api/v1/version");
    try { localStorage.setItem(TOKEN_KEY, token); } catch (_) { /* приватное окно */ }
    err.textContent = "";
    enter(token);
  } catch (e2) {
    state.token = null;
    err.textContent = e2.message === L().err.badToken ? L().login.wrong : e2.message;
  } finally {
    submit.disabled = false;
    submit.textContent = L().login.enter;
  }
});

state.lang = pickLang();
document.documentElement.lang = state.lang;
document.getElementById("login-lang").addEventListener("click",
  () => setLang(state.lang === "ru" ? "en" : "ru"));
paintLogin();

loadLook();
loadBackdrop();

let saved = null;
try { saved = localStorage.getItem(TOKEN_KEY); } catch (_) { /* приватное окно */ }
if (saved) enter(saved);
</script>
