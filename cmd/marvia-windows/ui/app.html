     место в ней окно перетаскивают, двойным щелчком разворачивают, кнопки
     справа (у macOS — слева) работают как системные. Верхнюю кромку окна
     ловит тонкая полоска: остальные три держит сама Windows. */
  .top { position: relative; padding: 0 0 0 16px; gap: 12px; }
  .top .lang { margin-left: auto; }
  .grip-top { position: absolute; left: 0; right: 0; top: 0; height: 5px; z-index: 5; cursor: ns-resize; }
  body[data-max="1"] .grip-top { display: none; }
  .wctl { display: flex; align-self: stretch; flex: none; }
  .wbtn { width: 46px; padding: 0; border: 0; background: transparent; color: var(--fg); display: grid; place-items: center;
    cursor: default; transition: background .12s, color .12s; }
  .wbtn svg { width: 10px; height: 10px; fill: none; stroke: currentColor; stroke-width: 1; overflow: visible; }
  .wbtn:hover { background: color-mix(in srgb, var(--fg) 9%, transparent); }
  .wbtn:active { background: color-mix(in srgb, var(--fg) 5%, transparent); }
  .wbtn.close:hover { background: #c42b1c; color: #fff; }
  .wbtn .g2, .wbtn .grest { display: none; }
  body[data-max="1"] .wbtn .gmax { display: none; }
  body[data-max="1"] .wbtn .grest { display: block; }

  /* Обои образа — свои, нарисованные кодом; поверх — слюда у Windows 11. */
  /* Обои — отдельным слоем: он чуть плывёт за курсором и оживает при
     подключении, а стекло и слюда над ним это видят. Свой фон человека их
     заменяет. Движение — свойствами translate и scale, чтобы курсор и
     состояние не перебивали друг друга. */
  #wall { position: fixed; inset: -24px; z-index: 0; pointer-events: none; display: none;
    background: var(--wallImg) center / cover no-repeat;
    transition: scale 1.6s var(--ease), filter 1.6s var(--ease), translate .6s var(--ease); }
  body[data-wall="1"] #wall { display: block; }
  body.custom-bg #wall { display: none; }
  body[data-motion="lively"][data-wall="1"] #wall { animation: wall-drift 40s ease-in-out infinite alternate; }
  @keyframes wall-drift { to { background-position: calc(50% + 40px) calc(50% - 16px); } }
  @media (prefers-reduced-motion: reduce) { #wall { transition: none; animation: none !important; } }

  /* Окно на столе — как в миниатюре: обои рамкой вокруг, внутри окно
     системы со своей тенью и скруглением. Без этого обои просто лежали
     под плашками и ни с чем не были связаны. За пустое место стола окно
     тоже тянут: это всё ещё наше окно. */
  .win { position: relative; display: flex; flex-direction: column; flex: 1; min-height: 0; }
  body[data-frame="1"] .app { padding: 18px; }
  /* Развёрнутое окно — просто окно во весь экран: рамка стола вокруг него
     выглядела режимом показа, из которого не выйти. */
  body[data-frame="1"][data-max="1"] .app { padding: 0; }
  body[data-frame="1"][data-max="1"] .win { border-radius: 0; border: 0; box-shadow: none; }
  body[data-frame="1"] .win { overflow: hidden; border-radius: var(--winR, 10px); background: var(--wallVeil);
    box-shadow: 0 26px 60px -24px rgba(0,0,0,.6), 0 0 0 1px rgba(0,0,0,.22); }
  /* Орбита с точками вокруг кнопки — наша деталь; в системных образах её нет. */
  body:not([data-shell="marvia"]) .ring > svg.halo { display: none; }

  body[data-shell="win11"] .win { --winR: 8px; -webkit-backdrop-filter: blur(60px) saturate(1.5); backdrop-filter: blur(60px) saturate(1.5);
    box-shadow: 0 26px 60px -24px rgba(0,0,0,.6), 0 0 0 1px color-mix(in srgb, var(--fg) 14%, transparent); }
  body[data-shell="mac"] .win { --winR: 16px; box-shadow: 0 30px 70px -24px rgba(0,0,0,.65), 0 0 0 1px rgba(255,255,255,.14), inset 0 1px 0 rgba(255,255,255,.18); }
  body[data-shell="xp"] .win { --winR: 8px 8px 0 0; border: 3px solid #0a5ee8; border-top: 0; }
  body[data-shell="w98"] .win { --winR: 0; padding: 3px; box-shadow: var(--bevel), 0 18px 40px -18px rgba(0,0,0,.5); }
  body[data-shell="gnome"] .win, body[data-shell="ubuntu"] .win { --winR: 12px; }
  body[data-shell="kde"] .win { --winR: 6px; }

  /* ───── Образы в духе систем ─────
     Каждый узнаётся по тому, по чему узнают саму систему: слюда и полоска
     выбора у Windows 11, стеклянная боковая у macOS, синяя панель задач XP,
     выпуклые серые кнопки 98-й, карточки-списки GNOME, голубой фокус
     Breeze, плитки с цветной рамкой у Hyprland. Обои — по мотивам, но свои:
     картинки систем принадлежат их авторам. */

  /* Windows 11: слюда, содержимое на светлом слое со скруглённым углом,
     полоска акцента у выбранной вкладки — как NavigationView. */
  body[data-shell="win11"] .top, body[data-shell="win11"] aside { background: transparent; border: 0; }
  body[data-shell="win11"] main { margin: 0 0 0 0; border-radius: 8px 0 0 0; border: 1px solid color-mix(in srgb, var(--fg) 7%, transparent);
    border-right: 0; border-bottom: 0; background: color-mix(in srgb, var(--fg) 3%, transparent); }
  body[data-shell="win11"] .tab { position: relative; border-radius: 4px; min-height: 36px; font-weight: 400; }
  body[data-shell="win11"] .tab:hover { background: color-mix(in srgb, var(--fg) 6%, transparent); }
  body[data-shell="win11"] .tab[aria-selected="true"] { background: color-mix(in srgb, var(--fg) 7%, transparent); font-weight: 600; }
  body[data-shell="win11"] .tab[aria-selected="true"]::before { content: ""; position: absolute; left: 0; top: 50%; width: 3px; height: 16px;
    margin-top: -8px; border-radius: 3px; background: var(--acc); }
  body[data-shell="win11"] .card, body[data-shell="win11"] .kpi, body[data-shell="win11"] .node, body[data-shell="win11"] .sub-card,
  body[data-shell="win11"] .set-nav, body[data-shell="win11"] .set-panes .rows > div {
    background: color-mix(in srgb, var(--surf) 72%, transparent); border: 1px solid color-mix(in srgb, var(--fg) 8%, transparent); box-shadow: none; }
  body[data-shell="win11"] .card.feature { background: color-mix(in srgb, var(--surf) 82%, transparent); }
  body[data-shell="win11"] .primary, body[data-shell="win11"] .chip, body[data-shell="win11"] .pillb { border-radius: 4px; }
  body[data-shell="win11"] .power[data-state="connected"] { background: var(--acc); }
  body[data-shell="win11"] .power[data-state="connected"] svg { color: var(--accFg); }

  /* macOS: светофор слева, боковая — плавающая плита жидкого стекла,
     карточки — матовое стекло над обоями. */
  body[data-shell="mac"] .top { background: transparent; border: 0; padding-left: 18px; }
  body[data-shell="mac"] .wctl { order: -1; align-self: center; gap: 8px; margin-right: 6px; }
  body[data-shell="mac"] .wbtn { width: 12px; height: 12px; border-radius: 50%; color: rgba(0,0,0,.6);
    box-shadow: inset 0 0 0 .5px rgba(0,0,0,.18); }
  body[data-shell="mac"] .wbtn[data-win="close"] { order: 1; background: #ff5f57; }
  body[data-shell="mac"] .wbtn[data-win="min"] { order: 2; background: #febc2e; }
  body[data-shell="mac"] .wbtn[data-win="max"] { order: 3; background: #28c840; }
  body[data-shell="mac"] .wbtn:hover { filter: brightness(.94); }
  body[data-shell="mac"] .wbtn svg { width: 6px; height: 6px; stroke-width: 1.6; opacity: 0; transition: opacity .12s; }
  body[data-shell="mac"] .wctl:hover svg { opacity: 1; }
  body[data-shell="mac"] .top { padding-right: 10px; }
  /* Жидкое стекло: почти прозрачная плита, под ней обои плывут через фильтр
     преломления, по кромке — свет сверху и тень снизу. Матовая серая плашка
     поверх обоев выглядела наклейкой: стекло обязано показывать то, что
     под ним. */
  body[data-shell="mac"] aside, body[data-shell="mac"] .card, body[data-shell="mac"] .kpi, body[data-shell="mac"] .node,
  body[data-shell="mac"] .sub-card, body[data-shell="mac"] .set-nav, body[data-shell="mac"] .set-panes .rows > div, body[data-shell="mac"] .power {
    position: relative; border: 1px solid rgba(255,255,255,.16);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.32), inset 0 -1px 0 rgba(0,0,0,.18), 0 18px 40px -22px rgba(0,0,0,.6); }
  body[data-shell="mac"] aside { margin: 0 0 12px 12px; border-radius: 20px; background: color-mix(in srgb, var(--surf) 20%, transparent);
    -webkit-backdrop-filter: blur(5px) url(#lg) saturate(1.9) brightness(1.04); backdrop-filter: blur(5px) url(#lg) saturate(1.9) brightness(1.04); }
  body[data-shell="mac"] .card, body[data-shell="mac"] .kpi, body[data-shell="mac"] .node, body[data-shell="mac"] .sub-card,
  body[data-shell="mac"] .set-nav, body[data-shell="mac"] .set-panes .rows > div {
    background: color-mix(in srgb, var(--surf) 46%, transparent);
    -webkit-backdrop-filter: blur(12px) url(#lg) saturate(1.8); backdrop-filter: blur(12px) url(#lg) saturate(1.8); }
  body[data-shell="mac"] .card.feature { background: color-mix(in srgb, var(--surf) 54%, transparent); }
  body[data-shell="mac"] .tab { border-radius: 10px; min-height: 34px; font-weight: 500; }
  body[data-shell="mac"] .tab[aria-selected="true"] { background: color-mix(in srgb, var(--fg) 14%, transparent); font-weight: 600; }
  /* Кнопка — линза: обои под ней видны и плывут сильнее всего. */
  body[data-shell="mac"] .power { background: color-mix(in srgb, var(--surf) 16%, transparent);
    -webkit-backdrop-filter: blur(2px) url(#lg) saturate(2) brightness(1.08); backdrop-filter: blur(2px) url(#lg) saturate(2) brightness(1.08);
    box-shadow: inset 0 2px 1px rgba(255,255,255,.45), inset 0 -14px 30px rgba(255,255,255,.07), 0 0 0 1px rgba(255,255,255,.18), 0 26px 50px -20px rgba(0,0,0,.6); }
  body[data-shell="mac"] .power svg { color: var(--fg); }
  body[data-shell="mac"] .power[data-state="connected"] { background: color-mix(in srgb, var(--acc) 38%, transparent); }
  body[data-shell="mac"] .power[data-state="connected"] svg { color: #fff; }
  /* Блик — неподвижный свет сверху. Пятно, бегавшее за курсором, читалось
     как сбой отрисовки, а не как стекло. */
  body[data-shell="mac"] aside::after, body[data-shell="mac"] .card::after, body[data-shell="mac"] .kpi::after,
  body[data-shell="mac"] .node::after, body[data-shell="mac"] .power::after {
    content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: linear-gradient(180deg, rgba(255,255,255,.10), transparent 38%); }
  body[data-shell="mac"] .primary, body[data-shell="mac"] .chip, body[data-shell="mac"] .pillb { border-radius: 999px; }

  /* Windows XP: синий глянцевый заголовок, панель задач слева, зелёная
     кнопка — та самая «Пуск», Tahoma. */
  body[data-shell="xp"] .top { height: 40px; border: 0; color: #fff;
    background: linear-gradient(180deg, #0997ff 0%, #0053ee 9%, #0050ee 18%, #06f 45%, #0052ea 88%, #003dd7 100%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.35); text-shadow: 1px 1px 0 rgba(0,0,0,.35); }
  body[data-shell="xp"] .top .wordmark { background: #fff; }
  body[data-shell="xp"] .top .ver { color: rgba(255,255,255,.85); }
  body[data-shell="xp"] .top button.lang { color: #fff; border-color: rgba(255,255,255,.6); }
  body[data-shell="xp"] .wctl { align-self: center; gap: 3px; margin-right: 8px; }
  body[data-shell="xp"] .wbtn { width: 24px; height: 24px; border-radius: 4px; color: #fff; border: 1px solid #fff;
    background: radial-gradient(circle at 30% 25%, #7fb4ff, #2a6cf0 60%, #1450d8); box-shadow: inset 0 0 0 1px rgba(0,0,40,.15); }
  body[data-shell="xp"] .wbtn svg { width: 9px; height: 9px; stroke-width: 2.2; }
  body[data-shell="xp"] .wbtn.close { background: radial-gradient(circle at 30% 25%, #f7a48f, #e0532f 60%, #c23412); }
  body[data-shell="xp"] .wbtn:hover { filter: brightness(1.12); background-color: transparent; }
  body[data-shell="xp"] .wbtn.close:hover { color: #fff; }
  body[data-shell="xp"] aside { border: 0; background: linear-gradient(180deg, #5b82da, #3d56c6); }
  body[data-shell="xp"] .tab { color: #fff; border-radius: 4px; font-weight: 600; text-shadow: 0 1px 1px rgba(0,0,50,.45); }
  body[data-shell="xp"] .tab svg { color: #fff; }
  body[data-shell="xp"] .tab:hover { color: #fff; text-decoration: underline; }
  body[data-shell="xp"] .tab[aria-selected="true"] { background: #fff; color: #0b3fa5; text-shadow: none; box-shadow: 0 1px 3px rgba(0,0,60,.3); }
  body[data-shell="xp"] .tab[aria-selected="true"] svg { color: #0b3fa5; }
  body[data-shell="xp"] .about-link { color: #eef3ff; }
  body[data-shell="xp"] .card, body[data-shell="xp"] .kpi, body[data-shell="xp"] .node, body[data-shell="xp"] .sub-card,
  body[data-shell="xp"] .set-nav, body[data-shell="xp"] .set-panes .rows > div {
    background: #fff; border: 1px solid #a5b6d6; border-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,60,.12); }
  body[data-shell="xp"] .card.feature { border-top: 3px solid #316ac5; }
  body[data-shell="xp"] .primary { border-radius: 3px; border: 1px solid #003c74; color: #000; font-weight: 400;
    background: linear-gradient(180deg, #fff, #ecebe6 85%, #d6d0c5); box-shadow: none; }
  body[data-shell="xp"] .chip, body[data-shell="xp"] .pillb { border-radius: 3px; border-color: #003c74;
    background: linear-gradient(180deg, #fff, #ecebe6 85%, #d6d0c5); font-weight: 400; }
  body[data-shell="xp"] .power { background: linear-gradient(180deg, #f4f7fc, #c9d6ee); box-shadow: inset 0 0 0 2px #fff, 0 0 0 1px #7f9db9, 0 14px 30px rgba(0,0,60,.25); }
  body[data-shell="xp"] .power svg { color: #1c5ad8; }
  body[data-shell="xp"] .power[data-state="connected"] { background: radial-gradient(circle at 35% 25%, #8ee07a, #3c9d2b 55%, #23731a);
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.55), 0 0 0 1px #1c5a12, 0 14px 30px rgba(20,80,10,.35); }
  body[data-shell="xp"] .power[data-state="connected"] svg { color: #fff; filter: drop-shadow(1px 1px 0 rgba(0,0,0,.35)); }

  /* Windows 98: бирюзовый стол, серые выпуклые окна с синими полосками
     заголовков, кнопки вдавливаются фаской, а не тенью. */
  body[data-shell="w98"] { --bevel: inset -1px -1px #0a0a0a, inset 1px 1px #fff, inset -2px -2px #808080, inset 2px 2px #dfdfdf;
    --sunken: inset -1px -1px #fff, inset 1px 1px #808080, inset -2px -2px #dfdfdf, inset 2px 2px #0a0a0a; }
  body[data-shell="w98"] .top { height: 30px; border: 0; color: #fff; background: linear-gradient(90deg, #000080, #1084d0); font-weight: 700; }
  body[data-shell="w98"] .top .wordmark { background: #fff; height: 12px; }
  body[data-shell="w98"] .top .ver { color: #dfe6ff; }
  body[data-shell="w98"] .top button.lang { color: #000; background: #c0c0c0; border: 0; border-radius: 0; box-shadow: var(--bevel); padding: 1px 8px; }
  body[data-shell="w98"] .wctl { align-self: center; gap: 2px; margin-right: 4px; }
  body[data-shell="w98"] .wbtn { width: 18px; height: 16px; background: #c0c0c0; color: #000; box-shadow: var(--bevel); border-radius: 0; }
  body[data-shell="w98"] .wbtn.close { margin-left: 2px; }
  body[data-shell="w98"] .wbtn svg { width: 8px; height: 8px; stroke-width: 1.8; }
  body[data-shell="w98"] .wbtn:hover, body[data-shell="w98"] .wbtn.close:hover { background: #c0c0c0; color: #000; }
  body[data-shell="w98"] .wbtn:active { box-shadow: var(--sunken); }
  body[data-shell="w98"] aside { background: #c0c0c0; border: 0; box-shadow: var(--bevel); }
  body[data-shell="w98"] .tab { color: #000; border-radius: 0; font-weight: 400; }
  body[data-shell="w98"] .tab svg { color: #000; }
  body[data-shell="w98"] .tab:hover { color: #000; }
  body[data-shell="w98"] .tab[aria-selected="true"] { background: #000080; color: #fff; font-weight: 400; }
  body[data-shell="w98"] .tab[aria-selected="true"] svg { color: #fff; }
  body[data-shell="w98"] .about-link { color: #000; }
  body[data-shell="w98"] .card, body[data-shell="w98"] .kpi, body[data-shell="w98"] .sub-card, body[data-shell="w98"] .set-nav,
  body[data-shell="w98"] .set-panes .rows > div {
    border: 0; border-radius: 0; box-shadow: var(--bevel); padding-top: calc(var(--pad) + 18px);
    background: linear-gradient(90deg, #000080, #1084d0) top / 100% 18px no-repeat, #c0c0c0; }
  body[data-shell="w98"] .side .kpi, body[data-shell="w98"] .set-nav { padding-top: calc(var(--pad) + 14px); background-size: 100% 14px, auto; }
  body[data-shell="w98"] .node { border-radius: 0; background: #c0c0c0; border: 0; box-shadow: var(--bevel); }
  body[data-shell="w98"] .primary, body[data-shell="w98"] .chip, body[data-shell="w98"] .pillb { border-radius: 0; border: 0; background: #c0c0c0;
    color: #000; font-weight: 400; box-shadow: var(--bevel); }
  body[data-shell="w98"] .primary:active, body[data-shell="w98"] .chip:active, body[data-shell="w98"] .pillb:active { box-shadow: var(--sunken); transform: none; }
  body[data-shell="w98"] .chip[aria-pressed="true"], body[data-shell="w98"] .pillb[aria-pressed="true"] { box-shadow: var(--sunken); background: #dcdcdc; }
  body[data-shell="w98"] .power { border-radius: 0; width: 170px; height: 170px; background: #c0c0c0; box-shadow: var(--bevel), 6px 6px 0 rgba(0,0,0,.35); }
  body[data-shell="w98"] .power:active { box-shadow: var(--sunken); transform: translate(1px, 1px); }
  body[data-shell="w98"] .power svg { color: #000; }
  body[data-shell="w98"] .power[data-state="connected"] svg { color: #000080; }
  body[data-shell="w98"] .ring > svg { display: none; }
  body[data-shell="w98"] .rows .switch { border-radius: 0; box-shadow: var(--sunken); background: #fff; border: 0; }
  body[data-shell="w98"] .rows .switch::after { border-radius: 0; background: #c0c0c0; box-shadow: var(--bevel); }

  /* GNOME: заголовок как headerbar, круглые кнопки окна, карточки-списки
     со скруглением 12. Как в Adwaita, слои различаются тоном: боковая
     панель темнее содержимого, карточки светлее фона и обведены. Раньше
     всё было одним белым, и выбранный раздел терялся. */
  body[data-shell="gnome"] .top, body[data-shell="ubuntu"] .top { border: 0; background: color-mix(in srgb, var(--bg) 70%, transparent);
    box-shadow: 0 1px 0 color-mix(in srgb, var(--fg) 8%, transparent); }
  body[data-shell="gnome"] .wctl, body[data-shell="ubuntu"] .wctl, body[data-shell="kde"] .wctl { align-self: center; gap: 10px; margin: 0 12px 0 4px; }
  body[data-shell="gnome"] .wbtn, body[data-shell="ubuntu"] .wbtn, body[data-shell="kde"] .wbtn { width: 24px; height: 24px; border-radius: 50%; }
  body[data-shell="gnome"] .wbtn, body[data-shell="ubuntu"] .wbtn { background: color-mix(in srgb, var(--fg) 10%, transparent); }
  body[data-shell="gnome"] .wbtn svg, body[data-shell="ubuntu"] .wbtn svg, body[data-shell="kde"] .wbtn svg { width: 8px; height: 8px; stroke-width: 1.6; }
  body[data-shell="gnome"] .wbtn:hover, body[data-shell="ubuntu"] .wbtn:hover { background: color-mix(in srgb, var(--fg) 16%, transparent); }
  body[data-shell="gnome"] .wbtn.close:hover { background: color-mix(in srgb, var(--fg) 16%, transparent); color: var(--fg); }
  body[data-shell="gnome"] aside, body[data-shell="ubuntu"] aside { border: 0; background: color-mix(in srgb, var(--fg) 6%, var(--bg));
    box-shadow: inset -1px 0 0 color-mix(in srgb, var(--fg) 8%, transparent); }
  body[data-shell="gnome"] .tab, body[data-shell="ubuntu"] .tab { border-radius: 6px; font-weight: 400; }
  body[data-shell="gnome"] .tab:hover, body[data-shell="ubuntu"] .tab:hover { background: color-mix(in srgb, var(--fg) 6%, transparent); }
  body[data-shell="gnome"] .tab[aria-selected="true"], body[data-shell="ubuntu"] .tab[aria-selected="true"] {
    background: color-mix(in srgb, var(--acc) 16%, transparent); color: var(--fg); font-weight: 600; }
  body[data-shell="gnome"] .tab[aria-selected="true"] svg { color: var(--acc); }
  body[data-shell="gnome"] .card, body[data-shell="gnome"] .kpi, body[data-shell="gnome"] .node, body[data-shell="gnome"] .sub-card,
  body[data-shell="gnome"] .set-nav, body[data-shell="gnome"] .set-panes .rows > div {
    background: var(--surf); border: 1px solid color-mix(in srgb, var(--fg) 9%, transparent);
    box-shadow: 0 1px 2px rgba(0,0,6,.06), 0 2px 8px rgba(0,0,6,.05); }
  body[data-shell="gnome"] .primary, body[data-shell="gnome"] .chip, body[data-shell="gnome"] .pillb { border-radius: 6px; }
  body[data-shell="gnome"] .chip, body[data-shell="gnome"] .pillb { border: 0; background: color-mix(in srgb, var(--fg) 8%, transparent); }
  /* Кнопка — «suggested action» Adwaita: акцентом и выключенной, иначе
     белый круг на белом не читается как главное действие экрана. */
  body[data-shell="gnome"] .power { background: color-mix(in srgb, var(--acc) 12%, var(--surf));
    border: 1px solid color-mix(in srgb, var(--acc) 35%, transparent); box-shadow: 0 1px 3px rgba(0,0,6,.12), 0 18px 40px -16px rgba(0,0,6,.25); }
  body[data-shell="gnome"] .power svg { color: var(--acc); }
  body[data-shell="gnome"] .power[data-state="connected"] { background: var(--acc); }
  body[data-shell="gnome"] .power[data-state="connected"] svg { color: var(--accFg); }

  /* Ubuntu: то же семейство, но оранжевый крестик, оранжевые значки
     выбора и свой шрифт. */
  body[data-shell="ubuntu"] .wbtn.close { background: #e95420; color: #fff; }
  body[data-shell="ubuntu"] .wbtn.close:hover { background: #f06b3b; color: #fff; }
  body[data-shell="ubuntu"] .tab[aria-selected="true"] svg { color: var(--acc); }
  body[data-shell="ubuntu"] .card, body[data-shell="ubuntu"] .kpi, body[data-shell="ubuntu"] .node, body[data-shell="ubuntu"] .sub-card,
  body[data-shell="ubuntu"] .set-nav, body[data-shell="ubuntu"] .set-panes .rows > div {
    background: color-mix(in srgb, var(--surf) 90%, transparent); border: 1px solid color-mix(in srgb, var(--fg) 7%, transparent); box-shadow: 0 8px 24px -16px rgba(0,0,0,.6); }
  body[data-shell="ubuntu"] .primary, body[data-shell="ubuntu"] .chip, body[data-shell="ubuntu"] .pillb { border-radius: 6px; }

  /* KDE Plasma: свёрнуть и развернуть — шевроны, крестик краснеет в круге,
     выбор и наведение — голубой рамкой фокуса Breeze. */
  body[data-shell="kde"] .top { border: 0; background: color-mix(in srgb, var(--bg) 85%, transparent); }
  body[data-shell="kde"] .wbtn .g1 { display: none; }
  body[data-shell="kde"] .wbtn .g2 { display: block; }

  body[data-shell="kde"] .power { box-shadow: inset 0 0 0 1px var(--line), 0 18px 40px rgba(0,0,0,.45); }
  body[data-shell="kde"] .power[data-state="connected"] { box-shadow: inset 0 0 0 2px var(--acc), 0 0 0 4px rgba(var(--accRgb), .25), 0 18px 40px rgba(0,0,0,.45); }

  /* Плиточные — Hyprland, Nord, Gruvbox: окно делится на плитки с зазорами,
     у активной (содержимое) — цветная рамка, у остальных — серая. Сверху —
     бар из капсул, как waybar. */
  body[data-shell="tile"] .app { padding: 8px; }
  body[data-shell="tile"] .win { gap: 8px; }
  body[data-shell="tile"] .body { gap: 8px; }
  body[data-shell="tile"] .top, body[data-shell="tile"] aside, body[data-shell="tile"] main {
    position: relative; border: 0; border-radius: var(--r); background: color-mix(in srgb, var(--bg) 72%, transparent);
    -webkit-backdrop-filter: blur(18px) saturate(1.2); backdrop-filter: blur(18px) saturate(1.2); }
  body[data-shell="tile"] main { background: color-mix(in srgb, var(--bg) 50%, transparent); }
  body[data-shell="tile"] .top { height: 40px; padding-left: 12px; font-family: var(--mono); }
  body[data-shell="tile"] .top::after, body[data-shell="tile"] aside::after, body[data-shell="tile"] main::after {
    content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 2px; pointer-events: none;
    background: var(--line);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
            mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); }
  body[data-shell="tile"] main::after { background: linear-gradient(45deg, var(--tileA, var(--acc)), var(--tileB, var(--acc))); }
  body[data-shell="tile"] .wctl { align-self: center; gap: 6px; margin-right: 8px; }
  body[data-shell="tile"] .wbtn { width: 28px; height: 22px; border-radius: 7px; background: var(--surf); }
  body[data-shell="tile"] .wbtn svg { width: 8px; height: 8px; stroke-width: 1.6; }
  body[data-shell="tile"] .wbtn.close:hover { background: var(--fail); color: var(--bg); }
  body[data-shell="tile"] .tab { font-family: var(--mono); font-size: 13px; border-radius: 8px; font-weight: 500; }
  body[data-shell="tile"] .tab[aria-selected="true"] { background: var(--acc); color: var(--accFg); font-weight: 700; }
  body[data-shell="tile"] .tab[aria-selected="true"] svg { color: var(--accFg); }
  body[data-shell="tile"] .card, body[data-shell="tile"] .kpi, body[data-shell="tile"] .node, body[data-shell="tile"] .sub-card,
  body[data-shell="tile"] .set-nav, body[data-shell="tile"] .set-panes .rows > div { background: var(--surf); border: 0; box-shadow: none; }

    box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--acc), 0 0 40px -6px rgba(var(--accRgb), .6); }

  /* ───── Обзор: живое состояние и обещания ─────
     Технические значения — моноширинным, как в журнале, но каждое с
     человеческой строкой под ним: что это значит для вас. Полоска слева —
     состояние: работает, ждёт подключения, требует внимания. */
  .ov-sum { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-radius: var(--r);
    background: var(--cardBg, var(--surf)); border: 1px solid var(--cardLine); font-size: 13.5px; font-weight: 600; color: var(--fg); }

  .ov-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }

  .ov::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 0 3px 3px 0; background: var(--line); }

  .ov .k { font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }

  .ov .s { font-size: 11.5px; line-height: 1.4; color: var(--dim); }
  .set-head .h3 { font-size: 17px; margin-top: 10px; }

    background: var(--cardBg, var(--surf)); border: 1px solid var(--cardLine); }

  /* Строки «в работе: …» под настройками — моноширинным: это значения, а не

  .rows .sub[id$="-msg"]:not(:empty) { font-family: var(--mono); font-size: 11px; color: var(--acc); }
  .span-pick .chip { min-height: 26px; padding: 0 10px; font-size: 11.5px; }

  /* ───── Прозрачная: настоящий рабочий стол сквозь окно ─────
     Под окном — обои рабочего стола, сдвинутые по месту окна на экране.
     Панели полупрозрачные: читаются, но стол не закрывают. Без обоев —
     нарисованный цветок и пелена. */
  /* Когда обои стола найдены, они — слой #wall под окном, со сдвигом по
     месту окна на экране; размытие и затемнение — ручками в точной настройке. */
  body[data-desk="1"] #wall { transition: none; }
  body[data-desk="1"] #field { display: none; }
  /* Затемнение стола — пеленой поверх обоев; размытие её не портит:
     ровный цвет и размытым остаётся ровным. */
  body[data-desk="1"] #wall::after { content: ""; position: absolute; inset: 0; background: var(--wallVeil, transparent); }
  /* Сквозное окно: страница не закрашивает ничего, кроме пелены, —
     под ней то, что Windows показывает за окном. Узор фона тоже прячем:
     точки поверх чужих окон выглядят грязью на экране, а не узором. */
  html[data-through="1"], html[data-through="1"] body { background: transparent; }
  html[data-through="1"] body::before { display: none; }
  html[data-through="1"] #wall { background: none; filter: none; }
  body[data-shell="clear"] .top, body[data-shell="clear"] aside { background: transparent; border: 0; }
  body[data-shell="clear"] main { border-radius: 10px 0 0 0; background: color-mix(in srgb, var(--bg) 26%, transparent);
    border: 1px solid color-mix(in srgb, var(--fg) 8%, transparent); border-right: 0; border-bottom: 0; }
  body[data-shell="clear"] .card, body[data-shell="clear"] .kpi, body[data-shell="clear"] .node, body[data-shell="clear"] .sub-card,
  body[data-shell="clear"] .set-nav, body[data-shell="clear"] .set-panes .rows > div {
    background: color-mix(in srgb, var(--surf) 58%, transparent); border: 1px solid color-mix(in srgb, var(--fg) 10%, transparent);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.06); }
  body[data-shell="clear"] .tab { border-radius: 6px; font-weight: 500; }
  body[data-shell="clear"] .tab[aria-selected="true"] { background: color-mix(in srgb, var(--fg) 10%, transparent); }
  body[data-shell="clear"] .status, body[data-shell="clear"] .head .title { text-shadow: 0 1px 12px rgba(0,0,0,.45); }
  body[data-shell="clear"] .power { background: color-mix(in srgb, var(--surf) 40%, transparent); box-shadow: inset 0 1px 0 rgba(255,255,255,.18), 0 0 0 1px rgba(255,255,255,.12), 0 20px 50px -20px rgba(0,0,0,.6); }
  body[data-shell="clear"] .power[data-state="connected"] { background: color-mix(in srgb, var(--acc) 45%, transparent); }
  .vibe-art[data-shell="clear"] .mw { --vwr: 8px; background: rgba(28,28,28,.42); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    box-shadow: 0 0 0 1px rgba(255,255,255,.18), 0 10px 24px -10px rgba(0,0,0,.55); }
  .vibe-art[data-shell="clear"] .mw-side { background: transparent; }

  /* ───── «Сделайте окно своим» ───── */
  .own { padding: calc(var(--pad) + 2px); border-radius: calc(var(--r) + 4px); border: 1px solid rgba(var(--accRgb), .35);
    background: linear-gradient(135deg, rgba(var(--accRgb), .16), rgba(var(--accRgb), .04)), var(--cardBg, var(--surf)); display: flex; flex-direction: column; gap: 12px; }
  .own-head { display: flex; flex-direction: column; gap: 2px; }
  .own-head b { font-size: 18px; letter-spacing: -.01em; }
  .own-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .own-tile { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 14px; border-radius: var(--r); cursor: pointer; text-align: left;
    background: var(--surf); border: 1px solid var(--line); color: var(--fg); font: inherit; transition: transform .3s var(--ease), border-color .3s; }
  .own-tile:hover { border-color: var(--acc); transform: translateY(-2px); }
  .own-tile b { font-size: 14px; }
  .own-tile small { font-size: 12px; line-height: 1.4; color: var(--dim); }
  .own-ico { font-style: normal; width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; margin-bottom: 4px;
    background: rgba(var(--accRgb), .14); color: var(--acc); font-size: 16px; }
  @media (max-width: 900px) { .own-row { grid-template-columns: 1fr; } }
  /* Свой файл фоном закрывает и образ, и обои стола: пока он стоит, кнопка
     «Убрать» — здесь, на виду, а не в глубине точной настройки. Иначе
     человек перебирает образы, а фон не меняется. */
  .own-now { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 10px 10px 14px;
    border-radius: var(--r); background: var(--surf); border: 1px solid var(--acc); font-size: 13px; }
  .own-now[hidden] { display: none; }

  /* ───── Миниатюры: обои и маленькое окно образа ───── */
  .vibes { grid-auto-columns: 226px; }
  .vibe-art { position: relative; height: 128px; border-radius: calc(var(--r) + 2px); overflow: hidden; display: block;
    background-size: cover; background-position: center; box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); }
  .mw { position: absolute; left: 14%; right: 14%; top: 16%; bottom: 12%; display: flex; flex-direction: column; overflow: hidden;
    border-radius: var(--vwr, 6px); background: var(--vbg); color: var(--vfg); box-shadow: 0 10px 24px -10px rgba(0,0,0,.55), 0 0 0 1px rgba(0,0,0,.18);
    transition: transform .45s cubic-bezier(.2,.9,.25,1.1); }
  .vibe:hover .mw { transform: translateY(-3px) scale(1.03); }
  .mw-bar { height: 14px; flex: none; display: flex; align-items: center; justify-content: flex-end; gap: 3px; padding: 0 5px;
    background: var(--vbar, var(--vbg)); }
  .mw-bar i { width: 7px; height: 5px; display: block; border-radius: 1px; background: color-mix(in srgb, var(--vfg) 45%, transparent); }
  .mw-body { flex: 1; display: flex; min-height: 0; }
  .mw-side { width: 26%; flex: none; background: var(--vside, color-mix(in srgb, var(--vfg) 5%, transparent)); }
  .mw-main { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 4px; }
  .mw-btn { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: var(--vacc);
    background: color-mix(in srgb, var(--vsurf) 85%, transparent); box-shadow: inset 0 0 0 1.5px var(--vacc); }
  .mw-btn i { width: 10px; height: 10px; border-radius: 50%; border: 1.8px solid currentColor; border-top-color: transparent; position: relative; }
  .mw-btn i::after { content: ""; position: absolute; left: 50%; top: -4px; width: 1.8px; height: 6px; margin-left: -.9px; border-radius: 2px; background: currentColor; }
  .vibe .mini-status { max-width: 100%; font: 700 10px/1.1 var(--vfont); color: var(--vfg); white-space: nowrap; overflow: hidden;
    text-transform: var(--vcase); letter-spacing: var(--vtrack); }
  .vibe-groups { display: flex; gap: 6px; flex-wrap: wrap; }
  .vibe-groups .chip { min-height: 30px; font-size: 12px; padding: 0 12px; }

  .vibe-art[data-shell="mac"] .mw { --vwr: 9px; }
  .vibe-art[data-shell="mac"] .mw-bar { justify-content: flex-start; background: transparent; }
  .vibe-art[data-shell="mac"] .mw-bar i { width: 5px; height: 5px; border-radius: 50%; }
  .vibe-art[data-shell="mac"] .mw-bar i:nth-child(1) { background: #ff5f57; }
  .vibe-art[data-shell="mac"] .mw-bar i:nth-child(2) { background: #febc2e; }
  .vibe-art[data-shell="mac"] .mw-bar i:nth-child(3) { background: #28c840; }
  .vibe-art[data-shell="mac"] .mw-side { margin: 0 0 4px 4px; border-radius: 6px; background: color-mix(in srgb, var(--vfg) 12%, transparent); }
  .vibe-art[data-shell="mac"] .mw { background: color-mix(in srgb, var(--vbg) 82%, transparent); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
  .vibe-art[data-shell="xp"] .mw { --vwr: 6px 6px 0 0; }
  .vibe-art[data-shell="xp"] .mw-bar { height: 15px; background: linear-gradient(180deg, #3d95ff, #0053ee 40%, #003dd7); }
  .vibe-art[data-shell="xp"] .mw-bar i { width: 8px; height: 8px; border-radius: 2px; border: 1px solid #fff; background: #2a6cf0; }
  .vibe-art[data-shell="xp"] .mw-bar i:last-child { background: #e0532f; }
  .vibe-art[data-shell="xp"] .mw-side { background: linear-gradient(180deg, #7ba2e7, #6375d6); }
  .vibe-art[data-shell="xp"] .mw-btn { background: radial-gradient(circle at 35% 25%, #8ee07a, #3c9d2b 55%, #23731a); color: #fff; box-shadow: none; }
  .vibe-art[data-shell="w98"] .mw { --vwr: 0; box-shadow: inset -1px -1px #0a0a0a, inset 1px 1px #fff, inset -2px -2px #808080, inset 2px 2px #dfdfdf, 4px 4px 0 rgba(0,0,0,.3); padding: 2px; }
  .vibe-art[data-shell="w98"] .mw-bar { background: linear-gradient(90deg, #000080, #1084d0); }
  .vibe-art[data-shell="w98"] .mw-bar i { width: 7px; height: 6px; border-radius: 0; background: #c0c0c0; box-shadow: inset -1px -1px #0a0a0a, inset 1px 1px #fff; }
  .vibe-art[data-shell="w98"] .mw-btn { border-radius: 0; background: #c0c0c0; color: #000; box-shadow: inset -1px -1px #0a0a0a, inset 1px 1px #fff, inset -2px -2px #808080; }
  .vibe-art[data-shell="w98"] .mw-side { background: #c0c0c0; box-shadow: inset -1px 0 #808080; }
  .vibe-art[data-shell="gnome"] .mw, .vibe-art[data-shell="ubuntu"] .mw { --vwr: 9px; }
  .vibe-art[data-shell="gnome"] .mw-bar i, .vibe-art[data-shell="ubuntu"] .mw-bar i, .vibe-art[data-shell="kde"] .mw-bar i { width: 6px; height: 6px; border-radius: 50%; }
  .vibe-art[data-shell="ubuntu"] .mw-bar i:last-child { background: #e95420; }
  .vibe-art[data-shell="kde"] .mw-bar i:last-child { background: #da4453; }
  .vibe-art[data-shell="tile"] .mw { left: 6%; right: 6%; top: 10%; bottom: 8%; background: transparent; box-shadow: none; gap: 3px; }
  .vibe-art[data-shell="tile"] .mw-bar { border-radius: 4px; background: color-mix(in srgb, var(--vbg) 85%, transparent); }
  .vibe-art[data-shell="tile"] .mw-body { gap: 3px; }
  .vibe-art[data-shell="tile"] .mw-side { border-radius: 4px; background: color-mix(in srgb, var(--vbg) 85%, transparent); box-shadow: inset 0 0 0 1px var(--vline); }
  .vibe-art[data-shell="tile"] .mw-main { border-radius: 4px; background: color-mix(in srgb, var(--vbg) 85%, transparent);
    box-shadow: inset 0 0 0 1.5px var(--vacc); }
  .vibe-art[data-shell="win11"] .mw { --vwr: 7px; background: color-mix(in srgb, var(--vbg) 90%, transparent); }
  .vibe-art[data-shell="win11"] .mw-bar i { width: 6px; height: 1px; border-radius: 0; }

  /* ───── Наши образы: Графит, Точка, Бумага ───── */
  .dotnum { height: .82em; width: auto; fill: currentColor; vertical-align: -.02em; overflow: visible; }
  body[data-vibe="graphite"] .power::before { content: ""; position: absolute; inset: 0; border-radius: 50%; pointer-events: none;
    background: linear-gradient(115deg, transparent 35%, rgba(255,255,255,.16) 48%, transparent 60%) -200% 0 / 300% 100% no-repeat;
    animation: sheen 6s ease-in-out infinite; }
  @keyframes sheen { 0%, 60% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
  body[data-vibe="dot"] .status::before, body[data-vibe="paper"] .status::before {
    content: ""; display: inline-block; width: .32em; height: .32em; margin-right: .45em; vertical-align: .18em; border-radius: 50%;
    background: var(--dim); opacity: .5; }
  body[data-vibe="dot"][data-state="connected"] .status::before, body[data-vibe="paper"][data-state="connected"] .status::before {
    background: var(--acc); opacity: 1; animation: rec 1.6s steps(1) infinite; box-shadow: 0 0 10px var(--acc); }
  @keyframes rec { 50% { opacity: .15; } }

  @media (prefers-reduced-motion: reduce) {
    body[data-vibe] .power::before, body[data-vibe] .status::before { animation: none !important; }
  }
</style>
</head>
<body data-state="idle">
<div id="bg-layer" hidden></div>
<div id="bg-veil" hidden></div>
<div id="wall" aria-hidden="true"></div>
<!-- Преломление «жидкого стекла»: обои под панелью плывут, как под толстым
     стеклом. Только для macOS-образов — фильтр не бесплатный. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="lg" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.006 0.009" numOctaves="2" seed="7" result="n"/>
    <feGaussianBlur in="n" stdDeviation="4" result="m"/>
    <feDisplacementMap in="SourceGraphic" in2="m" scale="70" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>
<canvas id="field" aria-hidden="true"></canvas>
<!-- Заставка: знак из точек, слово, затем интерфейс. Видна сразу, до кода:
     иначе мелькнул бы интерфейс, а потом заставка поверх него. -->
<div id="splash" aria-hidden="true">
  <canvas id="splash-dots"></canvas>
  <span class="logo"></span>
  <span class="wordmark">MARVIA</span>
</div>
<div class="app" id="desk">
<div class="win">

  <header class="top" id="titlebar">
    <i class="grip-top" id="grip-top" aria-hidden="true"></i>
    <div class="brand">
      <span class="logo" aria-hidden="true"></span>
      <span class="wordmark">MARVIA</span>
      <span class="ver" id="version"></span>
    </div>
    <button class="lang" id="lang" type="button"></button>
    <!-- Кнопки окна: системных больше нет, вид — от образа, действие — у окна. -->
    <div class="wctl" id="wctl">
      <button class="wbtn" type="button" data-win="min"><svg class="g1" viewBox="0 0 10 10"><path d="M0 5.5h10"/></svg><svg class="g2" viewBox="0 0 10 10"><path d="M1 3.5l4 4 4-4"/></svg></button>
      <button class="wbtn" type="button" data-win="max"><svg class="g1 gmax" viewBox="0 0 10 10"><rect x=".5" y=".5" width="9" height="9"/></svg><svg class="g1 grest" viewBox="0 0 10 10"><path d="M2.5 2.5V.5h7v7h-2"/><rect x=".5" y="2.5" width="7" height="7"/></svg><svg class="g2" viewBox="0 0 10 10"><path d="M1 6.5l4-4 4 4"/></svg></button>
      <button class="wbtn close" type="button" data-win="close"><svg viewBox="0 0 10 10"><path d="M.5.5l9 9M9.5.5l-9 9"/></svg></button>
    </div>
  </header>

  <div class="body">
    <aside>
      <button class="tab" data-tab="home" aria-selected="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v9"/><path d="M6.3 6.3a8 8 0 1 0 11.4 0"/></svg>
        <span data-t="tabHome">Туннель</span>
      </button>
      <button class="tab" data-tab="nodes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>
        <span data-t="tabNodes">Серверы</span>
      </button>
      <button class="tab" data-tab="diag">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7.5"/><path d="M21 21l-4.6-4.6"/><path d="M6.5 11h2.2l1.3-2.6 2 5.2 1.3-2.6h2.2"/></svg>
        <span data-t="tabDiag">Диагностика</span>
      </button>
      <button class="tab" data-tab="theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 0 18c1.5 0 2-1 2-2s-1-1.5-1-2.5S14 15 15 15h2a4 4 0 0 0 4-4 8 8 0 0 0-9-8z"/><circle cx="7.5" cy="11.5" r="1"/><circle cx="10.5" cy="7.5" r="1"/><circle cx="15.5" cy="7.5" r="1"/></svg>
        <span data-t="tabTheme">Тема</span>
      </button>
      <button class="tab" data-tab="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        <span data-t="tabSettings">Настройки</span>
        <i class="news"></i>
      </button>

      <div class="spacer"></div>

      <!--
        Подписка: до какого числа и сколько трафика осталось. Человек
        заплатил и вправе это видеть, не спрашивая продавца, — а продавец
        вправе не отвечать на такое вручную каждому.
      -->
      <div class="sub-card">
        <div class="t" id="sub-title"></div>
        <div class="s" id="subscription"></div>
      </div>

      <!-- «О нас» живёт в настройках; ссылка снизу — короткий путь туда. -->
      <button class="about-link" id="about-link" type="button" data-about>
        <span class="logo" aria-hidden="true"></span>
        <span data-t="tabAbout">О нас</span>
      </button>
    </aside>

    <main>
      <div class="head">
        <div>
          <div class="title" id="page-title"></div>
          <div class="sub" id="page-sub"></div>
        </div>
      </div>

      <!-- -------------------------------------------------------- главная -->
      <section class="page" data-tab="home" data-open>
        <div id="elev-warn" class="warn" data-t="elevWarn" hidden></div>

        <div class="split">
          <div class="hero wide">
            <div class="ring">
              <!--
                Ореол как на телефоне: три тонких кольца и две точки на орбите.
                Ближнее кольцо уходит под кнопку, видны два. Рисуется акцентом
                темы, поэтому в каждой палитре свой.
              -->
              <svg class="halo" viewBox="-180 -180 360 360" aria-hidden="true">
                <circle r="90"/><circle r="109"/><circle r="127"/>
                <circle class="orbit a" r="2.4" cx="-93" cy="-54"/><circle class="orbit b" r="2.4" cx="94" cy="54"/>
              </svg>
              <!--
                Дуга рисуется отдельно от кнопки: у кнопки свой объём и свои
                варианты из темы, а дуга одна на все — и она же крутится,
                пока подключаемся.
              -->
              <svg viewBox="0 0 216 216" aria-hidden="true">
                <defs>
                  <linearGradient id="arcGrad" x1="0" y1="0" x2="1" y2="1">
                    <stop class="arc-a" offset="0"/>
                    <stop class="arc-b" offset="1"/>
                  </linearGradient>
                </defs>
                <circle cx="108" cy="108" r="104"/>
              </svg>
              <button class="power" id="power" data-state="idle" title="">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 3v9"/><path d="M6.3 6.3a8 8 0 1 0 11.4 0"/>
                </svg>
              </button>
            </div>

            <div>
              <div class="status" id="status"></div>
              <div class="detail" id="detail"></div>
            </div>

            <!--
              Поле ключа прямо на первом экране, пока ключа нет. Когда ключ
              уже сохранён, поле здесь не нужно — оно остаётся в настройках.
            -->
            <div class="first-key" id="first-key" hidden>
              <textarea id="first-account" rows="2" spellcheck="false" placeholder="marvia://…  vless://…  https://…"></textarea>
              <div class="row">
                <button class="primary" id="first-save" data-t="keySaveFirst"></button>
                <span id="first-msg" class="hint"></span>
              </div>
            </div>

            <!--
              Где вы и что по подписке — как на телефоне, под состоянием, а не
              мелким шрифтом в углу меню: это два вопроса, ради которых окно и
              открывают. Карточка ноды ведёт к выбору страны.
            -->
            <!--
              Вид «Marvia» — капсула ноды под состоянием, как было до карточек.
              Какой вид показан, решает body[data-home]; данные одни на оба.
            -->
            <div class="node home-classic" id="node-card">
              <i class="mark"></i>
              <div>
                <div class="name" id="oc-name"></div>
                <div class="sub" id="oc-addr"></div>
              </div>
              <div class="ping" id="oc-ping"></div>
            </div>
            <div class="home-info home-cards">
              <button class="card hcard place" id="place-card" type="button">
                <span class="hc-code" id="place-code">··</span>
                <span class="hc-text">
                  <span class="name" id="node-name"></span>
                  <span class="sub" id="node-addr"></span>
                </span>
                <span class="hc-q"><span class="hc-ping" id="node-ping"></span><small id="node-q"></small></span>
              </button>
              <div class="card hcard plan" id="plan-card">
                <div class="k" data-t="planTitle"></div>
                <div class="hc-days"><b id="plan-days">—</b><span id="plan-word"></span></div>
                <div class="track"><i id="plan-fill" style="width:0"></i></div>
                <div class="sub" id="plan-left"></div>
              </div>
            </div>

          </div>

          <div class="side">
            <!--
              Чужой системный прокси — первым в правой колонке. Под строкой
              ноды карточка уходила за нижний край окна, а это ровно тот случай,
              когда туннель работает, а сайты в браузере не открываются.
            -->
            <div class="leak" id="proxy-warn" hidden>
              <div class="head">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 9v5M12 17.5v.01"/><path d="M10.3 3.9 2.4 17.4A2 2 0 0 0 4.1 20.4h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>
                <span class="title" data-t="proxyTitle"></span>
              </div>
              <div class="body" id="proxy-text"></div>
              <div class="body" id="proxy-care" data-t="proxyCare"></div>
              <div class="act">
                <button class="chip" id="proxy-off" data-t="proxyOff"></button>
                <span class="said" id="proxy-msg"></span>
              </div>
            </div>
            <!--
              Мешающие программы рядом: второй VPN спорит за маршруты, Hiddify удаляет адаптер,
              второй VPN спорит за маршруты. Окно называет их и говорит, что
              сделать, — иначе виноватым выглядит VPN.
            -->
            <div class="leak" id="conflict-warn" hidden>
              <div class="head">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 9v5M12 17.5v.01"/><path d="M10.3 3.9 2.4 17.4A2 2 0 0 0 4.1 20.4h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>
                <span class="title" data-t="conflictTitle"></span>
              </div>
              <ul class="body conflict-list" id="conflict-list"></ul>
              <div class="act">
                <button class="chip" id="conflict-fix" type="button" data-t="fixBtn"></button>
                <span class="said" id="conflict-msg"></span>
              </div>
            </div>
            <!--
              Проверка после подключения: нода ответила, а сайты не
              открываются. Без неё окно писало «Подключено» при мёртвом
              браузере, и виноватой выглядела Marvia.
            -->
            <!-- Что сделала «Починить»: карточка с помехой после этого прячется,
                 и без отчёта человек не узнал бы, что именно поменялось. -->
            <div class="leak done" id="fix-done" hidden>
              <div class="body" id="fix-done-text"></div>
            </div>
            <div class="leak" id="check-warn" hidden>
              <div class="head">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 9v5M12 17.5v.01"/><path d="M10.3 3.9 2.4 17.4A2 2 0 0 0 4.1 20.4h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>
                <span class="title" data-t="checkTitle"></span>
              </div>
              <div class="body" id="check-text"></div>
              <div class="act">
                <button class="chip" id="check-fix" type="button" data-t="fixBtn"></button>
                <button class="chip" id="check-again" type="button" data-t="checkAgain"></button>
                <span class="said" id="check-msg"></span>
              </div>
            </div>
            <!--
              Канал продавца: напоминание о сроке, объявление и две кнопки.
              Кнопка появляется, только если продавец оставил ссылку: кнопка
              без адреса — обещание, которого он не давал. Есть и без туннеля:
              «Продлить» нужнее всего, когда подключиться уже нельзя. Сверху
              правой колонки, а не под кнопкой: под ней уже нода и прокси, и в
              окне 1180×720 карточка ушла бы за край.
            -->
            <div class="seller" id="seller" hidden>
              <div class="k" data-t="sellerFrom"></div>
              <div class="remind" id="seller-remind" hidden>
                <span id="seller-remind-text"></span>
                <button class="chip" id="seller-seen" type="button" data-t="sellerSeen"></button>
              </div>
              <div class="body" id="seller-announce" hidden></div>
              <div class="act" id="seller-act">
                <button class="chip" id="seller-renew" type="button" data-t="sellerRenew" hidden></button>
                <button class="chip" id="seller-support" type="button" data-t="sellerSupport" hidden></button>
                <span class="said" id="seller-msg"></span>
              </div>
            </div>

            <div class="card daily feature">
              <div class="card-head"><b data-t="todayTraffic"></b><span class="mono" id="today-total">—</span></div>
              <div class="daily-bars" id="day-bars" role="img" data-t-title="todayTraffic"></div>
              <div class="axis"><span>00:00</span><span>23:00</span></div>
              <div class="session-extra">
                <div><span data-t="peakDown"></span><strong id="peak-down">—</strong></div>
                <div><span data-t="peakUp"></span><strong id="peak-up">—</strong></div>
                <div><span data-t="averageDown"></span><strong id="average-down">—</strong></div>
                <div><span data-t="averageUp"></span><strong id="average-up">—</strong></div>
              </div>
            </div>
            <!--
              Скорость в обе стороны — как на телефоне: цифра сейчас, справа
              объём за сессию, внизу бегущая линия за полминуты.
            -->
            <div class="tiles two">
              <div class="kpi spd">
                <div class="spd-head"><span class="k" data-t="down"></span><span class="t" id="t-down"></span></div>
                <div class="v" id="s-down">0</div>
                <svg class="spark" id="spark-down" viewBox="0 0 300 40" preserveAspectRatio="none" aria-hidden="true"><g><path class="area"/><path class="line"/></g></svg>
              </div>
              <div class="kpi spd">
                <div class="spd-head"><span class="k" data-t="up"></span><span class="t" id="t-up"></span></div>
                <div class="v" id="s-up">0</div>
                <svg class="spark" id="spark-up" viewBox="0 0 300 40" preserveAspectRatio="none" aria-hidden="true"><g><path class="area"/><path class="line"/></g></svg>
              </div>
            </div>
            <div class="tiles two home-classic">
              <div class="kpi"><div class="k" data-t="kSession"></div><div class="v" id="k-session">—</div></div>
              <div class="kpi quality"><div class="k" data-t="kPing"></div><div class="v acc" id="k-ping">—</div><div class="q-bars" id="q-bars" aria-hidden="true"></div><div class="q-sub" id="q-sub" data-t-title="qHint"></div></div>
            </div>
            <!--
              Неделя: считает сама программа, как телефон — у панели есть только
              накопительный итог, и подённой истории покупателя она не ведёт.
            -->
            <div class="card daily">
              <div class="card-head"><b id="span-title"></b><span class="mono" id="week-total">—</span></div>
              <!-- Неделя или месяц: книга хранит тридцать суток. -->
              <div class="pick span-pick" id="span-pick">
                <button class="chip" type="button" data-span="7" aria-pressed="true"></button>
                <button class="chip" type="button" data-span="30" aria-pressed="false"></button>
              </div>
              <div class="daily-bars" id="week-bars" role="img"></div>
              <div class="axis week-axis" id="week-axis"></div>
              <div class="session-extra">
                <div><span data-t="weekAverage"></span><strong id="week-average">—</strong></div>
                <div><span data-t="weekPeak"></span><strong id="week-peak">—</strong></div>
              </div>
              <p class="week-note" data-t="weekNote"></p>
            </div>
          </div>
        </div>
      </section>

      <!-- -------------------------------------------------------- серверы -->
      <section class="page" data-tab="nodes">
        <div class="split">
          <div class="card list wide">
            <div class="card-head">
              <b data-t="nodesAll"></b>
              <button class="chip" id="nodes-measure" data-t="nodesMeasure"></button>
            </div>
            <span id="nodes-msg" class="hint"></span>
            <div class="nodes" id="nodes-list"></div>
          </div>
          <div class="col side">
            <!--
              Ключи — здесь, рядом со странами: ключ и есть «чьи это серверы».
              Сначала то, что у человека уже есть, — список; поле для новой
              ссылки раскрывается по кнопке. Раньше карточка начиналась с
              прочерков и полной ссылки рабочего ключа на виду, а список
              прятался внизу.
            -->
            <div class="card keycard">
              <div class="card-head">
                <b data-t="keysTitle"></b>
                <button class="chip add-key" id="key-add" data-t="keyAdd" aria-expanded="false"></button>
              </div>
              <!-- Ключ в буфере обмена — одной кнопкой в поле; сохраняет человек. -->
              <div class="key-offer" id="key-offer" hidden>
                <span class="grow"><b data-t="clipFound"></b><small id="key-offer-text"></small></span>
                <button class="chip" id="key-offer-use" type="button" data-t="clipUse"></button>
              </div>
              <div class="keys" id="keys-list"></div>
              <span id="save-msg" class="hint"></span>
              <div class="key-form" id="key-form" hidden>
                <p class="lead" data-t="keyLead"></p>
                <textarea id="account" rows="3" spellcheck="false" autocomplete="off" placeholder="marvia://…  vless://…  https://…"></textarea>
                <div class="row">
                  <input type="text" class="code-in grow" id="key-name" autocomplete="off" spellcheck="false" maxlength="40">
                  <button class="primary" id="save" data-t="keySave"></button>
                </div>
                <p class="hint" data-t="keyHint"></p>
              </div>
            </div>
            <!--
              Сейчас — к какому серверу подключено и выбран ли он сам или
              руками. Раньше здесь был абзац о том, как работает автовыбор, и
              три строки моноширинным: читали его один раз, а место занимал
              всегда.
            -->
            <div class="card now-card">
              <div class="card-head"><b data-t="nowTitle"></b><span class="now-mode" id="now-mode"></span></div>
              <div class="now-main">
                <span class="now-flag" id="now-flag"></span>
                <div class="now-text"><b id="rule-now">—</b><small id="now-sub"></small></div>
              </div>
              <div class="now-rules">
                <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg><span data-t="nowRuleFast"></span></span>
                <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg><span data-t="nowRuleWatch"></span></span>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- ---------------------------------------------------- диагностика -->
      <!--
        Всё про проверку и исправление — в одном месте: где вас видит
        интернет, как именно вы подключены, пошаговая проверка с кнопкой на
        каждой беде, скорость, сайты, точные настройки протокола и журнал.
        Раньше это было разбросано по главной и настройкам, и человек с «не
        работает» не знал, с чего начать.
      -->
      <section class="page" data-tab="diag">
        <div class="diag-scroll scroll">
          <div class="diag-grid">
            <div class="col">
              <div class="card diag-run">
                <div class="card-head">
                  <div><b data-t="diagTitle"></b> <span class="hint" data-t="diagSub"></span></div>
                  <button class="primary" id="diag-run" type="button" data-t="diagRun"></button>
                </div>
                <div class="diag-sum" id="diag-sum" hidden><i></i><span id="diag-sum-text"></span></div>
                <ol class="diag-steps" id="diag-steps"></ol>
                <div class="log-act" id="diag-after" hidden>
                  <button class="chip" id="diag-report" type="button" data-t="diagReport"></button>
                  <span class="said" id="diag-report-msg"></span>
                </div>
              </div>

              <div class="card speed-card">
                <div class="card-head"><b data-t="ncSpeed"></b><button class="chip" id="nc-speed-btn" type="button" data-t="speedRun" data-t-title="ncSpeedHint"></button></div>
                <div class="speed-big"><b id="nc-speed">—</b><span data-t="mbps"></span></div>
                <div class="speed-hist" id="speed-hist"></div>
                <span class="hint" id="nc-speed-msg"></span>
              </div>

              <div class="card">
                <div class="card-head"><b data-t="sitesTitle"></b><button class="chip" id="nc-sites-btn" type="button" data-t="ncSites"></button></div>
                <div class="nc-sites" id="nc-sites"></div>
                <span class="hint" id="nc-msg"></span>
              </div>

              <div class="card list">

const $ = (id) => document.getElementById(id);

// on вешает обработчик и не падает, если элемента нет.
//
// Прямая подписка через getElementById однажды уже обрушила всё окно: правка
// разметки убрала кнопку, а подписку на неё оставила. Исключение прервало
// загрузку на середине, и не выполнилось ничего из того, что шло ниже, —
// перевод надписей, сохранение ключа, переключатель языка и, главное, опрос
// состояния. Окно осталось живым на вид и мёртвым по сути.
//
// Пропажу не заминаем: она едет в консоль, чтобы её починили, — но роняет
// теперь одну кнопку, а не всю страницу.
function on(id, event, handler) {
  const el = $(id);
  if (!el) {
    console.error("нет элемента " + id + ": обработчик не повешен");
    return;
  }
  el.addEventListener(event, handler);
}

let lang = "ru";
const L = () => T[lang];
function formatVersion(value) {
  if (!value) return "";
  const clean = String(value).replace(/^v+/i, "");
  return clean === "dev" ? clean : "v" + clean;
}

function pickLang() {
  try {
    const saved = localStorage.getItem(LANG_KEY);
    if (saved && T[saved]) return saved;
  } catch (_) { /* хранилище недоступно */ }

  const want = (navigator.languages || [navigator.language || ""]).join(",").toLowerCase();
  return /\b(ru|be|uk|kk|ky|uz|tg|hy|az)\b/.test(want) ? "ru" : "en";
}

// paintStatic заполняет всё, что не меняется от состояния: заголовки вкладок,
// подписи кнопок, тексты «о программе».
function paintStatic() {
  const d = L();
  document.documentElement.lang = d.lang;

  for (const node of document.querySelectorAll("[data-t]")) {
    const v = d[node.dataset.t];
    if (typeof v === "string") node.textContent = v;
  }
  // Внутри этих абзацев есть выделения, поэтому они идут разметкой. Источник
  // свой, из словаря — чужого текста сюда не попадает.
  for (const node of document.querySelectorAll("[data-html]")) {
    const v = d[node.dataset.html];
    if (typeof v === "string") node.innerHTML = v;
  }

  $("lang").textContent = d.switchTo;
  $("lang").title = d.switchTitle;
  $("lang-2").textContent = d.switchTo;
  $("lang-2").title = d.switchTitle;
  $("w-full").title = d.wOpen;
  $("w-hide").title = d.wHide;
  $("welcome-ru").setAttribute("aria-pressed", String(lang === "ru"));
  $("welcome-en").setAttribute("aria-pressed", String(lang === "en"));

  paintHead();
  paintTheme();
  paintConn();
  paintKeys();
}

async function setLang(next) {
  if (!T[next]) return;
  lang = next;
  try { localStorage.setItem(LANG_KEY, next); } catch (_) { /* хранилище недоступно */ }
  paintStatic();
  // Программе язык нужен для своих сообщений: они приходят готовой строкой.
  try { await api("POST", "api/lang", { lang: next }); } catch (_) { /* переживём */ }
  tick();
}

// должно начаться, пока кнопка мыши ещё нажата. В браузере, где окна нет,
// кнопки молчат, а не падают.
const winAct = (a) => (window.marviaWindow ? window.marviaWindow(a) : Promise.resolve(false));
// Что сделает крестик — по настройке «Программа → Крестик»; узнаём у программы.
var closeQuitsNow = false;
window.marviaMax = (on) => { document.body.dataset.max = on ? "1" : ""; paintWinLabels(); };
function paintWinLabels() {
  const d = L(), max = document.body.dataset.max === "1";
  for (const b of document.querySelectorAll("[data-win]")) {
    const key = b.dataset.win === "max" && max ? "restore" : b.dataset.win === "close" && !closeQuitsNow ? "toTray" : b.dataset.win;
    const label = d.win[key];
    b.setAttribute("aria-label", label);
    b.title = label;
  }

// Тянуть начинаем после сдвига на пару пикселей, а не по нажатию: иначе
// двойной щелчок — «развернуть» — съедался бы началом перетаскивания.
{
  const bar = $("titlebar");
  let pending = null;
  bar.addEventListener("mousedown", (e) => {
    if (e.button !== 0 || e.target.closest("button, input, a, #grip-top")) return;
    pending = { x: e.screenX, y: e.screenY };
  });
  $("desk").addEventListener("mousedown", (e) => {
    if (e.button === 0 && e.target === e.currentTarget) pending = { x: e.screenX, y: e.screenY };
  });
  $("desk").addEventListener("dblclick", (e) => { if (e.target === e.currentTarget) winAct("max"); });
  addEventListener("mousemove", (e) => {
    if (!pending) return;
    if (!(e.buttons & 1)) { pending = null; return; }
    if (Math.abs(e.screenX - pending.x) + Math.abs(e.screenY - pending.y) < 4) return;
    pending = null;
    winAct("drag");
  });
  addEventListener("mouseup", () => { pending = null; });
  // Знак — для змейки: тридцать быстрых щелчков — это пятнадцать двойных,
  // и окно разворачивалось бы туда-сюда.
  bar.addEventListener("dblclick", (e) => { if (!e.target.closest("button, input, a, .brand .logo")) winAct("max"); });
  $("grip-top").addEventListener("mousedown", (e) => { if (e.button === 0) { e.preventDefault(); winAct("top"); } });
  winAct("state").then((m) => window.marviaMax(m)).catch(() => {});
}

let look = Look.load();

function applyLook() {
  const t = Look.theme(look);
  // Свой фон отменяет фон темы: иначе он его и закроет. Читаемость тогда
  // держит пелена над картинкой, а не фон.
  document.documentElement.style.cssText = Look.vars(t) + (backdropURL ? ";--bgcss:transparent" : "");
  const bg = (vibe && eff("bg")) || t.bg, fg = (vibe && eff("fg")) || t.fg;
  api("POST", "api/window", { mode: "theme", background: bg, foreground: fg }).catch(() => {});
  paintBackdrop();
  // Кнопка питания: вид — из темы. Ставится атрибутом, а красится в CSS.
  $("power").dataset.btn = t.btn;
  paintTheme();
  if (window.onLookApplied) window.onLookApplied();
}

function setLook(patch) {
  Object.assign(look, patch);
  look = Look.normalize(look);
  Look.save(look);
  applyLook();
}

// Свой фон: картинка или видео из файла.
//
// Файл остаётся на этом компьютере — в IndexedDB профиля WebView2 — и в код
// темы не попадает: код передают, а файл вместе с ним не унесёшь. Ручки
// (как вписать, затемнение, размытие) тоже свои, отдельно от вида.
let backdrop = Look.loadBackdrop();
let backdropURL = null;
let backdropKind = "";

function paintBackdrop() {
  const layer = $("bg-layer"), veil = $("bg-veil");
  const on = !!backdropURL;
  document.body.classList.toggle("custom-bg", on);
  $("own-now").hidden = !on;
  // Свой фон закрывает рабочий стол — прозрачность тогда не нужна.
  if (vibe) paintGlass();
  layer.hidden = !on;
  veil.hidden = !on;
  if (!on) { layer.replaceChildren(); return; }

  const t = Look.theme(look);
  const css = Look.backdropCss(backdrop, t);
  // Поля под «целиком» закрывает фон темы, не чёрный: у светлой темы
  // чёрная рамка по краям выглядела бы поломкой.
  layer.style.background = t.bg;
  veil.style.background = css.veil;

  const tag = backdropKind === "video" ? "video" : "img";
  let media = layer.firstElementChild;
  if (!media || media.tagName.toLowerCase() !== tag || media.src !== backdropURL) {
    media = document.createElement(tag);
    if (tag === "video") {
      // Звук выключен и включить его нечем: окно, которое заговорило само,
      // — это не фон, это происшествие.
      media.muted = true;
      media.autoplay = true;
      media.loop = true;
      media.setAttribute("playsinline", "");
    }
    media.src = backdropURL;
    layer.replaceChildren(media);
  }
  media.setAttribute("style", css.media);
}

// useBackdropFile ставит файл фоном. Прежний адрес отзываем: иначе каждая
// замена оставляет в памяти окна ещё одно видео.
function useBackdropFile(file) {
  if (backdropURL) URL.revokeObjectURL(backdropURL);
  backdropURL = null;
  backdropKind = "";
  if (file) {
    backdropURL = URL.createObjectURL(file);
    backdropKind = String(file.type || "").startsWith("video") ? "video" : "image";
  }
  applyLook();
}

function setBackdrop(patch) {
  Object.assign(backdrop, patch);
  backdrop = Look.normalizeBackdrop(backdrop);
  Look.saveBackdrop(backdrop);
  paintBackdrop();
}

// paintBackdropKnobs рисует карточку «Свой фон». Ползунки не перерисовывают
// карточку: их значения пишем в подписи на месте, иначе палец теряет
// ползунок на первом же движении.
function paintBackdropKnobs() {
  const d = L();
  const on = !!backdropURL;
  $("bg-pick").textContent = on ? d.themeBackdropChange : d.themeBackdropPick;
  $("bg-drop").hidden = !on;

  pills("bg-fits", Look.FITS, backdrop.fit, d.themeBackdropFits, (k) => { setBackdrop({ fit: k }); paintBackdropKnobs(); });
  $("bg-dim").value = Math.round(backdrop.dim * 100);
  $("bg-dim-note").textContent = Math.round(backdrop.dim * 100) + "%";
  $("bg-blur").value = backdrop.blur;

}
