<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marvia Partner</title>

<!-- Тот же нейтральный знак, вшитый в бинарник; внешних запросов нет. -->
<link rel="icon" type="image/png" href="assets/marvia-mark.png">
<meta name="description" content="Marvia Partner — управление доступом, клиентами и нодами.">

<style>
  /* Шрифты вшиты в бинарник и отдаются самой панелью. Панель для обхода
     блокировок, которая не открывается без зарубежного CDN, — издевательство,
     плюс каждое открытие сообщало бы стороннему хосту, что её открыли. */
  @font-face { font-family: Onest; src: url(fonts/onest-latin.woff2) format('woff2');
    font-weight: 300 700; font-display: swap; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+2122, U+2212; }
  @font-face { font-family: Onest; src: url(fonts/onest-cyrillic.woff2) format('woff2');
    font-weight: 300 700; font-display: swap; unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }

  @font-face { font-family: 'JetBrains Mono'; src: url(fonts/jetbrains-latin.woff2) format('woff2');
    font-weight: 400 700; font-display: swap; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+2122, U+2212; }
  @font-face { font-family: 'JetBrains Mono'; src: url(fonts/jetbrains-cyrillic.woff2) format('woff2');
    font-weight: 400 700; font-display: swap; unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }

  @font-face { font-family: Unbounded; src: url(fonts/unbounded-latin.woff2) format('woff2');
    font-weight: 400 800; font-display: swap; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+2122, U+2212; }
  @font-face { font-family: Unbounded; src: url(fonts/unbounded-cyrillic.woff2) format('woff2');
    font-weight: 400 800; font-display: swap; unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }

  /* Chakra Petch — только латиница: им набрана одна надпись MARVIA PARTNER,
     кириллицы у этого шрифта нет вовсе. */
  @font-face { font-family: 'Chakra Petch'; src: url(fonts/chakra-petch-latin.woff2) format('woff2');
    font-weight: 700; font-display: swap; unicode-range: U+0000-00FF; }

  /* Флаги стран. Windows не рисует флаги-эмодзи: вместо флага там две буквы.
     Шрифт с флагами Twemoji вшит и подключён только к знакам флагов, так
     что остальной текст его не трогает (лицензия — internal/look/FONTS-TWEMOJI.txt). */
  @font-face { font-family: 'Twemoji Country Flags'; src: url(fonts/twemoji-flags.woff2) format('woff2');
    font-display: swap; unicode-range: U+1F1E6-1F1FF, U+1F3F4, U+E0062-E0063, U+E0065, U+E0067, U+E006C, U+E006E, U+E0073-E0074, U+E0077, U+E007F; }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: Onest, system-ui, sans-serif;
    font-size: 13px;
    line-height: 1.5;
    background: #0c0e11;
    color: #f1f4f7;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  [hidden] { display: none !important; }

  /*
    Знак — та самая объёмная лента-«M», и красится она темой, оставаясь
    металлом. Два слоя: нижний — сам знак, обесцвеченный в нейтральный металл
    (grayscale); верхний — заливка акцентом со смешением mix-blend-mode: color,
    которое берёт из акцента тон и насыщенность, а свет и тень — у металла
    снизу. Серый металл + любой акцент = тот же знак в этом цвете, с бликом и
    складкой на месте. Без --acc (экран входа) верхний слой прозрачен и знак
    остаётся серым: бренд начинается с нейтрального холста.

    isolation держит смешение внутри знака — иначе цвет пролился бы на фон.
  */
  :root { --mark-img: url("assets/marvia-mark.png"); }
  .logo { position: relative; display: inline-block; flex: none; isolation: isolate; }
  .logo::before, .logo::after { content: ""; position: absolute; inset: 0; }
  .logo::before {
    background: var(--mark-img) center / contain no-repeat;
    filter: grayscale(1) contrast(1.03) brightness(1.02);
  }
  .logo::after {
    background: var(--acc, transparent);
    mix-blend-mode: color;
    -webkit-mask: var(--mark-img) center / contain no-repeat;
            mask: var(--mark-img) center / contain no-repeat;
    -webkit-mask-size: contain; mask-size: contain;
  }
  /*
    Надпись MARVIA — не шрифт, а форма: «A» без перекладины и с точкой, такой
    буквы нет ни в одном вшитом шрифте. Идёт маской и заливается currentColor,
    поэтому подчиняется цвету текста рядом, как если бы была набрана.
  */
  :root { --word-img: url("assets/marvia-word.svg"); }
  .wordmark {
    display: block; height: 13px; aspect-ratio: 614 / 144; background: currentColor;
    -webkit-mask: var(--word-img) center / contain no-repeat;
            mask: var(--word-img) center / contain no-repeat;
  }

  /*
    Вход. Отдельный экран, а не модальное окно поверх панели: пока токен не
    принят, показывать нечего, и рисовать за формой пустую панель — обман.
    Темы здесь ещё нет (она живёт в браузере вместе с токеном, а не до него),
    поэтому цвета — тот же графит, с которого начинается панель.
  */
  #login {
    height: 100%; overflow-y: auto;
    display: flex; align-items: center; justify-content: center;
    padding: 24px 16px;
    background:
      radial-gradient(80% 60% at 50% 0%, rgba(195, 204, 214, .07), transparent 70%),
      #0c0e11;
  }
  #login .box {
    width: 100%; max-width: 400px;
    display: flex; flex-direction: column; gap: 16px;
    padding: 32px;
    border-radius: 16px;
    background: #14171b;
    border: 1px solid #262a30;
    box-shadow: 0 24px 60px -24px rgba(0, 0, 0, .7), inset 0 1px 0 rgba(255, 255, 255, .04);
    animation: rise .4s cubic-bezier(.2, .7, .2, 1) backwards;
  }
  #login .mark { display: flex; align-items: center; gap: 10px; }
  #login .word {
    display: flex; align-items: center; gap: 9px;
    font-family: 'Chakra Petch', sans-serif; font-size: 11px; font-weight: 700;
    letter-spacing: .2em; color: #c3ccd6;
  }
  #login .word .wordmark { height: 14px; }
  #login h1 { font-size: 26px; line-height: 1.15; letter-spacing: -.035em; font-weight: 600; margin-top: 20px; text-wrap: balance; }
  #login p { font-size: 13.5px; line-height: 1.6; color: #a3abb5; text-wrap: pretty; }
  #login label { font-size: 12.5px; font-weight: 500; color: #c3ccd6; margin: 4px 0 -8px; }
  #login .brand-note { border-top: 1px solid #262a30; padding-top: 16px; font-size: 12px; color: #9aa3ad; }
  #login input {
    width: 100%; height: 42px; padding: 0 14px;
    border-radius: 10px; border: 1px solid #2e333a;
    background: #0c0e11; color: #f1f4f7;
    font-family: 'JetBrains Mono', monospace; font-size: 13px;
    transition: border-color .15s, box-shadow .15s;
  }
  #login input:hover { border-color: #3c424a; }
  #login input:focus { outline: none; border-color: #c3ccd6; box-shadow: 0 0 0 3px rgba(195, 204, 214, .18); }
  #login button[type=submit] {
    height: 42px; padding: 0 18px;
    border-radius: 10px; border: none;
    background: #e6eaee; color: #0c0e11;
    font-family: Onest, system-ui, sans-serif; font-size: 14px; font-weight: 600;
    cursor: pointer;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .5);
    transition: background .15s, transform .12s;
  }
  #login button[type=submit]:hover:not(:disabled) { background: #ffffff; }
  #login button[type=submit]:active:not(:disabled) { transform: translateY(1px); }
  #login .err { font-size: 12.5px; color: #f2a03d; min-height: 18px; margin-top: -6px; }

  /* Переключатель языка на входе: до проверки токена панели ещё нет, а
     прочитать, что от тебя хотят, надо уже здесь. */
  #login .lang {
    margin-left: auto; height: 26px; padding: 0 9px;
    border-radius: 7px; border: 1px solid #2e333a;
    background: transparent; color: #a3abb5;
    font: 600 11px/1 "JetBrains Mono", monospace; letter-spacing: .08em;
    cursor: pointer; transition: color .15s, border-color .15s;
  }
  #login .lang:hover { color: #f1f4f7; border-color: #5a626c; }
  #login button:disabled { opacity: .55; cursor: wait; }

  /*
    Система оформления.

    Цвета приходят из темы (internal/look/look.js) переменными на #app: --bg,
    --surf, --surf2, --line, --fg, --dim, --acc и остальные. Здесь поверх них
    — то, чего тема не знает: шкала кегля, отступов, скруглений вложенных
    элементов и производные оттенки. Производные объявлены на тех же
    элементах, что получают переменные темы (#app, окно, сообщение): var()
    внутри переменной разрешается там, где она объявлена, и на :root осталась
    бы пустой.

    Цвета состояния (--ok, --warnInk и их подложки) приходят из скрипта
    вместе с темой: на светлом фоне янтарный текст не читается, и ему нужен
    свой, более тёмный, тон — а светлая тема или тёмная, знает только тема.
  */
  #app, #veil, #toast {
    --fs-xs: 11px; --fs-sm: 12px; --fs-md: 13px; --fs-lg: 14px; --fs-xl: 24px; --fs-kpi: 28px;
    --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 20px; --s6: 24px; --s8: 32px;
    /* Вложенное скругляется мельче контейнера: одинаковый радиус у
       карточки и кнопки в ней читается как штамп. */
    --r-ctl: clamp(5px, calc(var(--r, 14px) * .6), 18px);
    --r-sm: clamp(4px, calc(var(--r, 14px) * .45), 10px);
    --hover: color-mix(in srgb, var(--fg) 6%, transparent);
    --press: color-mix(in srgb, var(--fg) 10%, transparent);
    --hair: color-mix(in srgb, var(--line) 70%, transparent);
    --track: color-mix(in srgb, var(--fg) 9%, transparent);
    --chip: color-mix(in srgb, var(--fg) 6%, transparent);
    --ease: cubic-bezier(.2, .7, .2, 1);
  }

  button, [role=button] { transition: background-color .15s, border-color .15s, color .15s, transform .12s, box-shadow .15s; }
  :focus-visible { outline: 2px solid var(--acc, #c3ccd6) !important; outline-offset: 2px; }
  ::selection { background: color-mix(in srgb, var(--acc, #c3ccd6) 35%, transparent); }

  #app { height: 100%; color: var(--fg, #f1f4f7); }

  /* Каркас: меню слева, справа шапка и прокручиваемая рабочая область. */
  .shell {
    height: 100%; display: grid; grid-template-columns: 236px minmax(0, 1fr);
    background: var(--bgcss, var(--bg, #0c0e11));
  }

  .side {
    min-height: 0; display: flex; flex-direction: column; gap: var(--s2);
    padding: var(--s4) var(--s3) var(--s3);
    border-right: 1px solid var(--hair);
    background: color-mix(in srgb, var(--surf) 72%, transparent);
    overflow-y: auto;
  }
  .side-brand { display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 var(--s2); margin-bottom: var(--s2); }
  .brand-word {
    display: flex; align-items: center; gap: 8px; min-width: 0;
    font-family: 'Chakra Petch', sans-serif; font-size: 10.5px; font-weight: 700; letter-spacing: .2em; color: var(--fg);
  }
  .side-nav { display: flex; flex-direction: column; gap: var(--s4); flex: 1; }
  .nav-group { display: flex; flex-direction: column; gap: 2px; }
  .nav-label { padding: 0 var(--s2) var(--s1); font-size: var(--fs-xs); font-weight: 500; color: var(--dim); letter-spacing: .01em; }
  /*
    Пункт меню. Выбранный отмечен полоской акцента у края меню и подложкой:
    одной подложки на сером акценте не хватало, выбранный терялся среди
    наведённого.
  */
  .nav-item, .side-btn {
    position: relative; display: flex; align-items: center; gap: 10px;
    height: 32px; padding: 0 var(--s2); border-radius: var(--r-ctl);
    font-size: var(--fs-md); font-weight: 500; color: var(--dim);
    cursor: pointer; user-select: none; white-space: nowrap;
  }
  .nav-item:hover, .side-btn:hover { background: var(--hover); color: var(--fg); }
  .nav-item:active, .side-btn:active { background: var(--press); }
  .nav-item.on { background: var(--press); color: var(--fg); }
  .nav-item.on::before {
    content: ""; position: absolute; left: calc(var(--s3) * -1); top: 8px; bottom: 8px; width: 2px;
    border-radius: 0 2px 2px 0; background: var(--acc);
  }
  .nav-item.on .ico { color: var(--acc); }
  .nav-text { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .side-foot { display: flex; flex-direction: column; gap: 2px; padding-top: var(--s3); border-top: 1px solid var(--hair); }
  .host-chip {
    display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 var(--s2); min-width: 0;
    font: 500 11px/1 'JetBrains Mono', monospace; color: var(--dim);
  }
  .host-chip span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Значки — одна толщина линии на всё, цвет из текста рядом. */
  .ico {
    width: 16px; height: 16px; flex: none;
    fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round;
  }
  .sprite { position: absolute; width: 0; height: 0; overflow: hidden; }

  .main { min-width: 0; min-height: 0; display: flex; flex-direction: column; }

  /* Шапка: где ты, когда пришли данные и два общих действия. */
  .topbar {
    position: relative; flex: none; height: 52px;
    display: flex; align-items: center; gap: var(--s3);
    padding: 0 var(--s6);
    border-bottom: 1px solid var(--hair);
  }
  .crumbs { display: flex; align-items: center; gap: 6px; min-width: 0; font-size: var(--fs-md); }
  .crumb-group { color: var(--dim); white-space: nowrap; }
  .crumb-sep { width: 14px; height: 14px; color: var(--dim); opacity: .7; }
  .crumb-page { color: var(--fg); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .top-actions { margin-left: auto; display: flex; align-items: center; gap: var(--s2); }
  .topbar .menu-btn { display: none; }
  /* Пока идёт загрузка, по низу шапки бежит тонкая полоса. Раньше на это
     время тускнела вся панель — читать то, что уже есть, это мешало. */
  #app.busy .topbar::after {
    content: ""; position: absolute; left: 0; bottom: -1px; height: 2px; width: 30%;
    background: linear-gradient(90deg, transparent, var(--acc), transparent);
    animation: busy 1.1s ease-in-out infinite;
  }
  @keyframes busy { from { transform: translateX(-100%); } to { transform: translateX(430%); } }

  /* Отметка свежести в шапке: правда о том, когда данные пришли. */
  .top-actions .fresh { display: flex; align-items: center; gap: 8px; padding: 0 var(--s2); font-size: var(--fs-sm); color: var(--dim); white-space: nowrap; font-variant-numeric: tabular-nums; }

  /* Кнопки. */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    height: 34px; padding: 0 14px; flex: none;
    border-radius: var(--r-ctl); border: 1px solid transparent;
    font: 600 var(--fs-md)/1 Onest, system-ui, sans-serif; letter-spacing: -.005em;
    white-space: nowrap; cursor: pointer; user-select: none;
  }
  .btn:active { transform: translateY(1px); }
  .btn-primary {
    background: var(--acc); color: var(--accFg);
    box-shadow: var(--glow, none);
  }
  .btn-primary:hover { background: color-mix(in srgb, var(--acc) 88%, var(--fg)); }
  .btn-secondary { background: var(--chip); border-color: var(--hair); color: var(--fg); }
  .btn-secondary:hover { background: var(--press); border-color: var(--line); }
  .btn-ghost { background: transparent; color: var(--dim); }
  .btn-ghost:hover { background: var(--hover); color: var(--fg); }
  .btn-danger { background: var(--warnSoft); color: var(--warnInk); }
  .btn-danger:hover { background: color-mix(in srgb, var(--warn) 24%, transparent); }
  .btn-sm { height: 30px; padding: 0 10px; font-size: var(--fs-sm); gap: 6px; }
  .btn-sm .ico { width: 15px; height: 15px; }
  .btn-icon { width: 34px; padding: 0; }
  .btn-wide { flex: 1 1 0; min-width: 0; }
  .btn.spin .ico { animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .link {
    display: inline-flex; align-items: center; gap: 4px; flex: none;
    font-size: var(--fs-sm); font-weight: 500; color: var(--dim); white-space: nowrap; cursor: pointer;
    border-radius: 4px; transition: color .15s;
  }
  .link:hover { color: var(--fg); }
  .link .ico { width: 14px; height: 14px; transition: transform .15s; }
  .link:hover .ico { transform: translateX(2px); }

  /*
    Раскладка рабочей области.

    Раньше каждый раздел растягивался на высоту окна (flex: 1) и прокручивал
    себя сам. На трёх нодах это давало две трети пустого экрана, а пустая
    таблица ключей — рамку во весь рост с одной строкой внутри. Теперь
    прокручивается вся рабочая область, а блоки занимают ровно свою высоту:
    сколько данных, столько и места.
  */
  .p-main {
    flex: 1; min-width: 0; min-height: 0; overflow-y: auto; scrollbar-gutter: stable;
    /* Ширина ограничена полями, а не max-width у блоков: на мониторе в 2560
       строка таблицы во весь экран не читается, а узкий абзац пояснения
       при этом остаётся у левого края, а не уезжает в середину. */
    padding: 0 max(var(--s6), calc((100% - 1320px) / 2)) var(--s8);
    display: flex; flex-direction: column; gap: var(--gap, 12px);
  }
  /* В колонке с прокруткой flex иначе сжал бы блоки до нуля, а не дал бы
     области прокрутиться. */
  .p-main > * { flex: none; }
  /* Верхний отступ — у первого блока, а не у области: липкая шапка таблицы
     встаёт по краю содержимого, и при отступе у области над ней просвечивала
     бы полоска уехавших строк. */
  .p-main > :first-child { margin-top: var(--s6); }

  .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--s4); flex-wrap: wrap; margin-bottom: var(--s1); }
  .page-titles { min-width: 0; }
  .h1 { font-size: var(--fs-xl); line-height: 1.2; font-weight: 600; letter-spacing: -.03em; color: var(--fg); }
  .page-sub { margin-top: 4px; font-size: var(--fs-md); color: var(--dim); }
  .page-actions { display: flex; gap: var(--s2); align-items: center; }
  .lead { max-width: 96ch; font-size: var(--fs-md); line-height: 1.6; color: var(--dim); text-wrap: pretty; }
  .p-flow { display: flex; flex-direction: column; gap: var(--gap, 12px); }

  /* Карточка целиком на переменных темы: вид перекрашивает её вместе со всем. */
  .card {
    position: relative; min-width: 0; padding: var(--pad, 16px); border-radius: var(--r, 14px);
    background: var(--cardBg, var(--surf)); border: 1px solid var(--cardLine, var(--line));
    box-shadow: var(--cardShadow, none); display: flex; flex-direction: column; gap: var(--s3);
  }
  .card.feature { background: var(--featureBg, var(--cardBg, var(--surf))); border-color: var(--featureLine, var(--cardLine, var(--line))); }
  .card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--s3); min-height: 20px; }
  .card-title { font-size: var(--fs-lg); font-weight: 600; letter-spacing: -.01em; color: var(--fg); }
  .card-sub { margin-top: 2px; font-size: var(--fs-sm); color: var(--dim); }
  /* Подпись капсом из словаря читается криком; здесь она в обычном регистре. */
  .sc { text-transform: lowercase; }
  .sc::first-letter { text-transform: uppercase; }
  .eyebrow { font-size: var(--fs-sm); font-weight: 500; color: var(--dim); }

  /* Плитки показателей: столько в ряд, сколько влезает, но не уже 190px —
     уже число перестаёт помещаться и обрезается многоточием. */
  .kpi-row { display: grid; gap: var(--gap, 12px); grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
  /* Одинокая плитка над таблицей не тянется на всю ширину: карточка на всю
     ширину с одним числом и есть то пустое место, которое убираем. */
  .kpi-row.solo { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
  .kpi { gap: var(--s2); }
  .kpi-top { display: flex; align-items: center; justify-content: space-between; gap: var(--s2); }
  .kpi-label { font-size: var(--fs-md); font-weight: 500; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kpi-ico { width: 28px; height: 28px; flex: none; display: grid; place-items: center; border-radius: var(--r-sm); background: var(--chip); color: var(--dim); }
  .kpi-ico .ico { width: 15px; height: 15px; }
  .kpi-value {
    font-size: var(--fs-kpi); line-height: 1.15; font-weight: 600; letter-spacing: -.03em; color: var(--fg);
    font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .kpi-foot { display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap; min-height: 18px; font-size: var(--fs-sm); color: var(--dim); }
  .tone-ok { color: var(--ok); }
  .tone-warn { color: var(--warnInk); }
  .trend {
    display: inline-flex; align-items: center; gap: 2px; height: 20px; padding: 0 6px; border-radius: 5px;
    font-size: var(--fs-xs); font-weight: 600; font-variant-numeric: tabular-nums; background: var(--chip); color: var(--fg);
  }
  .trend .ico { width: 12px; height: 12px; stroke-width: 2; }

  /* Обзор: график и ноды, под ними сроки и тарифы. Строки сетки выравнивают
     пары по высоте, а не растягивают их до низа окна. */
  .dash-grid { display: grid; gap: var(--gap, 12px); grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); }
  .stats-grid { display: grid; gap: var(--gap, 12px); grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); align-items: start; }

  /*
    График. Высота задана, а не «сколько осталось от окна»: на большом
    мониторе кривая в полэкрана не говорит больше, чем в двести пикселей.
    Подсказка и точка двигаются скриптом прямо на месте, без перерисовки:
    перерисовка на каждое движение мыши сбивала бы и наведение, и счёт чисел.
  */
  .chart { position: relative; height: 188px; touch-action: pan-y; }
  .chart.tall { height: 236px; }
  .chart-svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .chart-svg .grid { fill: none; stroke: var(--line); stroke-opacity: .55; stroke-dasharray: 2 5; vector-effect: non-scaling-stroke; }
  .chart-svg .base { fill: none; stroke: var(--line); vector-effect: non-scaling-stroke; }
  .chart-svg .line { fill: none; stroke: var(--acc); stroke-width: 1.8; vector-effect: non-scaling-stroke; stroke-linejoin: round; stroke-linecap: round; }
  .stop-a { stop-color: var(--acc); stop-opacity: .2; }
  .stop-b { stop-color: var(--acc); stop-opacity: 0; }
  /* Подписи оси справа и на подложке: слева кривая обычно выше, и подпись
     поверх заливки не читалась. */
  .chart-y {
    position: absolute; right: 0; transform: translateY(-50%); padding: 1px 6px; border-radius: 4px;
    font-size: var(--fs-xs); color: var(--dim); font-variant-numeric: tabular-nums; pointer-events: none;
    background: color-mix(in srgb, var(--surf) 88%, transparent);
  }
  .chart-guide { position: absolute; top: 0; bottom: 0; width: 1px; background: color-mix(in srgb, var(--fg) 28%, transparent); pointer-events: none; }
  .chart-dot {
    position: absolute; width: 9px; height: 9px; border-radius: 50%; pointer-events: none;
    background: var(--acc); box-shadow: 0 0 0 3px var(--surf), 0 0 0 4px color-mix(in srgb, var(--acc) 45%, transparent);
    transform: translate(-50%, -50%);
  }
  .chart-tip {
    position: absolute; top: 0; z-index: 3; pointer-events: none;
    display: flex; flex-direction: column; gap: 2px; padding: 8px 10px;
    border-radius: var(--r-sm); background: var(--surf2); border: 1px solid var(--line);
    box-shadow: var(--pop); white-space: nowrap; transform: translate(-50%, calc(-100% - 12px));
  }
  .chart-tip b { font-size: var(--fs-md); font-weight: 600; color: var(--fg); font-variant-numeric: tabular-nums; }
  .chart-tip span { font-size: var(--fs-xs); color: var(--dim); }
  .chart-axis { display: flex; justify-content: space-between; gap: var(--s2); font-size: var(--fs-xs); color: var(--dim); font-variant-numeric: tabular-nums; }
  .chart-empty { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; font-size: var(--fs-sm); color: var(--dim); padding: 0 var(--s6); }
  .chart-empty span { max-width: 44ch; }
  /* Столбики по дням: снизу скачанное, сверху отданное. */
  .bars { display: flex; align-items: flex-end; gap: 4px; border-bottom: 1px solid var(--hair); }
  .bar-col { flex: 1; min-width: 0; height: 100%; display: flex; align-items: flex-end; border-radius: 3px; }
  .bar-stack { width: 100%; display: flex; flex-direction: column-reverse; min-height: 2px; border-radius: min(var(--r-sm), 5px) min(var(--r-sm), 5px) 2px 2px; overflow: hidden; transition: opacity .15s; }
  .bar-stack .b-down { display: block; background: color-mix(in srgb, var(--acc) 72%, var(--surf)); }
  .bar-stack .b-up { display: block; background: color-mix(in srgb, var(--acc) 34%, var(--surf)); }
  .bar-col.hot .b-down { background: var(--acc); }
  .bar-col.hot .b-up { background: color-mix(in srgb, var(--acc) 50%, var(--surf)); }
  .bars.hovering .bar-col:not(.hot) .bar-stack { opacity: .45; }
  .legend { display: flex; gap: var(--s3); font-size: var(--fs-sm); color: var(--dim); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 8px; height: 8px; border-radius: 2px; background: color-mix(in srgb, var(--acc) 72%, var(--surf)); }
  .legend i.up { background: color-mix(in srgb, var(--acc) 34%, var(--surf)); }

  /* Полоса доли: дорожка и заливка. */
  .bar { height: 4px; border-radius: 4px; background: var(--track); overflow: hidden; }
  .bar > i { display: block; height: 100%; border-radius: inherit; background: var(--acc); transform-origin: left; }
  .bar > i.warn { background: var(--warn); }
  .bar.thick { height: 6px; }
  .bar > i.mix-fill.ok { background: var(--ok); }
  .bar > i.mix-fill.dim { background: var(--dim); }
  .plan-row[role=button] { cursor: pointer; border-radius: var(--r-sm); }
  .plan-row[role=button]:hover .plan-name { color: var(--acc); }

  /*
    Точка «на связи». Пульс только у живого: у молчащей ноды ровная точка,
    и мигание ей приписало бы жизнь, которой нет.
  */
  .dot { position: relative; flex: none; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--dim); }
  .dot.ok { background: var(--ok); }
  .dot.warn { background: var(--warn); }
  .dot.off { background: transparent; box-shadow: inset 0 0 0 1.5px var(--dim); }
  .dot.live::after {
    content: ""; position: absolute; inset: 0; border-radius: 50%; background: inherit;
    animation: ping 2.4s cubic-bezier(0, 0, .2, 1) infinite;
  }
  @keyframes ping { 0% { transform: scale(1); opacity: .6; } 75%, 100% { transform: scale(2.8); opacity: 0; } }

  /* Метка состояния: точка и слово. Квадратнее таблетки — меньше похожа на
     кнопку, на которую хочется нажать. */
  .pill {
    display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; flex: none;
    border-radius: 6px; font-size: var(--fs-xs); font-weight: 600; white-space: nowrap;
    background: var(--chip); color: var(--dim);
  }
  .pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
  .pill.plain::before { display: none; }
  .pill.ok { color: var(--ok); background: var(--okSoft); }
  .pill.warn { color: var(--warnInk); background: var(--warnSoft); }
  .note.warn { color: var(--warnInk); }
  .pill.acc { color: var(--fg); background: var(--accSoft); }
  .pill.acc::before { background: var(--acc); }

  /* Флаг страны ноды — вшитым шрифтом, одинаково на любой системе. */
  .flag { flex: none; font-size: 18px; line-height: 1; font-family: 'Twemoji Country Flags', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif; }

  /* Списки внутри карточек: строки через тонкую черту, подсветка под курсором. */
  .rows { display: flex; flex-direction: column; margin: 0 calc(var(--s2) * -1); }
  .row-item {
    display: grid; align-items: center; gap: var(--s3); min-height: 44px; padding: 6px var(--s2);
    border-radius: var(--r-sm); position: relative;
  }
  .row-item + .row-item::before { content: ""; position: absolute; left: var(--s2); right: var(--s2); top: 0; border-top: 1px solid var(--hair); }
  .row-item[role=button]:hover { background: var(--hover); }
  .row-item[role=button]:hover::before, .row-item[role=button]:hover + .row-item::before { opacity: 0; }
  .row-main { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .row-title { font-size: var(--fs-md); font-weight: 500; color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row-sub { font-size: var(--fs-sm); color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .soon-row { grid-template-columns: minmax(0, 1fr) auto auto; }
  .when { font-size: var(--fs-sm); white-space: nowrap; color: var(--dim); font-variant-numeric: tabular-nums; }
  .when.near { color: var(--fg); font-weight: 500; }
  .when.past { color: var(--warnInk); }
  .mini-node { display: flex; flex-direction: column; gap: 8px; padding: 10px var(--s2); border-radius: var(--r-sm); }
  .mini-node[role=button]:hover { background: var(--hover); }
  .mini-node-top { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .mini-node-name { flex: 1; min-width: 0; font-size: var(--fs-md); font-weight: 500; color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .num { font-size: var(--fs-sm); color: var(--dim); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .num b { color: var(--fg); font-weight: 600; }
  .plan-row { display: flex; flex-direction: column; gap: 7px; padding: 4px 0; }
  .plan-top { display: flex; justify-content: space-between; gap: var(--s3); font-size: var(--fs-md); }
  .plan-name { color: var(--fg); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* «С чего начать» — три шага в ряд и сколько пройдено. */
  .start-grid { display: grid; gap: var(--s2); grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
  .start-step {
    display: flex; align-items: flex-start; gap: var(--s3); padding: var(--s3);
    border-radius: var(--r-ctl); border: 1px solid var(--hair); background: var(--chip);
  }
  .start-step[role=button] { cursor: pointer; }
  .start-step[role=button]:hover { border-color: var(--line); background: var(--press); }
  .start-step.done { opacity: .6; }
  .start-mark {
    flex: none; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center;
    font: 600 11px/1 'JetBrains Mono', monospace; color: var(--dim); box-shadow: inset 0 0 0 1.5px var(--line);
  }
  .start-step.done .start-mark { background: var(--acc); color: var(--accFg); box-shadow: none; }
  .start-mark .ico { width: 13px; height: 13px; stroke-width: 2.2; }
  .start-title { font-size: var(--fs-md); font-weight: 600; color: var(--fg); }
  .start-note { margin-top: 2px; font-size: var(--fs-sm); line-height: 1.45; color: var(--dim); }
  .start-count { font-size: var(--fs-sm); color: var(--dim); font-variant-numeric: tabular-nums; }

  /*
    Таблица. Строки — сетка, а не <table>: так одна и та же разметка на
    телефоне раскладывается карточками. Шапка липнет к верху рабочей
    области; её фон сплошной, иначе сквозь неё просвечивали бы строки.
  */
  .tbl-card { padding: 0; gap: 0; background: var(--surf); }
  .t-row {
    position: relative; display: grid; gap: var(--s4); align-items: center;
    min-height: 50px; padding: 7px var(--s4);
    border-top: 1px solid var(--hair);
  }
  .t-row[role=button] { cursor: pointer; }
  .t-row[role=button]:hover { background: var(--hover); }
  .t-row:last-child { border-radius: 0 0 var(--r) var(--r); }
  .t-cell { min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 3px; font-size: var(--fs-md); color: var(--dim); }
  .t-cell > * { max-width: 100%; }
  .t-cell .t-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .t-cell.lead-cell .t-text { color: var(--fg); font-weight: 500; }
  .t-cell.mono .t-text { font: 12px/1.4 'JetBrains Mono', monospace; }
  .t-cell.on .t-text::before { content: ""; display: inline-block; width: 6px; height: 6px; margin-right: 7px; border-radius: 50%; background: var(--ok); vertical-align: 1px; }
  .t-sub { font-size: var(--fs-xs); color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .t-sub.warn { color: var(--warnInk); }
  .t-bar { display: block; width: 100%; max-width: 120px; height: 3px; border-radius: 3px; background: var(--track); overflow: hidden; }
  .t-bar i { display: block; height: 100%; background: var(--acc); }
  .t-bar i.warn { background: var(--warn); }
  .skel-row { pointer-events: none; }
  /* Галочка выбора строки. Своя, а не <input>: строка целиком — кнопка, и
     нажатие на галочку не должно открывать карточку клиента (pickRow). */
  .t-pick {
    width: 18px; height: 18px; flex: none; border-radius: 5px; cursor: pointer;
    border: 1.5px solid var(--line); background: transparent; position: relative;
    transition: background .15s, border-color .15s;
  }
  .t-pick:hover { border-color: var(--dim); }
  .t-pick[aria-checked=true] { background: var(--acc); border-color: var(--acc); }
  .t-pick[aria-checked=true]::after {
    content: ""; position: absolute; left: 5px; top: 1.5px; width: 5px; height: 10px;
    border: solid var(--accFg); border-width: 0 2px 2px 0; transform: rotate(45deg);
  }
  .t-pick[aria-checked=mixed]::after { content: ""; position: absolute; left: 3px; right: 3px; top: 7px; height: 2px; background: var(--fg); border-radius: 1px; }
  .t-row.picked { background: color-mix(in srgb, var(--acc) 8%, transparent); }
  .pick-bar {
    position: sticky; top: 8px; z-index: 3; display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap;
    padding: 8px 10px 8px 14px; border-radius: var(--r); background: var(--surf); border: 1px solid var(--line);
    box-shadow: var(--pop); animation: pop .18s var(--ease, ease-out);
  }
  .pick-count { font-weight: 600; margin-right: auto; font-variant-numeric: tabular-nums; }
  .pager { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); padding: var(--s3) var(--s4); border-top: 1px solid var(--hair); }
  .pager-info { font-size: var(--fs-sm); color: var(--dim); font-variant-numeric: tabular-nums; }
  .btn[aria-disabled=true] { opacity: .4; pointer-events: none; }

  /* Поиск и фильтры клиентов. */
  .toolbar { display: flex; gap: var(--s2); align-items: center; }
  .search {
    flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 12px;
    border-radius: var(--r-ctl); background: var(--surf); border: 1px solid var(--hair); color: var(--dim);
    transition: border-color .15s, box-shadow .15s;
  }
  .search:hover { border-color: var(--line); }
  .search:focus-within { border-color: color-mix(in srgb, var(--acc) 60%, var(--line)); box-shadow: 0 0 0 3px var(--accSoft); }
  .search input { flex: 1; min-width: 0; height: 100%; border: 0; outline: none; background: transparent; color: var(--fg); font: inherit; font-size: var(--fs-md); }
  .search input::placeholder { color: var(--dim); }
  .search:has(input:focus-visible) input { outline: none !important; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px;
    border-radius: var(--r-ctl); font-size: var(--fs-sm); font-weight: 500; white-space: nowrap; cursor: pointer;
    color: var(--dim); border: 1px solid var(--hair); background: transparent;
  }
  .chip:hover { color: var(--fg); background: var(--hover); }
  .chip.on { color: var(--fg); background: var(--press); border-color: var(--line); }
  .chip-n { font-size: var(--fs-xs); font-variant-numeric: tabular-nums; color: var(--dim); }
  .chip.on .chip-n { color: var(--fg); }

  /* Ошибка загрузки: что случилось и та же кнопка, что в шапке. */
  .notice {
    display: flex; align-items: center; gap: var(--s3); padding: 10px 12px 10px 14px;
    border-radius: var(--r-ctl); font-size: var(--fs-md); line-height: 1.45;
  }
  .notice.warn { color: var(--warnInk); background: var(--warnSoft); border: 1px solid color-mix(in srgb, var(--warn) 40%, transparent); }
  .notice .notice-text { flex: 1; min-width: 0; }

  /* Пустое место — короткое: значок, строка и то же действие, что в углу. */
  .empty { display: flex; align-items: center; gap: var(--s3); flex-wrap: wrap; padding: var(--s5) var(--s4); }
  .empty-ico { flex: none; width: 36px; height: 36px; border-radius: var(--r-ctl); display: grid; place-items: center; background: var(--chip); color: var(--dim); border: 1px solid var(--hair); }
  .empty-text { flex: 1 1 260px; font-size: var(--fs-md); line-height: 1.5; color: var(--dim); }
  .empty-line { padding: var(--s3) 0; font-size: var(--fs-md); line-height: 1.5; color: var(--dim); }

  /* Скелет: форма того, что вот-вот придёт, вместо прочерков и нулей. */
  .skel {
    display: block; height: 12px; border-radius: 5px;
    background: linear-gradient(90deg, var(--chip) 0%, var(--press) 50%, var(--chip) 100%);
    background-size: 200% 100%; animation: shimmer 1.4s linear infinite;
  }
  .skel.num { height: 28px; width: 56%; margin: 2px 0; }
  .skel.big { position: absolute; inset: 0; height: auto; border-radius: var(--r-sm); }
  @keyframes shimmer { from { background-position: 100% 0; } to { background-position: -100% 0; } }

  /* Ноды плотной сеткой: на широком экране три-четыре в ряд. */
  .node-grid { display: grid; gap: var(--gap, 12px); grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
  .node-grid > .wide, .cards-2 > .wide { grid-column: 1 / -1; }
  .node-card { gap: var(--s4); cursor: pointer; }
  /* Молчащую ноду выдаёт полупрозрачная рамка, а не сплошная оранжевая:
     когда молчат все три, сплошные рамки красили весь раздел и уже ничего
     не выделяли. Точка и подпись говорят то же самое точнее. */
  .node-card.warn { border-color: color-mix(in srgb, var(--warn) 30%, var(--cardLine, var(--line))); }
  .node-top { display: flex; align-items: flex-start; gap: 10px; }
  .node-top .flag { margin-top: 2px; }
  .node-names { flex: 1; min-width: 0; }
  .node-name { font-size: 15px; font-weight: 600; letter-spacing: -.01em; color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .node-host { margin-top: 2px; font: 11.5px/1.4 'JetBrains Mono', monospace; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .node-stats { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) minmax(0, 1.1fr); gap: var(--s3); }
  .stat-label { font-size: var(--fs-xs); font-weight: 500; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stat-value { margin-top: 3px; font-size: 16px; font-weight: 600; letter-spacing: -.02em; color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
  .stat-value.ok { color: var(--ok); }
  .stat-value.warn { color: var(--warnInk); }

  /* Журнал: время, кто, что — одной строкой. */
  .j-row { grid-template-columns: 132px 132px minmax(0, 1fr); align-items: baseline; min-height: 40px; }
  .j-when { font: 12px/1.4 'JetBrains Mono', monospace; color: var(--dim); white-space: nowrap; }
  .j-actor { justify-self: start; }
  .j-what { font-size: var(--fs-md); color: var(--fg); overflow-wrap: anywhere; }

  /* Страницы настроек — две колонки карточек вместо одной узкой с пустой
     правой половиной. Колонки, а не сетка: карточки разной высоты, и в сетке
     под короткой осталась бы дыра до конца длинной соседки. */
  .masonry { columns: 2 400px; column-gap: var(--gap, 12px); }
  .masonry > * { break-inside: avoid; margin-bottom: var(--gap, 12px); }
  .cards-2 { display: grid; gap: var(--gap, 12px); grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); align-items: start; }
  .pair { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
  .pair > div { display: flex; flex-direction: column; gap: 6px; min-width: 0; }

  /* Поля форм. */
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field-label { font-size: var(--fs-sm); font-weight: 500; color: var(--fg); }
  .help { font-size: var(--fs-sm); line-height: 1.5; color: var(--dim); text-wrap: pretty; }
  .card-foot { padding-top: var(--s3); border-top: 1px solid var(--hair); }
  .input {
    width: 100%; min-height: 36px; padding: 8px 11px;
    border-radius: var(--r-ctl); border: 1px solid var(--line);
    background: color-mix(in srgb, var(--bg) 55%, var(--surf)); color: var(--fg);
    font: inherit; font-size: var(--fs-md); outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .input:hover { border-color: color-mix(in srgb, var(--fg) 25%, var(--line)); }
  .input:focus { border-color: color-mix(in srgb, var(--acc) 70%, var(--line)); box-shadow: 0 0 0 3px var(--accSoft); }
  .input:focus-visible { outline: none !important; }
  .input.mono { font-family: 'JetBrains Mono', monospace; font-size: var(--fs-sm); }
  textarea.input { resize: vertical; line-height: 1.5; }
  /* Подписи полей в формах. Без правила подписи над полями копий и вебхуков
     выходили шестнадцатым кеглем — крупнее заголовка своей же карточки. */
  .form-card { gap: 14px; }
  .form-card label[for] { font-size: var(--fs-sm); font-weight: 500; color: var(--fg); }
  .form-card label:not([for]) { display: flex; align-items: center; gap: 10px; font-size: var(--fs-md); color: var(--fg); cursor: pointer; }
  .form-card input[type=checkbox], .check { accent-color: var(--acc); width: 16px; height: 16px; flex: none; cursor: pointer; }
  /* Кнопки здесь настоящие button: без сброса браузер рисует им свою рамку
     поверх стиля темы. */
  .form-card button { font-family: inherit; }
  .actions { display: flex; gap: var(--s2); flex-wrap: wrap; align-items: center; }
  .code {
    padding: 10px 12px; border-radius: var(--r-sm); background: color-mix(in srgb, var(--bg) 60%, var(--surf));
    border: 1px solid var(--hair); font: 11.5px/1.55 'JetBrains Mono', monospace; color: var(--fg);
    user-select: all; word-break: break-all;
  }
  pre.code { user-select: text; max-height: 260px; overflow: auto; white-space: pre-wrap; color: var(--dim); margin-top: var(--s2); }
  details summary { font-size: var(--fs-sm); color: var(--dim); cursor: pointer; width: max-content; }
  details summary:hover { color: var(--fg); }

  /* Обновления. */
  .upd-bar-top { display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap; }
  .upd-bar-top .eyebrow { margin-right: auto; display: inline-flex; align-items: center; gap: 8px; }
  .versions { display: flex; align-items: center; gap: var(--s4); flex-wrap: wrap; }
  .version-val { margin-top: 3px; font: 600 17px/1.2 'JetBrains Mono', monospace; color: var(--fg); }
  .version-val.new { color: var(--acc); }
  .versions > .ico { color: var(--dim); margin-top: 14px; }
  .upd-row { grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr) auto; overflow: hidden; }
  .upd-ver { font: 12px/1.4 'JetBrains Mono', monospace; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hour { display: flex; align-items: center; gap: var(--s2); }
  .hour-val { min-width: 64px; text-align: center; font: 600 17px/1 'JetBrains Mono', monospace; color: var(--fg); }
  .switch-row { display: flex; justify-content: space-between; align-items: center; gap: var(--s3); }

  /* Ход обновления: шаги с линией между ними; текущий пульсирует. */
  .upd-steps { display: flex; align-items: center; gap: 0; padding: 14px 16px; border-radius: var(--r, 14px);
    background: var(--cardBg, #15191d); border: 1px solid var(--cardLine, var(--line, #2a2f35)); overflow-x: auto; }
  .upd-step { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; color: var(--dim);
    font-size: 12px; white-space: nowrap; position: relative; }
  .upd-step:not(:last-child)::after { content: ""; flex: 1; min-width: 12px; height: 2px; margin: 0 10px; border-radius: 2px;
    background: var(--line, #2a2f35); transition: background .4s; }
  .upd-step.done::after { background: var(--acc, #c3ccd6); }
  .upd-step i { width: 18px; height: 18px; flex: none; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--line, #2a2f35);
    display: grid; place-items: center; transition: box-shadow .3s, background .3s; }
  .upd-step.done { color: var(--fg); }
  .upd-step.done i { background: var(--acc, #c3ccd6); box-shadow: none; }
  .upd-step.done i::before { content: ""; width: 7px; height: 4px; margin-top: -2px; border: solid var(--accFg, #0b0d10);
    border-width: 0 0 2px 2px; transform: rotate(-45deg); }
  .upd-step.now { color: var(--fg); font-weight: 600; }
  .upd-step.now i { box-shadow: inset 0 0 0 2px var(--acc, #c3ccd6); animation: updPulse 1.4s ease-out infinite; }
  @keyframes updPulse { 0% { box-shadow: inset 0 0 0 2px var(--acc, #c3ccd6), 0 0 0 0 rgba(var(--accRgb, 195,204,214), .45); }
    80%, 100% { box-shadow: inset 0 0 0 2px var(--acc, #c3ccd6), 0 0 0 9px rgba(var(--accRgb, 195,204,214), 0); } }
  /* Нода в пути — бегущая полоска под строкой; дошла — короткая вспышка. */
  .upd-node { position: relative; overflow: hidden; }
  .upd-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--track, rgba(195,204,214,.12)); }
  .upd-bar i { position: absolute; top: 0; bottom: 0; width: 35%; border-radius: 2px; background: var(--acc, #c3ccd6);
    animation: updRun 1.3s ease-in-out infinite; }
  @keyframes updRun { from { left: -35%; } to { left: 100%; } }
  .upd-node.fresh { animation: updDone .9s ease-out 1; }
  @keyframes updDone { from { box-shadow: inset 0 0 0 1px var(--ok, rgba(111,211,155,.6)); } to { box-shadow: inset 0 0 0 1px transparent; } }
  /* Тумблер автообновления. */
  .upd-switch { width: 40px; height: 24px; flex: none; border-radius: 12px; cursor: pointer; position: relative;
    background: var(--track, #2a2f35); box-shadow: inset 0 0 0 1px var(--hair, transparent); transition: background .25s; }
  .upd-switch i { position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%;
    background: var(--fg, #f1f4f7); box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: transform .25s cubic-bezier(.2,.8,.2,1); }
  .upd-switch.on { background: var(--acc, #c3ccd6); }
  .upd-switch.on i { transform: translateX(16px); background: var(--accFg, #0b0d10); }
  .upd-switch:focus-visible { outline: 2px solid var(--acc, #c3ccd6); outline-offset: 3px; }

  /* Вид: плитки тем идут вместе со страницей, ручки стоят рядом и не уезжают —
     выбрал тему внизу списка, а цвет акцента всё ещё под рукой. */
  .look-intro { flex-direction: row; align-items: center; gap: 18px; padding: 20px 24px; }
  .look-intro .logo { width: 48px; height: 48px; }
  .look-intro h2 { font-size: 18px; font-weight: 600; letter-spacing: -.025em; margin-bottom: 4px; }
  .look-intro p { max-width: 68ch; color: var(--dim); font-size: var(--fs-md); line-height: 1.55; }
  .look-intro .btn { margin-left: auto; }
  .look-grid { display: grid; gap: var(--gap, 12px); grid-template-columns: minmax(0, 1fr) 320px; align-items: start; }
  .look-tiles { display: grid; gap: var(--gap, 12px); grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
  .look-knobs {
    position: sticky; top: 0; max-height: calc(100vh - 52px - 24px); overflow-y: auto;
    padding-right: 4px; display: flex; flex-direction: column; gap: var(--gap, 12px);
  }
  .knob { gap: 10px; }
  .knob-title { font-size: var(--fs-md); font-weight: 600; color: var(--fg); }
  .knob-sub { margin-top: 6px; font-size: var(--fs-sm); font-weight: 500; color: var(--dim); }
  .knob-row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .knob-note { font-size: var(--fs-xs); color: var(--dim); font-variant-numeric: tabular-nums; }
  .knob-note.acc { color: var(--fg); }
  .swatches { display: flex; flex-wrap: wrap; gap: 7px; }
  .swatches > div { transition: transform .12s, outline-color .15s; }
  .swatches > div:hover { transform: scale(1.08); }
  .segs { display: flex; gap: 4px; padding: 3px; border-radius: var(--r-ctl); background: var(--chip); border: 1px solid var(--hair); }
  .seg {
    flex: 1 1 0; min-width: 0; text-align: center; padding: 6px 4px; border-radius: var(--r-sm);
    font-size: var(--fs-sm); font-weight: 500; color: var(--dim); cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .seg:hover { color: var(--fg); background: var(--hover); }
  .seg.on { background: var(--surf2); color: var(--fg); box-shadow: 0 1px 2px rgba(0, 0, 0, .18), inset 0 0 0 1px var(--hair); }
  .seg.wide { flex: 2 1 0; }
  .seg.danger { color: var(--warnInk); }
  .range { width: 100%; accent-color: var(--acc); cursor: pointer; }
  .code-box {
    padding: 10px 12px; border-radius: var(--r-sm); border: 1px dashed color-mix(in srgb, var(--acc) 60%, var(--line));
    background: var(--chip); font: 12px/1.5 'JetBrains Mono', monospace; letter-spacing: .03em; color: var(--fg);
    overflow-wrap: anywhere; user-select: text; cursor: copy;
  }
  .code-box:hover { background: var(--press); }
  .look-tile { transition: transform .18s var(--ease), box-shadow .18s; }

  /* Подъём под курсором — только у того, что открывается по нажатию. */
  .lift { transition: transform .18s var(--ease), box-shadow .18s, border-color .18s; }
  .lift:hover { transform: translateY(-2px); box-shadow: var(--pop); }
  .lift:active { transform: translateY(0); }

  /*
    Появление при смене раздела. Класс enter стоит на #app только на время
    входа: разметка пересобирается на каждое нажатие, и без этого карточки
    вздрагивали бы от каждого фильтра и каждой буквы в поиске. fill-mode
    backwards, а не both: застрявший конечный кадр перебил бы подъём под
    курсором.
  */
  #app.enter .rise { animation: rise .32s var(--ease) backwards; animation-delay: var(--d, 0ms); }
  #app.enter .grow { animation: grow .5s var(--ease) backwards; animation-delay: var(--d, 0ms); transform-origin: bottom; }
  #app.enter .reveal { animation: reveal .9s cubic-bezier(.4, 0, .2, 1) backwards; animation-delay: var(--d, 0ms); }
  #app.enter .bar > i, #app.enter .t-bar i { animation: fill .7s var(--ease) .12s backwards; }
  #app.enter .page-head { animation: fade .25s ease-out backwards; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
  @keyframes grow { from { transform: scaleY(0); } }
  @keyframes reveal { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
  @keyframes fill { from { transform: scaleX(0); } }
  @keyframes fade { from { opacity: 0; } }

  /*
    Ширина. От 1100 и ниже меню сжимается до значков (подписи — в
    подсказке), уже 720 — уезжает за край и открывается кнопкой в шапке:
    на телефоне 236 пикселей меню съели бы две трети экрана.
  */
  @media (max-width: 1099px) {
    .shell { grid-template-columns: 64px minmax(0, 1fr); }
    .side { padding-inline: 10px; align-items: stretch; }
    .side-brand { justify-content: center; padding: 0; }
    .brand-word, .nav-label, .nav-text, .host-chip { display: none; }
    .nav-group + .nav-group { border-top: 1px solid var(--hair); padding-top: var(--s3); }
    .side-nav { gap: var(--s3); }
    .nav-item, .side-btn { justify-content: center; padding: 0; height: 36px; }
    .nav-item.on::before { left: -10px; }
    .dash-grid, .stats-grid { grid-template-columns: minmax(0, 1fr); }
    .look-grid { grid-template-columns: minmax(0, 1fr) 280px; }
  }
  @media (max-width: 860px) {
    .look-grid { grid-template-columns: minmax(0, 1fr); }
    .look-knobs { position: static; max-height: none; overflow: visible; }
  }
  @media (max-width: 719px) {
    .shell { grid-template-columns: minmax(0, 1fr); }
    .side {
      position: fixed; z-index: 15; top: 0; bottom: 0; left: 0; width: min(280px, 84vw);
      padding: var(--s4) var(--s3) var(--s3); background: var(--surf); box-shadow: var(--pop);
      transform: translateX(-102%); transition: transform .24s var(--ease);
    }
    .shell.nav-open .side { transform: none; }
    .side-brand { justify-content: flex-start; padding: 0 var(--s2); }
    .brand-word, .nav-label, .nav-text, .host-chip { display: flex; }
    .nav-group + .nav-group { border-top: 0; padding-top: 0; }
    .nav-item, .side-btn { justify-content: flex-start; padding: 0 var(--s2); height: 40px; }
    .nav-item.on::before { left: calc(var(--s3) * -1); }
    .scrim { position: fixed; inset: 0; z-index: 14; background: rgba(0, 0, 0, .5); animation: fade .2s ease-out; }
    .topbar .menu-btn { display: inline-flex; margin-left: -8px; }
    .topbar { padding: 0 var(--s4); gap: var(--s2); }
    .crumb-group, .crumb-sep, .btn-text { display: none; }
    .top-actions .fresh { padding: 0; }
    .top-actions .btn-sm { width: 32px; padding: 0; }
    .p-main { padding: 0 var(--s4) var(--s6); }
    .p-main > :first-child { margin-top: var(--s4); }
    .h1 { font-size: 21px; }
    .page-head { align-items: flex-start; }
    .page-actions { width: 100%; }
    .page-actions .btn { flex: 1; }
    .kpi-row, .kpi-row.solo { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .kpi { padding: 12px; }
    .kpi-value { font-size: 22px; }
    .kpi-ico { display: none; }
    .node-grid, .cards-2 { grid-template-columns: minmax(0, 1fr); }
    .masonry { columns: 1; }
    .toolbar { flex-wrap: wrap; }
    .toolbar .search { flex-basis: 100%; }
    .chips { flex-wrap: nowrap; overflow-x: auto; margin: 0 calc(var(--s4) * -1); padding: 0 var(--s4); scrollbar-width: none; }
    /* Таблица карточками: подпись колонки над значением, имя во всю ширину. */
    .tbl-card > div > div:first-child { display: none !important; }
    .t-row { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) !important; gap: 10px var(--s3); padding: 14px var(--s4); }
    .t-row:first-of-type { border-top: 0; }
    .t-cell::before { content: attr(data-label); font-size: var(--fs-xs); color: var(--dim); }
    .t-cell.lead-cell { grid-column: 1 / -1; }
    .t-cell.lead-cell::before { display: none; }
    .t-cell.lead-cell .t-text { font-size: 15px; }
    .j-row { grid-template-columns: auto minmax(0, 1fr); }
    .j-what { grid-column: 1 / -1; }
    .look-intro { flex-wrap: wrap; padding: 16px; }
    .look-tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .look-intro .btn { margin-left: 0; }
    .upd-row { grid-template-columns: minmax(0, 1fr) auto; }
    .upd-row .upd-ver { grid-row: 2; }
    .soon-row { grid-template-columns: minmax(0, 1fr) auto; }
    .soon-row .when { grid-row: 2; grid-column: 1; }
    .soon-row .btn { grid-row: 1 / 3; grid-column: 2; }
  }

  /* Окно поверх панели. Цвета берутся из темы переменными, поэтому оно
     перекрашивается вместе с ней и не выпадает из выбранного вида. */
  #veil {
    position: fixed; inset: 0; z-index: 20;
    display: flex; align-items: center; justify-content: center;
    padding: 24px 16px;
    background: rgba(4, 6, 8, .58);
    animation: fade .16s ease-out;
  }
  #veil .sheet {
    width: 100%; max-width: 460px; max-height: 100%; overflow-y: auto;
    display: flex; flex-direction: column; gap: 14px;
    padding: 22px;
    border-radius: var(--r, 14px);
    background: var(--surf, #15191d);
    border: 1px solid var(--line, #2a2f35);
    box-shadow: var(--pop, 0 24px 60px -20px rgba(0, 0, 0, .7));
    color: var(--fg, #f1f4f7);
    animation: pop .2s var(--ease, ease-out);
  }
  @keyframes pop { from { opacity: 0; transform: translateY(6px) scale(.985); } }
  #veil h2 { font-size: 17px; font-weight: 600; letter-spacing: -.02em; }
  #veil label { display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 500; color: var(--fg, #f1f4f7); }
  #veil input[type=text], #veil input[type=number], #veil input[type=date], #veil select, #veil textarea {
    min-height: 38px; padding: 8px 11px;
    border-radius: var(--r-ctl, 9px);
    border: 1px solid var(--line, #2a2f35);
    background: color-mix(in srgb, var(--bg, #0c0e11) 55%, var(--surf, #15191d));
    color: var(--fg, #f1f4f7);
    font-family: Onest, system-ui, sans-serif; font-size: 13.5px; font-weight: 400;
    transition: border-color .15s, box-shadow .15s;
  }
  #veil input:focus, #veil select:focus, #veil textarea:focus { outline: none; border-color: var(--acc, #c3ccd6); box-shadow: 0 0 0 3px var(--accSoft, rgba(195,204,214,.14)); }
  #veil input:disabled { opacity: .45; }
  #veil .kinds { display: flex; border: 0; flex-direction: row; gap: 14px; flex-wrap: wrap; }
  #veil .kinds legend { font-size: 12px; color: var(--dim); margin-bottom: 8px; }
  #veil .kinds label { flex-direction: row; align-items: center; cursor: pointer; }
  #veil .kinds span { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--fg, #f1f4f7); }
  #veil .row { display: flex; gap: 8px; flex-wrap: wrap; padding-top: 4px; }
  #veil .line {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 8px 10px 8px 12px; border-radius: var(--r-ctl, 9px);
    background: var(--chip, rgba(255,255,255,.05)); border: 1px solid var(--hair, transparent);
  }
  #veil .line button { height: 28px; padding: 0 10px; font-size: 12px; }
  #veil .note { font-size: 12.5px; line-height: 1.55; color: var(--dim, #9aa3ad); }
  #veil button {
    height: 36px; padding: 0 14px;
    border-radius: var(--r-ctl, 9px); border: 1px solid var(--hair, transparent);
    font-family: Onest, system-ui, sans-serif; font-size: 13px; font-weight: 600;
    cursor: pointer;
    background: var(--chip, rgba(255,255,255,.06)); color: var(--fg, #f1f4f7);
  }
  #veil button:hover { background: var(--press, rgba(255,255,255,.1)); }
  #veil button:active { transform: translateY(1px); }
  #veil button.go { background: var(--acc, #c3ccd6); color: var(--accFg, #0c0e11); border-color: transparent; }
  #veil button.go:hover { background: color-mix(in srgb, var(--acc, #c3ccd6) 88%, var(--fg, #fff)); }
  #veil button.bad { background: var(--warnSoft, rgba(242, 160, 61, .16)); color: var(--warnInk, #f2a03d); border-color: transparent; }
  /* QR-код — на белом всегда: тёмная тема вокруг не должна сбивать камеру. */
  #veil img.qr {
    align-self: center; width: 220px; height: 220px;
    image-rendering: pixelated; background: #fff; border-radius: 10px;
  }
  #veil .own { display: flex; flex-direction: column; gap: 14px; }
  #veil .wizard, #veil .wizard-help { display: flex; flex-direction: column; gap: 8px; }
  #veil .inline { display: flex; gap: 8px; align-items: stretch; }
  #veil .inline input { flex: 1; min-width: 0; }
  #veil .inline button { height: auto; flex: none; }
  #veil .sec { margin-top: 6px; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--dim, #9aa3ad); }
  #veil .facts { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; font-size: 12.5px; }
  #veil .facts dt { color: var(--dim, #9aa3ad); }
  #veil .facts dd { color: var(--fg, #f1f4f7); min-width: 0; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
  /* Предпросмотр названия — как строка в списке серверов приложения. */
  #veil .title-preview {
    display: flex; flex-direction: column; gap: 6px; padding: 10px 12px;
    border-radius: var(--r-ctl, 9px); background: var(--chip, rgba(255,255,255,.05)); border: 1px solid var(--hair, transparent);
  }
  #veil .tp-head { font-size: 11px; color: var(--dim, #9aa3ad); }
  #veil .tp-row { display: flex; align-items: center; gap: 10px; min-width: 0; }
  #veil .tp-app { flex: none; width: 104px; font-size: 11.5px; color: var(--dim, #9aa3ad); }
  #veil .tp-name { display: flex; align-items: center; gap: 7px; min-width: 0; font-size: 13.5px; font-weight: 600; color: var(--fg, #f1f4f7); }
  #veil .tp-name > span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #veil .diag-list { display: flex; flex-direction: column; gap: 8px; }
  #veil .diag { display: flex; gap: 10px; align-items: flex-start; animation: pop .18s var(--ease, ease-out) both; }
  #veil .diag:nth-child(2) { animation-delay: .04s; } #veil .diag:nth-child(3) { animation-delay: .08s; }
  #veil .diag:nth-child(4) { animation-delay: .12s; } #veil .diag:nth-child(5) { animation-delay: .16s; }
  #veil .diag-mark {
    flex: none; width: 20px; height: 20px; display: grid; place-items: center; border-radius: 50%;
    font-size: 11px; font-weight: 700; background: var(--chip, rgba(255,255,255,.06)); color: var(--dim, #9aa3ad);
  }
  #veil .diag.ok .diag-mark { background: var(--okSoft); color: var(--ok); }
  #veil .diag.warn .diag-mark, #veil .diag.slow .diag-mark, #veil .diag.fail .diag-mark { background: var(--warnSoft); color: var(--warnInk); }
  #veil .diag-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  #veil .diag-title { font-size: 13px; color: var(--fg, #f1f4f7); }
  #veil .diag.fail .diag-title { font-weight: 600; }
  @media (prefers-reduced-motion: reduce) { #veil .diag { animation: none; } }
  #veil .step { font-size: 13px; color: var(--dim, #9aa3ad); }
  #veil .step.done { color: var(--fg, #f1f4f7); font-weight: 600; }
  #veil .step.done::before { content: "✓ "; color: var(--ok, #4cc38a); }
  #veil [hidden] { display: none; }
  #veil .plan {
    display: flex; flex-direction: column; gap: 2px; height: auto;
    padding: 10px 12px; border-radius: var(--r-ctl, 9px);
    text-align: left; cursor: pointer;
  }
  #veil .plan b { font-size: 14px; color: var(--fg, #f1f4f7); }
  #veil .plan span { font-size: 12px; font-weight: 400; color: var(--dim, #9aa3ad); }
  #veil .plan[aria-pressed="true"] { border-color: var(--acc, #c3ccd6); box-shadow: inset 0 0 0 1px var(--acc, #c3ccd6); }
  #veil pre {
    margin: 0; padding: 10px 12px;
    border-radius: var(--r-sm, 8px);
    background: color-mix(in srgb, var(--bg, #0c0e11) 60%, var(--surf, #15191d));
    border: 1px solid var(--hair, #2a2f35);
    font-family: 'JetBrains Mono', monospace; font-size: 11px; line-height: 1.55;
    white-space: pre-wrap; word-break: break-all; color: var(--fg, #f1f4f7);
  }

  /* Сообщение о результате. Внизу справа, само уходит: действия здесь
     короткие, и требовать закрывать каждое подтверждение — издевательство.
     У удачного — галочка, которая дорисовывается при появлении. */
  #toast {
    position: fixed; right: 18px; bottom: 18px; z-index: 30;
    max-width: min(380px, calc(100vw - 36px));
    display: flex; align-items: flex-start; gap: 10px;
    padding: 11px 14px 11px 12px; border-radius: 10px;
    font-size: 13px; line-height: 1.45;
    background: var(--surf2, #1f2328); color: var(--fg, #f1f4f7);
    border: 1px solid var(--line, #2a2f35);
    box-shadow: var(--pop, 0 16px 40px -12px rgba(0, 0, 0, .6));
    animation: toastIn .26s var(--ease, ease-out);
  }
  #toast::before {
    content: ""; flex: none; width: 18px; height: 18px; margin-top: 1px; border-radius: 50%;
    background: var(--okSoft, rgba(76,195,138,.15)) center / 12px no-repeat;
    box-shadow: inset 0 0 0 1.5px var(--ok, #4cc38a);
    animation: popIn .32s .08s var(--ease, ease-out) backwards;
  }
  #toast::after {
    content: ""; position: absolute; left: 18px; top: 17px; width: 6px; height: 3.5px;
    border: solid var(--ok, #4cc38a); border-width: 0 0 1.6px 1.6px; transform: rotate(-45deg);
    animation: popIn .32s .14s var(--ease, ease-out) backwards;
  }
  #toast.bad { background: var(--surf2, #1f2328); color: var(--fg, #f1f4f7); border-color: color-mix(in srgb, var(--warn, #f2a03d) 50%, transparent); }
  #toast.bad::before { background: var(--warnSoft, rgba(242,160,61,.16)); box-shadow: inset 0 0 0 1.5px var(--warn, #f2a03d); }
  #toast.bad::after { left: 23.5px; top: 15px; width: 1.6px; height: 7px; border: 0; background: var(--warn, #f2a03d); transform: none; box-shadow: 0 9px 0 var(--warn, #f2a03d); height: 6px; }
  @keyframes toastIn { from { opacity: 0; transform: translateY(8px); } }
  @keyframes popIn { from { opacity: 0; transform: scale(.4) rotate(-45deg); } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
  }
</style>
</head>
<body>

<div id="login">
  <form class="box" id="login-form">
    <div class="mark">
      <span class="logo" style="width: 26px; height: 26px;" aria-hidden="true"></span>
      <div class="word"><span class="wordmark" role="img" aria-label="Marvia"></span><span>PARTNER</span></div>
      <button type="button" id="login-lang" class="lang"></button>
    </div>
    <h1 id="login-title"></h1>
    <p id="login-hint"></p>
    <label id="login-label" for="login-token"></label>
    <input id="login-token" type="password" autocomplete="current-password" spellcheck="false" aria-describedby="login-err">
    <div class="err" id="login-err" role="status" aria-live="polite"></div>
    <button type="submit" id="login-enter"></button>
    <p class="brand-note" id="login-brand"></p>
  </form>
</div>

<!--
  Фон из файла. Лежит вне #app намеренно: перерисовка собирает #app заново,
  и видео начиналось бы с начала на каждое нажатие в панели.
-->
<div id="bg-layer" hidden style="position: fixed; inset: 0; z-index: -2; overflow: hidden;"></div>
<div id="bg-veil" hidden style="position: fixed; inset: 0; z-index: -1;"></div>

<div id="app" hidden></div>

<!--
  Значки одним набором: линия 1.6 на сетке 24, скругления на концах. Лежат

  <symbol id="i-clients" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.75 20c.7-3.4 3.2-5.25 6.25-5.25S14.55 16.6 15.25 20"/><path d="M15.5 4.9a3.5 3.5 0 0 1 0 6.2"/><path d="M17.6 14.9c1.9.6 3.2 2.3 3.65 5.1"/></symbol>

  <symbol id="i-stats" viewBox="0 0 24 24"><path d="M3.5 3.5v17h17"/><path d="m7.5 14.5 3.5-4 3 3 5-6"/></symbol>
  <symbol id="i-alerts" viewBox="0 0 24 24"><path d="M6 16.25V11a6 6 0 1 1 12 0v5.25l1.5 2.25h-15z"/><path d="M10 21a2.3 2.3 0 0 0 4 0"/></symbol>
  <symbol id="i-journal" viewBox="0 0 24 24"><rect x="4.5" y="3.5" width="15" height="17" rx="2"/><path d="M8.5 8.5h7M8.5 12h7M8.5 15.5h4"/></symbol>
  <symbol id="i-updates" viewBox="0 0 24 24"><path d="M19.5 11A7.5 7.5 0 0 0 6 6.6"/><path d="M5 3.5v3.75h3.75"/><path d="M4.5 13A7.5 7.5 0 0 0 18 17.4"/><path d="M19 20.5v-3.75h-3.75"/></symbol>
  <symbol id="i-look" viewBox="0 0 24 24"><path d="M4 7h8.5M17.5 7H20M4 17h2.5M11.5 17H20"/><circle cx="15" cy="7" r="2.5"/><circle cx="9" cy="17" r="2.5"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.35-5.65"/><path d="M20 4v4.5h-4.5"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11"/><path d="m7.5 10.5 4.5 4.5 4.5-4.5"/><path d="M4.5 19.5h15"/></symbol>

  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="m9.5 6 6 6-6 6"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m13.5 6.5 5.5 5.5-5.5 5.5"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></symbol>

  <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5"/><path d="m6 11 6-6 6 6"/></symbol>

<!--
  Разметка панели перенесена из дизайна (Marvia Seller.dc.html, экран S02)
  вместе с его же языком шаблонов: sc-for, sc-if и {{ }}. Так правку
  дизайна можно перенести обратной вставкой, а не переписыванием.

  Разделов «Платежи» и «Рассылка» здесь нет намеренно: их нет ни в базе, ни в
  API, а нарисованный раздел — это обещание. Тарифы — кнопка на странице
  клиентов, журнал — раздел среди настроек.
-->
<template id="shell">
  <div class="shell {{ shellCls }}">

    <!-- Меню: разделы сгруппированы по тому, зачем в них идут. -->
    <aside class="side" id="side-nav">
      <div class="side-brand">
        <span class="logo" style="width: 22px; height: 22px;" aria-hidden="true"></span>
        <div class="brand-word"><span class="wordmark" role="img" aria-label="Marvia"></span><span>PARTNER</span></div>
      </div>
      <nav class="side-nav" aria-label="{{ d18.head.menu }}">
        <sc-for list="{{ navGroups }}" as="g">
          <div class="nav-group" role="group" aria-label="{{ g.label }}">
            <div class="nav-label" aria-hidden="true">{{ g.label }}</div>
            <sc-for list="{{ g.items }}" as="n">
              <div class="{{ n.cls }}" data-focus="nav-{{ n.k }}" aria-current="{{ n.current }}" aria-label="{{ n.label }}" title="{{ n.label }}" onClick="{{ n.onClick }}">
                <svg class="ico" aria-hidden="true"><use href="#i-{{ n.k }}"></use></svg>
                <span class="nav-text">{{ n.label }}</span>
              </div>
            </sc-for>
          </div>
        </sc-for>
      </nav>
      <div class="side-foot">
        <div class="host-chip" title="{{ host }}"><span class="dot ok" aria-hidden="true"></span><span>{{ host }}</span></div>
        <div class="side-btn" onClick="{{ doLang }}" title="{{ d18.switchTitle }}" aria-label="{{ d18.switchTitle }}">
          <svg class="ico" aria-hidden="true"><use href="#i-globe"></use></svg><span class="nav-text">{{ d18.switchTitle }}</span>
        </div>
        <div class="side-btn" onClick="{{ doLogout }}" title="{{ d18.head.logout }}" aria-label="{{ d18.head.logout }}">
          <svg class="ico" aria-hidden="true"><use href="#i-logout"></use></svg><span class="nav-text">{{ d18.head.logout }}</span>
        </div>
      </div>
    </aside>
    <sc-if value="{{ navOpen }}">
      <div class="scrim" onClick="{{ closeNav }}"></div>
    </sc-if>

    <div class="main">
      <header class="topbar">
        <div class="btn btn-ghost btn-icon menu-btn" aria-label="{{ d18.head.menu }}" aria-controls="side-nav" aria-expanded="{{ navOpenStr }}" onClick="{{ toggleNav }}">
          <svg class="ico" aria-hidden="true"><use href="#i-menu"></use></svg>
        </div>
        <div class="crumbs">
          <span class="crumb-group">{{ crumbGroup }}</span>
          <svg class="ico crumb-sep" aria-hidden="true"><use href="#i-chev"></use></svg>
          <span class="crumb-page">{{ pageTitle }}</span>
        </div>
        <div class="top-actions">
          <!--
            Когда данные пришли. Пульсирует точка, только пока панель сама их
            подтягивает (раздел с данными, вкладка на виду); на настройках и при
            скрытой вкладке опрос стоит, и точка стоит вместе с ним.
          -->
          <sc-if value="{{ hasFresh }}">
            <div class="fresh" title="{{ freshTitle }}">
              <span class="{{ freshDot }}" aria-hidden="true"></span>
              <span id="fresh-text">{{ freshText }}</span>
            </div>
          </sc-if>
          <sc-if value="{{ isAdmin }}">
            <div class="btn btn-ghost btn-sm" onClick="{{ doBackup }}" title="{{ d18.head.backup }}" aria-label="{{ d18.head.backup }}">
              <svg class="ico" aria-hidden="true"><use href="#i-download"></use></svg><span class="btn-text">{{ d18.head.backup }}</span>
            </div>
          </sc-if>
          <div class="{{ reloadCls }}" onClick="{{ doReload }}" title="{{ reloadLabel }}" aria-label="{{ reloadLabel }}">
            <svg class="ico" aria-hidden="true"><use href="#i-refresh"></use></svg><span class="btn-text">{{ reloadLabel }}</span>
          </div>
        </div>
      </header>

      <!-- Ключ прокрутки свой у каждого раздела: при перерисовке место
           сохраняется, а при переходе в другой раздел страница начинается сверху. -->
      <main class="p-main" data-keep-scroll="main-{{ page }}">
        <div class="page-head">
          <div class="page-titles">
            <h1 class="h1">{{ pageTitle }}</h1>
            <p class="page-sub">{{ pageSub }}</p>
          </div>
          <div class="page-actions">
            <sc-if value="{{ hasCta2 }}">
              <div class="btn btn-secondary" data-focus="page-action-2" onClick="{{ doCta2 }}">{{ pageCta2 }}</div>
            </sc-if>
            <sc-if value="{{ hasCta }}">
              <div class="btn btn-primary" data-focus="page-action" onClick="{{ doCta }}">
                <svg class="ico" aria-hidden="true"><use href="#i-plus"></use></svg>{{ pageCta }}
              </div>
            </sc-if>
          </div>
        </div>

        <!--
          Поиск. Таблица рисует всех разом, и на трёхстах покупателях глазами
          нужного не найти. Ищем по тому, что продавец помнит: по метке и по
          внешнему номеру, под которым покупатель заведён у бота.
        -->
        <sc-if value="{{ hasSearch }}">
          <div class="toolbar">
            <label class="search">
              <svg class="ico" aria-hidden="true"><use href="#i-search"></use></svg>
              <input id="q" type="text" value="{{ q }}"
                     placeholder="{{ d18.search }}" aria-label="{{ d18.search }}" autocomplete="off" spellcheck="false"
                     onInput="{{ doSearch }}">
            </label>
            <sc-if value="{{ hasBulk }}">
              <div class="btn btn-secondary" data-focus="bulk" onClick="{{ doBulk }}">{{ bulkLabel }}</div>
            </sc-if>
          </div>
          <div class="chips" role="group" aria-label="{{ d18.filters.label }}">
            <sc-for list="{{ filterChips }}" as="f">
              <div class="{{ f.cls }}" role="button" tabindex="0" aria-pressed="{{ f.pressed }}" onClick="{{ f.onClick }}">{{ f.label }}<sc-if value="{{ f.count }}"><span class="chip-n">{{ f.count }}</span></sc-if></div>
            </sc-for>
          </div>
        </sc-if>

        <sc-if value="{{ hasError }}">
          <div class="notice warn" role="alert">
            <svg class="ico" aria-hidden="true"><use href="#i-alert"></use></svg>
            <div class="notice-text">{{ errText }}</div>
            <div class="btn btn-secondary btn-sm" onClick="{{ doReload }}">{{ d18.head.reload }}</div>
          </div>
        </sc-if>

        <!--
          С чего начать. Показывается, пока путь от пустой панели до первой
          продажи не пройден: нет ноды — продавать нечего, нет покупателя —
          некому, нет ключа — бот не сможет выдавать сам.

          Установщик панели последней строкой обещает «вкладка Ноды →
          Добавить ноду», и до сих пор продавец упирался в то, что этой кнопки
          нет. Здесь она стоит первой.
        -->
        <sc-if value="{{ showStart }}">
          <section class="card rise">
            <div class="card-head">
              <div class="card-title">{{ d18.start.title }}</div>
              <div class="start-count">{{ startCount }}</div>
            </div>
            <div class="bar"><i style="{{ startFill }}"></i></div>
            <div class="start-grid">
              <sc-for list="{{ startSteps }}" as="s">
                <div class="{{ s.cls }}" onClick="{{ s.onClick }}">
                  <div class="start-mark">
                    <sc-if value="{{ s.done }}"><svg class="ico" aria-hidden="true"><use href="#i-check"></use></svg></sc-if>
                    <sc-if value="{{ s.todo }}">{{ s.num }}</sc-if>
                  </div>
                  <div style="min-width: 0;">
                    <div class="start-title">{{ s.title }}</div>
                    <div class="start-note">{{ s.note }}</div>
                  </div>
                </div>
              </sc-for>
            </div>
          </section>
        </sc-if>

        <!--
          Главная отвечает на вопросы продавца, по важности: кого сейчас
          продлевать, выдерживают ли ноды и кто на каком тарифе.
        -->
        <sc-if value="{{ isDash }}">
          <div class="kpi-row">
            <sc-for list="{{ kpis }}" as="k">
              <div class="card kpi rise">
                <div class="kpi-top">
                  <span class="kpi-label">{{ k.label }}</span>
                  <span class="kpi-ico" aria-hidden="true"><svg class="ico"><use href="#i-{{ k.icon }}"></use></svg></span>
                </div>
                <sc-if value="{{ k.skel }}"><span class="skel num"></span></sc-if>
                <sc-if value="{{ k.ready }}"><div class="kpi-value" data-count="{{ k.label }}">{{ k.value }}</div></sc-if>
                <div class="kpi-foot">
                  <sc-if value="{{ k.trend }}"><span class="trend" title="{{ k.trendTitle }}"><svg class="ico" aria-hidden="true"><use href="#i-{{ k.trendIco }}"></use></svg>{{ k.trend }}</span></sc-if>
                  <span class="{{ k.deltaCls }}">{{ k.delta }}</span>
                </div>
              </div>
            </sc-for>
          </div>
          <div class="dash-grid">
            <div class="card feature rise">
              <div class="card-head">
                <div>
                  <div class="card-title">{{ d18.dash.traffic }}</div>
                  <div class="card-sub">{{ chartTotal }}</div>
                </div>
              </div>
              <div class="chart" role="img" aria-label="{{ chartLabel }}" onPointermove="{{ chartHover }}" onPointerleave="{{ chartLeave }}">
                <sc-if value="{{ hasChart }}">
                  <svg class="chart-svg reveal" viewBox="0 0 600 180" preserveAspectRatio="none" aria-hidden="true">
                    <defs>
                      <linearGradient id="fill-traffic" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0" class="stop-a"></stop>
                        <stop offset="1" class="stop-b"></stop>
                      </linearGradient>
                    </defs>
                    <path class="grid" d="M0 14H600M0 95H600"></path>
                    <path class="base" d="M0 176H600"></path>
