// el — короткий конструктор элемента: тег, класс, содержимое.
function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text != null) node.textContent = text;
  return node;
}

// pills рисует ряд таблеток: активная — акцентом. Все ручки темы, кроме
// цветов, выбираются так.
function pills(id, keys, current, names, onPick) {
  const box = $(id);
  box.replaceChildren();
  for (const k of keys) {
    const b = el("button", "pillb", names[k] || k);
    b.type = "button";
    b.dataset.focus = id + "-" + k;
    b.setAttribute("aria-pressed", String(current === k));
    b.addEventListener("click", () => onPick(k));
    box.append(b);
  }
}

function swatches(id, colors, current, paint, onPick) {
  const box = $(id);
  box.replaceChildren();
  for (const c of colors) {
    const b = el("button", "swatch");
    b.type = "button";
    b.dataset.focus = id + "-" + c;
    b.setAttribute("aria-label", c == null ? L().themeTintAuto : (id === "accents" ? L().themeAccent : id === "bases" ? L().themeBase : L().themeTint) + " " + c);
    b.style.background = paint(c);
    b.setAttribute("aria-pressed", String(current === c));
    b.addEventListener("click", () => onPick(c));
    box.append(b);
  }
}

// paintTheme рисует вкладку «Тема». Заново при каждой смене: у карточек
// подсветка выбранного, а у плиток — цвет активной, и всё это от темы.
// Прокрутка колонки ручек при этом остаётся: перерисовываются дети, а не
// сама колонка.
function paintTheme() {
  const focusKey = document.activeElement && document.activeElement.dataset.focus;
  const d = L();
  const t = Look.theme(look);
  $("theme-copy-status").textContent = "";

  // Основа — фон и текст палитры. Готовых видов больше нет: их место заняли
  // образы, а здесь остаётся только то, чего образ сам не решает.
  swatches("bases", Object.keys(Look.PRESETS), look.preset,
    (k) => "linear-gradient(135deg," + Look.PRESETS[k].bg + " 55%," + Look.PRESETS[k].acc + " 55%)",
    (k) => setLook({ preset: k }));

  swatches("accents", Look.ACCENTS, t.acc, (c) => c, (c) => setLook({ acc: c }));
  swatches("tints", [null].concat(Look.ACCENTS), look.tint,
    (c) => "linear-gradient(135deg," + (c || t.acc) + "," + Look.mix(c || t.acc, "#000000", 0.6) + ")",
    (c) => setLook({ tint: c }));
  // Пипетки: любой цвет, а не только из кружков.
  $("acc-pick").value = t.acc;
  $("tint-pick").value = look.tint || t.acc;

  // Лампа: экран, залитый настоящим фоном; нажатие в угол переносит свет.
  const litBg = (kind, dir) => Look.theme(Object.assign({}, look, { kind, dir })).bgcss;
  const lamp = $("lamp");
  lamp.replaceChildren();
  lamp.style.background = litBg(look.kind === "flat" ? "linear" : look.kind, look.dir);
  for (const k of ["nw", "n", "ne", "w", "c", "e", "sw", "s", "se"]) {
    const b = el("button");
    b.type = "button";
    b.dataset.focus = "lamp-" + k;
    b.setAttribute("aria-label", d.dirs[k]);
    b.setAttribute("aria-pressed", String(look.dir === k));
    b.append(el("i"));
    b.addEventListener("click", () => setLook({ dir: k, kind: look.kind === "flat" ? "linear" : look.kind }));
    lamp.append(b);
  }
  lamp.append(el("span", "hint", d.themeLampHint));
  $("light-note").textContent = look.kind === "flat" ? d.themeLightOff : d.dirs[look.dir];

  const kinds = $("kinds");
  kinds.replaceChildren();
  for (const k of Look.KINDS) {
    const b = el("button", "kind");
    b.type = "button";
    b.dataset.focus = "kind-" + k;
    b.setAttribute("aria-pressed", String(look.kind === k));
    const i = el("i");
    i.style.background = litBg(k, look.dir);
    b.append(i, el("span", null, d.kinds[k]));
    b.addEventListener("click", () => setLook({ kind: k }));
    kinds.append(b);
  }

  const depth = $("depth");
  depth.setAttribute("aria-label", d.themeDepth);
  depth.value = Math.round(look.depth * 100);
  $("depth-note").textContent = d.depths[look.depth <= 0.3 ? 0 : look.depth <= 0.5 ? 1 : look.depth <= 0.7 ? 2 : look.depth <= 0.85 ? 3 : 4];

  pills("cardKinds", Look.CARDS, look.card, d.cardKinds, (k) => setLook({ card: k }));
  pills("buttons", Look.BUTTONS, look.btn, d.buttons, (k) => setLook({ btn: k }));

  // Профили — три слота с кодами. Пустой слот занимается кнопкой «сохранить
  // сюда», занятый по нажатию применяется.
  const slots = Look.loadProfiles();
  const profiles = $("profiles");
  profiles.replaceChildren();
  slots.forEach((code, i) => {
    const b = el("button", "pillb", (code ? d.themeSlotFull : d.themeSlotEmpty) + " " + (i + 1));
    b.type = "button";
    b.dataset.focus = "profile-" + i;
    b.setAttribute("aria-pressed", String(profileSlot === i));
    b.addEventListener("click", () => {
      profileSlot = i;
      if (!code || !applyCode(code)) paintTheme();
    });
    profiles.append(b);
  });

  paintBackdropKnobs();
  $("theme-code").textContent = fullCode();
  $("theme-code").title = d.themeCopy;
  $("code-in").placeholder = d.themeCodePlaceholder;
  $("code-in").setAttribute("aria-label", d.themeCodePlaceholder);
  if (focusKey) {
    const next = Array.from(document.querySelectorAll("[data-focus]")).find((e) => e.dataset.focus === focusKey);
    if (next) next.focus({ preventScroll: true });
  }
}

// Слот профиля, в который пишет «сохранить сюда».
let profileSlot = 0;

on("depth", "input", (e) => setLook({ depth: Number(e.target.value) / 100 }));
on("acc-pick", "input", (e) => setLook({ acc: e.target.value.toLowerCase() }));
on("tint-pick", "input", (e) => setLook({ tint: e.target.value.toLowerCase() }));
on("profile-save", "click", () => {
  const slots = Look.loadProfiles();
  slots[profileSlot] = fullCode();
  Look.saveProfiles(slots);
  paintTheme();
});
on("theme-random", "click", () => {
  // Наугад — образ и свой акцент к нему: случайная смесь ручек давала кашу.
  const ids = Object.keys(VIBES);
  chooseVibe(ids[Math.floor(Math.random() * ids.length)]);
  setLook({ acc: Look.ACCENTS[Math.floor(Math.random() * Look.ACCENTS.length)] });
});
on("theme-code", "click", async () => {
  try {
    await navigator.clipboard.writeText(fullCode());
    $("theme-copy-status").textContent = L().themeCopied;
  } catch (_) { $("theme-copy-status").textContent = L().themeCopyFailed; }
});
on("code-in", "change", (e) => {
  const ok = applyCode(e.target.value);
  $("code-bad").hidden = ok;
  if (ok) e.target.value = "";
});
on("theme-reset", "click", () => chooseVibe("graphite"));
on("update-open", "click", () => api("POST", "api/update/open").catch(() => {}));

/* ------------------------------------------------------------- прокси */

/*
  Предупреждение о системном прокси.

  Показываем только при поднятом туннеле, и вот почему: пока туннель выключен,
  прокси никому не мешает и говорить не о чем. А вот когда окно написало «весь
  трафик компьютера идёт через туннель», это обещание должно быть верным — или
  рядом должно стоять честное «кроме вот этого».

  Кнопка снимает только настройку системы. Переменные окружения живут в уже
  запущенных программах, наша правка до них не дойдёт, и обещать обратное
  нечестно — так и пишем.
*/
// Помехи важны, только пока есть туннель или он только что не поднялся:
// второй VPN без туннеля никому не мешает, и пугать им до подключения незачем.
function showConflicts(s) {
  const list = s.conflicts || [];
  const live = s.state === "connected" || s.state === "stalled" || s.state === "failed";
  $("conflict-warn").hidden = list.length === 0 || !live;
  $("conflict-list").replaceChildren(...list.map((text) => {
    const li = document.createElement("li");
    li.textContent = text;
    return li;
  }));
}

function showCheck(s) {
  $("check-warn").hidden = !s.check;
  $("check-text").textContent = s.check || "";
}

let fixedTimer = 0;
function showFixed(done) {
  $("fix-done-text").textContent = L().fixDone + " " + done.join("; ");
  $("fix-done").hidden = false;
  clearTimeout(fixedTimer);
  fixedTimer = setTimeout(() => { $("fix-done").hidden = true; }, 15000);
}

// fixNow — «Починить» с любой карточки: что сделано, пишем рядом с кнопкой.
async function fixNow(button, said) {
  button.disabled = true;
  $(said).textContent = L().fixing;
  try {
    const r = await api("POST", "api/fix");
    $(said).textContent = "";
    render(r.state);
    showFixed(r.done);
  } catch (e) {
    $(said).textContent = e.message;
  } finally {
    button.disabled = false;
  }
}

// copyReport — отчёт собирает и кладёт в буфер программа: у страницы WebView2
// права на буфер бывают отняты, и кнопка молча не делала бы обещанного.
async function copyReport() {
  const said = $("log-copy-msg");
  try {
    await api("POST", "api/report/copy");
    said.textContent = L().logCopied;
  } catch (e) {
    said.textContent = e.message;
  }
}

async function recheck() {
  const button = $("check-again");
  button.disabled = true;
  $("check-msg").textContent = L().checking;
  try {
    const s = await api("POST", "api/check");
    render(s);
    $("check-msg").textContent = s.check ? "" : L().checkFine;
  } catch (e) {
    $("check-msg").textContent = e.message;
  } finally {
    button.disabled = false;
  }
}

function showProxy(s) {
  const box = $("proxy-warn");
  const show = s.state === "connected" && !!s.proxy;

  box.hidden = !show;
  if (!show) return;

  $("proxy-text").textContent = s.proxy;

  // Переменные окружения снять из реестра нельзя, поэтому и кнопку не
  // показываем: кнопка, которая не помогает, хуже её отсутствия.
  const button = $("proxy-off");
  button.hidden = s.proxy_env;
  $("proxy-care").hidden = s.proxy_env;
  $("proxy-msg").textContent = s.proxy_env
    ? L().proxyEnv
    : "";
}

async function dropProxy() {
  const button = $("proxy-off");
  const said = $("proxy-msg");

  button.disabled = true;
  said.textContent = L().proxyRemoving;
  try {
    const after = await api("POST", "api/proxy/off");
    render(after);
    if (!after.proxy) {
      said.textContent = L().proxyGone;
    }
  } catch (e) {
    said.textContent = e.message;
  } finally {
    button.disabled = false;
  }
}

/* ----------------------------------------------------------------- обмен */

// Всё лежит под одноразовым ключом в адресе: /<ключ>/. Запросы поэтому
// относительные — они сами попадают куда надо, а ключ нигде не дублируется.
const base = location.pathname.endsWith("/") ? location.pathname : location.pathname + "/";

async function api(method, path, body) {
  const res = await fetch(base + path, {
    method,
    headers: body ? { "Content-Type": "application/json" } : undefined,
    body: body ? JSON.stringify(body) : undefined,
  });
  const text = await res.text();
  const data = text ? JSON.parse(text) : {};
  if (!res.ok) throw new Error(data.error || (L().err + res.status));
  return data;
}

/* ----------------------------------------------------------- выбор ноды */

// Список стран рисуем сами, без шаблонов: строк единицы, а каждая новая
// зависимость в окне — это то, что придётся вшивать и обновлять.
//
// Текст не вставляем разметкой: имя и страну пишет продавец, и одна кавычка
// в названии сервера превратилась бы в сломанную страницу, а то и хуже.
// Вид окна: «marvia» — капсула ноды и страны строками, как было; «cards» —
// карточки «где вы», подписка и страны сеткой. Свой у каждого окна, как язык.
const HOME_VIEW_KEY = "marvia-home-view";
let homeView = "marvia", lastNodes = null;
try { homeView = localStorage.getItem(HOME_VIEW_KEY) === "cards" ? "cards" : "marvia"; } catch (_) { /* по умолчанию */ }
function applyHomeView() {
  document.body.dataset.home = homeView;
  for (const b of document.querySelectorAll("#home-view [data-view]")) b.setAttribute("aria-pressed", String(b.dataset.view === homeView));
}
for (const b of document.querySelectorAll("#home-view [data-view]")) {
  b.addEventListener("click", () => {
    homeView = b.dataset.view;
    try { localStorage.setItem(HOME_VIEW_KEY, homeView); } catch (_) { /* не запомнится */ }
    applyHomeView();
    if (lastNodes) paintNodes(lastNodes);
  });
}
applyHomeView();

function paintNodes(list) {
  const box = $("nodes-list");
  box.replaceChildren();
  lastNodes = list;
  box.dataset.view = homeView;

  const d = L();
  if (!list || list.length === 0) {
    const empty = document.createElement("div");
    empty.className = "hint";
    empty.textContent = d.nodesNone;
    box.append(empty);
    return;
  }
  if (homeView !== "cards") {
    paintNodeRows(box, list, d);
    return;
  }

  // Карточка страны. Код страны — крупно: флаги-эмодзи Windows рисует
  // двумя буквами, так что буквы честнее и одинаковы на любой машине.
  const card = (opts) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "nc" + (opts.auto ? " auto" : "");
    if (opts.current) b.setAttribute("data-current", "");
    if (opts.chosen) b.setAttribute("data-chosen", "");
    if (opts.dead) b.setAttribute("data-dead", "");
    if (opts.q) b.dataset.q = opts.q;

    const head = document.createElement("div");
    head.className = "nc-head";
    const code = document.createElement("span");
    code.className = "nc-code";
    if (opts.auto) {
      code.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>';
    } else {
      code.replaceChildren(flagEl(opts.code));
    }
    const titles = document.createElement("div");
    titles.className = "titles";
    const name = document.createElement("div");
    name.className = "name";
    name.textContent = bare(opts.name);
    const city = document.createElement("div");
    city.className = "city";
    city.textContent = opts.city;
    titles.append(name);
    if (opts.city) titles.append(city);
    head.append(code, titles);
    b.append(head);

    const marks = document.createElement("div");
    marks.className = "marks";
    for (const [text, kind] of opts.marks) {
      const m = document.createElement("span");
      m.className = "mark " + kind;
      m.textContent = text;
      marks.append(m);
    }
    if (opts.auto) {
      b.append(marks);
    } else {
      const foot = document.createElement("div");
      foot.className = "foot";
      const ping = document.createElement("span");
      ping.className = "ping";
      if (opts.ms > 0) {
        const sig = document.createElement("span");
        sig.className = "sig";
        sig.append(document.createElement("i"), document.createElement("i"), document.createElement("i"));
        const word = document.createElement("small");
        word.textContent = d.nodesQuality[opts.q];
        ping.append(sig, document.createTextNode(opts.ms + d.ms), word);
      } else {
        ping.textContent = d.pingUnknown;
        ping.style.color = "var(--dim)";
      }
      foot.append(ping, marks);
      b.append(foot);
    }
    b.addEventListener("click", () => chooseNode(opts.id));
    return b;
  };

  // Автовыбор — первым и отдельно: это состояние по умолчанию, и вернуться
  // к нему человек должен уметь так же легко, как уйти.
  const chosenAny = list.some((n) => n.chosen);
  const fastest = list.filter((n) => n.alive && n.ms > 0).sort((a, b) => a.ms - b.ms)[0];
  box.append(card({
    id: 0, auto: true,
    name: d.nodesAuto,
    city: fastest ? d.nodesAutoSub + " — " + (fastest.country || fastest.name) : d.nodesAutoSub,
    chosen: !chosenAny,
    marks: chosenAny ? [] : [[d.nodesAutoOn, "mine"]],
  }));

  const grid = document.createElement("div");
  grid.className = "node-grid";
  box.append(grid);
  for (const n of list) {
    // Страна крупно, город и имя ноды мельче. Продавец пишет «ОАЭ · Дубай»;
    // нет страны — крупно имя ноды, как есть.
    const place = n.country || n.name;
    const code = countryCode(n.country, n.name);
    // «fi» или «FI» вместо страны — продавец написал код; показываем
    // название страны на языке окна, его знает сам браузер.
    let country = place.split("·")[0].trim();
    if (/^[A-Za-z]{2}$/.test(country) && code) country = regionName(code) || country;
    const cityPart = place.includes("·") ? place.split("·").slice(1).join("·").trim() : "";
    const city = [cityPart, n.country && n.name !== n.country ? n.name : ""].filter(Boolean).join(" · ");
    // Что метить: где трафик, что выбрал человек, кто молчит. Это разные
    // вещи: выбранная нода могла замолчать, и ядро уехало на живую.
    const marks = [];
    if (n.current) marks.push([d.nodesCurrent, "live"]);
    if (n.chosen) marks.push([d.nodesChosen, "mine"]);
    if (!n.alive && !n.current && n.ms > 0) marks.push([d.nodesDead, "dead"]);
    // Время подключения — отдельно от отклика: нода может отвечать быстро,
    // а подключаться долго, и именно это человек замечает при включении.
    if (n.setup_ms > 0) marks.push([d.setupLabel.toLowerCase() + " " + n.setup_ms + d.ms, ""]);
    const ms = n.ms > 0 ? n.ms : 0;
    grid.append(card({
      id: n.id,
      code,
      name: country,
      city,
      ms,
      q: ms === 0 ? "" : ms <= 120 ? "fast" : ms <= 300 ? "mid" : "slow",
      dead: !n.alive && !n.current && n.ms > 0,
      current: n.current,
      chosen: n.chosen,
      marks,
    }));
  }
}

// countryCode — две буквы страны из того, что написал продавец: явный код
// («fi-1», «[FI]», «FI · …»), флаг-эмодзи в имени или название страны и
// города. Не узнали — пусто, и карточка показывает точки, а не чужую страну.
// Адрес ноды никуда не отправляем: определять страну сторонним сервисом
// значило бы раскрыть ему адреса подписки.
const COUNTRY_WORDS = {
  fi: ["финлянд", "finland", "хельсинк", "helsinki"], nl: ["нидерланд", "голланд", "netherlands", "амстердам", "amsterdam"],
  de: ["герман", "germany", "франкфурт", "frankfurt", "берлин", "berlin"], ae: ["оаэ", "эмират", "uae", "emirates", "дубай", "dubai"],
  us: ["сша", "usa", "united states", "нью-йорк", "new york"], gb: ["британ", "англия", "united kingdom", "london", "лондон"],
  fr: ["франц", "france", "париж", "paris"], pl: ["польш", "poland", "варшав", "warsaw"], se: ["швец", "sweden", "стокгольм", "stockholm"],
  ch: ["швейцар", "switzerland", "цюрих", "zurich"], tr: ["турц", "turkey", "türkiye", "стамбул", "istanbul"],
  kz: ["казах", "kazakhstan", "алматы", "almaty"], jp: ["япон", "japan", "токио", "tokyo"], sg: ["сингапур", "singapore"],
  ee: ["эстон", "estonia", "таллин", "tallinn"], lv: ["латви", "latvia", "рига", "riga"], lt: ["литв", "lithuania", "вильнюс", "vilnius"],
  es: ["испан", "spain", "мадрид", "madrid"], it: ["итал", "italy", "милан", "milan"], ca: ["канад", "canada", "торонто", "toronto"],
  am: ["армен", "armenia", "ереван", "yerevan"], ge: ["грузи", "georgia", "тбилиси", "tbilisi"], rs: ["серби", "serbia", "белград", "belgrade"],
  at: ["австри", "austria", "вена", "vienna"], cz: ["чехи", "czech", "прага", "prague"], no: ["норвег", "norway", "осло", "oslo"],
  hk: ["гонконг", "hong kong"], in: ["инди", "india"], kr: ["корея", "korea", "сеул", "seoul"], il: ["израил", "israel"],
  ru: ["росси", "russia", "москв", "moscow"], ua: ["украин", "ukraine", "киев", "kyiv"], md: ["молдов", "moldova", "кишин"],
  bg: ["болгар", "bulgaria", "софия", "sofia"], ro: ["румын", "romania", "бухарест", "bucharest"], hu: ["венгр", "hungary", "будапешт"],
  pt: ["португал", "portugal", "лиссабон", "lisbon"], ie: ["ирланд", "ireland", "дублин", "dublin"], be: ["бельги", "belgium", "брюссел"],
  dk: ["дани", "denmark", "копенгаген"], is: ["исланд", "iceland", "рейкьявик"], lu: ["люксембург", "luxembourg"],
  uz: ["узбек", "uzbekistan", "ташкент"], az: ["азербайдж", "azerbaijan", "баку", "baku"],
};
function regionName(code) {
  try { return new Intl.DisplayNames([lang === "en" ? "en" : "ru"], { type: "region" }).of(code) || ""; } catch (_) { return ""; }
}
function countryCode(country, name) {
  const text = ((country || "") + " " + (name || "")).trim();
  const flag = [...text].map((c) => c.codePointAt(0)).find((cp, i, all) => cp >= 0x1f1e6 && cp <= 0x1f1ff && all[i + 1] >= 0x1f1e6 && all[i + 1] <= 0x1f1ff);
  if (flag) {
    const cps = [...text].map((c) => c.codePointAt(0));
    const at = cps.indexOf(flag);
    return String.fromCharCode(65 + cps[at] - 0x1f1e6, 65 + cps[at + 1] - 0x1f1e6);
  }
  const bare = /^\s*([A-Za-z]{2})\s*(?:·|$)/.exec(country || "");
  if (bare && COUNTRY_WORDS[bare[1].toLowerCase()]) return bare[1].toUpperCase();
  const explicit = /\[([A-Za-z]{2})\]/.exec(text) || /^([A-Z]{2})(?:\s|·|$)/.exec(text.trim()) || /(?:^|\s)([a-z]{2})[-_]\d+/.exec(text);
  if (explicit && COUNTRY_WORDS[explicit[1].toLowerCase()]) return explicit[1].toUpperCase();
  const low = text.toLowerCase().replace(/ё/g, "е");
  for (const [code, words] of Object.entries(COUNTRY_WORDS)) {
    if (words.some((w) => low.includes(w))) return code.toUpperCase();
  }
  return "";
}

// Флаги рисуем сами: эмодзи-флагов Windows не знает и пишет вместо них две
// буквы, а по буквам страну с полувзгляда не узнать. Полосы и кресты —
// точно, гербы и звёзды — упрощённо: флаг здесь для узнавания, не для
// геральдики. Разметка собирается только из этих постоянных — ни имя
// продавца, ни код из подписки в неё не попадают, код лишь выбирает рисунок.
const FLAG_H = {
  de: ["#000", "#DD0000", "#FFCE00"], nl: ["#AE1C28", "#FFF", "#21468B"], ru: ["#FFF", "#0039A6", "#D52B1E"],
  ee: ["#0072CE", "#000", "#FFF"], lt: ["#FDB913", "#006A44", "#C1272D"], am: ["#D90012", "#0033A0", "#F2A800"],
  at: ["#ED2939", "#FFF", "#ED2939"], hu: ["#CE2939", "#FFF", "#477050"], bg: ["#FFF", "#00966E", "#D62612"],
  lu: ["#ED2939", "#FFF", "#00A1DE"], rs: ["#C6363C", "#0C4076", "#FFF"], in: ["#FF9933", "#FFF", "#138808"],
  uz: ["#0099B5", "#FFF", "#1EB53A"], az: ["#00B5E2", "#EF3340", "#509E2F"],
};
const FLAG_V = {
  fr: ["#0055A4", "#FFF", "#EF4135"], it: ["#009246", "#FFF", "#CE2B37"], ie: ["#169B62", "#FFF", "#FF883E"],
  be: ["#000", "#FDDA24", "#EF3340"], ro: ["#002B7F", "#FCD116", "#CE1126"], md: ["#0046AE", "#FFD200", "#CC092F"],
};
const FLAG_X = {
  fi: ["#FFF", "#002F6C"], se: ["#006AA7", "#FECC00"], dk: ["#C8102E", "#FFF"],
  no: ["#BA0C2F", "#FFF", "#00205B"], is: ["#02529C", "#FFF", "#DC1E35"],
};
function flagSVG(code) {
  const c = (code || "").toLowerCase();
  const r = (x, y, w, h, f) => '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" fill="' + f + '"/>';
  if (FLAG_H[c]) {
    const [a, b, d] = FLAG_H[c];
    let s = r(0, 0, 30, 7, a) + r(0, 6.66, 30, 6.68, b) + r(0, 13.33, 30, 6.67, d);
    if (c === "in") s += '<circle cx="15" cy="10" r="2.6" fill="none" stroke="#000080" stroke-width=".8"/>';
    return s;
  }
  if (FLAG_V[c]) {
    const [a, b, d] = FLAG_V[c];
    return r(0, 0, 10, 20, a) + r(9.99, 0, 10.02, 20, b) + r(20, 0, 10, 20, d);
  }
  if (FLAG_X[c]) {
    const [bg, cross, inner] = FLAG_X[c];
    let s = r(0, 0, 30, 20, bg) + r(8, 0, 5, 20, cross) + r(0, 7.5, 30, 5, cross);
    if (inner) s += r(9.25, 0, 2.5, 20, inner) + r(0, 8.75, 30, 2.5, inner);
    return s;
  }
  switch (c) {
    case "pl": return r(0, 0, 30, 10, "#FFF") + r(0, 10, 30, 10, "#DC143C");
    case "ua": return r(0, 0, 30, 10, "#0057B7") + r(0, 10, 30, 10, "#FFD700");
    case "es": return r(0, 0, 30, 20, "#AA151B") + r(0, 5, 30, 10, "#F1BF00");
    case "lv": return r(0, 0, 30, 20, "#9E3039") + r(0, 8, 30, 4, "#FFF");
    case "ch": return r(0, 0, 30, 20, "#DA291C") + r(13, 4.5, 4, 11, "#FFF") + r(9.5, 8, 11, 4, "#FFF");
    case "jp": return r(0, 0, 30, 20, "#FFF") + '<circle cx="15" cy="10" r="6" fill="#BC002D"/>';
    case "ae": return r(0, 0, 30, 7, "#00732F") + r(0, 6.66, 30, 6.68, "#FFF") + r(0, 13.33, 30, 6.67, "#000") + r(0, 0, 8, 20, "#FF0000");
    case "tr": return r(0, 0, 30, 20, "#E30A17") + '<circle cx="11.5" cy="10" r="5" fill="#FFF"/><circle cx="12.8" cy="10" r="4" fill="#E30A17"/><circle cx="18" cy="10" r="1.6" fill="#FFF"/>';
    case "us": {
      let s = "";
      for (let i = 0; i < 13; i++) s += r(0, (i * 20) / 13, 30, 20 / 13 + 0.05, i % 2 ? "#FFF" : "#B22234");
      return s + r(0, 0, 13, 10.77, "#3C3B6E");
    }
    case "gb": return r(0, 0, 30, 20, "#012169")
      + '<path d="M0 0L30 20M30 0L0 20" stroke="#FFF" stroke-width="4"/><path d="M0 0L30 20M30 0L0 20" stroke="#C8102E" stroke-width="1.4"/>'
      + r(12, 0, 6, 20, "#FFF") + r(0, 7, 30, 6, "#FFF") + r(13.2, 0, 3.6, 20, "#C8102E") + r(0, 8.2, 30, 3.6, "#C8102E");
    case "ge": {
      let s = r(0, 0, 30, 20, "#FFF") + r(13, 0, 4, 20, "#FF0000") + r(0, 8, 30, 4, "#FF0000");
      for (const [x, y] of [[6.5, 4], [23.5, 4], [6.5, 16], [23.5, 16]]) s += r(x - 0.6, y - 2, 1.2, 4, "#FF0000") + r(x - 2, y - 0.6, 4, 1.2, "#FF0000");
      return s;
    }
    case "il": return r(0, 0, 30, 20, "#FFF") + r(0, 2, 30, 3, "#0038B8") + r(0, 15, 30, 3, "#0038B8")
      + '<path d="M15 6.2L18.3 11.9H11.7ZM15 13.8L11.7 8.1H18.3Z" fill="none" stroke="#0038B8" stroke-width=".9"/>';
    case "ca": return r(0, 0, 30, 20, "#FFF") + r(0, 0, 7.5, 20, "#D80621") + r(22.5, 0, 7.5, 20, "#D80621")
      + '<path d="M15 4.5l1.2 2.4 1.6-.6-.6 3.2 2-1.4.4 1.2 1.8-.2-.9 1.6.8.6-3.3 2.1.3 1.1-2.6-.4V17h-.6v-2.9l-2.6.4.3-1.1-3.3-2.1.8-.6-.9-1.6 1.8.2.4-1.2 2 1.4-.6-3.2 1.6.6z" fill="#D80621"/>';
    case "sg": return r(0, 0, 30, 10, "#EF3340") + r(0, 10, 30, 10, "#FFF")
      + '<circle cx="7" cy="5" r="3.2" fill="#FFF"/><circle cx="8.3" cy="5" r="3" fill="#EF3340"/>';
    case "hk": return r(0, 0, 30, 20, "#DE2910") + '<circle cx="15" cy="10" r="4.5" fill="#FFF"/><circle cx="15" cy="10" r="1.2" fill="#DE2910"/>';
    case "kr": return r(0, 0, 30, 20, "#FFF") + '<circle cx="15" cy="10" r="5" fill="#003478"/><path d="M10 10a5 5 0 0 1 10 0a2.5 2.5 0 0 1-5 0a2.5 2.5 0 0 0-5 0z" fill="#C60C30"/>';
    case "cz": return r(0, 0, 30, 10, "#FFF") + r(0, 10, 30, 10, "#D7141A") + '<path d="M0 0L15 10L0 20Z" fill="#11457E"/>';
    case "pt": return r(0, 0, 12, 20, "#006600") + r(12, 0, 18, 20, "#FF0000") + '<circle cx="12" cy="10" r="3.5" fill="#FFCC00"/>';
    case "kz": return r(0, 0, 30, 20, "#00AFCA") + '<circle cx="15" cy="9" r="3.6" fill="#FEC50C"/>';
  }
  return "";
}
// bare — название без эмодзи флага впереди. Подписки для Happ и Hiddify
// начинают имя ноды с флага, а Windows рисует его двумя буквами — «FI
// Финляндия» рядом с нашим флагом. Страну узнаём по исходному тексту, а
// показываем без флага.
function bare(s) {
  return String(s || "").replace(/^\s*(?:[\u{1F1E6}-\u{1F1FF}]{2}\s*)+/u, "");
}

// flagEl — флаг страны или, если рисунка нет, её буквы.
function flagEl(code) {
  const span = document.createElement("span");
  span.className = "flag";
  const svg = flagSVG(code);
  if (svg) {
    span.innerHTML = '<svg viewBox="0 0 30 20" preserveAspectRatio="none" aria-hidden="true">' + svg + "</svg>";
  } else if (code) {
    span.classList.add("txt");
    span.textContent = code;
  } else {
    // Страну не узнать — глобус, а не «··»: две точки читались как сломанная
    // картинка, а это просто сервер без указанной страны.
    span.classList.add("txt", "globe");
    span.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>';
  }
  if (code) span.title = regionName(code) || code;
  return span;
}
// autoMark — знак автовыбора на месте флага: молния.
function autoMark() {
  const span = document.createElement("span");
  span.className = "flag auto";
  span.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>';
  return span;
}

// paintNodeRows — страны строками, вид «Marvia»: точка состояния, имя и
// подпись, полоска качества и отклик.
function paintNodeRows(box, list, d) {
  const row = (opts) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "row-node";
    if (opts.alive) b.setAttribute("data-alive", "");
    if (opts.current) b.setAttribute("data-current", "");
    if (opts.chosen) b.setAttribute("data-chosen", "");

    // Слева — флаг страны, у автовыбора — молния: страна узнаётся с
    // полувзгляда, а точка состояния ничего не говорила.
    const dot = opts.id === 0 ? autoMark() : flagEl(opts.code);

    const grow = document.createElement("div");
    grow.className = "grow";
    const name = document.createElement("div");
    name.className = "name";
    name.textContent = bare(opts.name);
    const sub = document.createElement("div");
    sub.className = "sub";
    sub.textContent = opts.sub;
    b.title = bare(opts.name) + (opts.sub ? " — " + opts.sub : "");
    grow.append(name, sub);

    // Полоска качества: замер в миллисекундах на глаз не сравнить, а длина —
    // сравнивается. Триста миллисекунд и хуже — пусто.
    const bar = document.createElement("span");
    bar.className = "bar";
    const fill = document.createElement("i");
    fill.style.width = opts.ms > 0 ? Math.max(0, Math.min(100, Math.round((1 - opts.ms / 300) * 100))) + "%" : "0";
    bar.append(fill);

    const ms = document.createElement("div");
    ms.className = "ms";
    ms.textContent = opts.ms > 0 ? opts.ms + d.ms : opts.pending ? d.nodesMeasuring : d.pingUnknown;
    // Автовыбор — не нода: мерить у него нечего, и «не измерен» с пустой
    // полоской читалось бы как поломка. Место остаётся, чтобы колонки не
    // съезжали.
    if (opts.id === 0) {
      bar.style.visibility = "hidden";
      ms.textContent = "";
    }

    b.append(dot, grow, bar, ms);
    b.addEventListener("click", () => chooseNode(opts.id));
    return b;
  };

  // Автовыбор — первой строкой: это состояние по умолчанию, и вернуться к
  // нему человек должен уметь так же легко, как уйти.
  const chosenAny = list.some((n) => n.chosen);
  const fastest = list.filter((n) => n.alive && n.ms > 0).sort((a, b) => a.ms - b.ms)[0];
  box.append(row({
    id: 0,
    name: d.nodesAuto,
    sub: fastest ? d.nodesAutoSub + " — " + (fastest.country || fastest.name) : d.nodesAutoSub,
    ms: 0,
    alive: true,
    chosen: !chosenAny,
    current: false,
  }));

  for (const n of list) {
    // Что показываем под именем: сначала то, где трафик, потом выбор.
    // Это разные вещи: выбранная нода могла замолчать, и ядро уехало на живую.
    let sub = n.country && n.country !== n.name ? n.name : "";
    const marks = [];
    if (n.current) marks.push(d.nodesCurrent);
    if (n.chosen) marks.push(d.nodesChosen);
    // «Меряю» стоит справа, на месте числа; под именем — только итог.
    if (!n.pending && !n.alive && !n.current) marks.push(n.failed || n.ms > 0 ? d.nodesDead : d.nodesUnknown);
    if (marks.length) sub = sub ? sub + " · " + marks.join(" · ") : marks.join(" · ");

    box.append(row({
      id: n.id,
      code: countryCode(n.country, n.name),
      pending: n.pending,
      name: n.country || n.name,
      sub,
      ms: n.ms > 0 ? n.ms : 0,
      alive: n.alive,
      current: n.current,
      chosen: n.chosen,
    }));
  }
}

// Замер идёт в программе, а окно забирает то, что уже пришло: каждая
// страна появляется со своим числом, как только ответила, а не все разом
// через пятнадцать секунд.
let nodesPoll = 0;
function followMeasure(data) {
  clearTimeout(nodesPoll);
  const busy = !!(data && data.measuring);
  $("nodes-msg").textContent = busy ? L().nodesMeasuring : "";
  $("nodes-measure").disabled = busy;
  if (busy) nodesPoll = setTimeout(loadNodes, 600);
}

async function loadNodes() {
  try {
    const data = await api("GET", "api/nodes");
    paintNodes(data.nodes);
    followMeasure(data);
  } catch (e) {
    $("nodes-msg").textContent = e.message;
  }
}

// measureNodes — замер списка. Сам — при открытии «Серверов», если
// последний был давно: человек открывает список, чтобы выбрать, и выбирать
// надо по свежим числам, а не жать «Перемерить» каждый раз.
let measuredAt = 0;
async function measureNodes() {
  measuredAt = Date.now();
  try {
    const data = await api("POST", "api/nodes/measure");
    paintNodes(data.nodes);
    followMeasure(data);
  } catch (e) {
    $("nodes-msg").textContent = e.message;
  }
}
function openNodes() {
  if (lastStatus && lastStatus.state === "connected" && Date.now() - measuredAt > 120000) measureNodes();
  else loadNodes();
  // Пришёл на «Серверы» со скопированным ключом — предложим его сразу.
  offerClipboard(false);
}

async function chooseNode(id) {
  const msg = $("nodes-msg");
  msg.textContent = L().nodesSwitching;
  try {
    const data = await api("POST", "api/nodes/select", { id });
    paintNodes(data.nodes);
    msg.textContent = "";
  } catch (e) {
    msg.textContent = e.message;
  }
}

on("nodes-measure", "click", measureNodes);

/* -------------------------------------------------------------- величины */

function bytes(n) {
  const units = L().bytes;
  let i = 0;
  while (n >= 1024 && i < units.length - 1) { n /= 1024; i++; }
  return (i === 0 ? Math.round(n) : n.toFixed(1)) + " " + units[i];
}

function clock(seconds) {
  const h = Math.floor(seconds / 3600), m = Math.floor((seconds % 3600) / 60), s = seconds % 60;
  const two = (n) => String(n).padStart(2, "0");
  return two(h) + ":" + two(m) + ":" + two(s);
}

/* ------------------------------------------------------------- отрисовка */

// Названия состояний живут в словаре: их видит человек, а не программа.


/*
  Последняя ошибка, показанная в ответ на нажатие.

  Опрос состояния приходит раз в секунду и переписывает ту же строку, поэтому
  всё, что программа отвечает сразу — «не задана ссылка доступа», «нужны права
  администратора», — вспыхивало и пропадало быстрее, чем человек успевал
  прочитать. Он видел красный проблеск и нажимал снова.
*/
let complaint = null;
// connectingAt — когда окно увидело начало подключения; см. connectingLine.
let connectingAt = 0;

function complain(text) {
  complaint = { text, until: Date.now() + 12000 };
  $("detail").textContent = text;
}

function complaintNow() {
  if (complaint && Date.now() < complaint.until) return complaint.text;
  complaint = null;
  return null;
}

// Скорость — в мегабитах, как на телефоне и как её пишут провайдеры:
// «7,8 МБ/с» рядом с тарифом «100 Мбит/с» читается как втрое меньше.
function mbit(bytesPerSecond) {
  const v = Math.max(0, bytesPerSecond || 0) * 8 / 1e6;
  return v.toLocaleString(lang === "en" ? "en-US" : "ru-RU", {minimumFractionDigits: 1, maximumFractionDigits: 1}) + " " + L().mbps;
}

// Бегущая линия скорости — та же, что на телефоне (SpeedSpark). Замер раз в
// секунду; перерисуй его скачком — и линия дёргается на шаг, как старый
// осциллограф. Поэтому новый кадр рисуется сдвинутым на шаг вправо и плавно
// съезжает на место. Слева — нули: до подключения скорость и была нулевой.
const SPARK = 30;
const sparkSeen = {down: [], up: []};
function paintSpark(svg, key, value, live) {
  const seen = sparkSeen[key];
  if (live) { seen.push(Math.max(0, value || 0)); while (seen.length > SPARK + 1) seen.shift(); }
  else seen.length = 0;
  const list = Array(SPARK + 1 - seen.length).fill(0).concat(seen);
  const W = 300, H = 40, top = 4, bottom = H - 2, step = W / (SPARK - 1);
  // Шкала не ниже 0,5 Мбит/с: иначе фоновый шорох рисовался бы горами.
  const max = Math.max(0.5e6 / 8, ...list);
  const n = list.length;
  const pts = list.map((v, i) => [W - (n - 1 - i) * step, bottom - (bottom - top) * v / max]);
  const line = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");
  svg.querySelector(".line").setAttribute("d", line);
  svg.querySelector(".area").setAttribute("d", line + " L" + W + "," + H + " L" + pts[0][0].toFixed(1) + "," + H + " Z");
  svg.classList.toggle("live", live && seen.some(v => v > 0));
  const g = svg.querySelector("g");
  if (!live || matchMedia("(prefers-reduced-motion: reduce)").matches) { g.style.transition = "none"; g.style.transform = ""; return; }
  g.style.transition = "none";
  g.style.transform = "translateX(" + step + "px)";
  void g.getBoundingClientRect();
  g.style.transition = "transform .95s linear";
  g.style.transform = "translateX(0)";
}

function render(s) {
  const d = L();
  const prevStatus = lastStatus;
  if (s.state !== "connecting") connectingAt = 0;
  else if (!connectingAt) connectingAt = Date.now();
  lastStatus = s;
  paintNetcheck(s);
  paintQuality(s);
  if (openTab === "diag") paintRoute(s);
  // Нода сменилась сама или по выбору — сказать вслух: в журнал никто не
  // смотрит, а страна в капсуле меняется незаметно.
  if (prevStatus && prevStatus.state === "connected" && s.state === "connected" && prevStatus.node && s.node && prevStatus.node !== s.node) {
    const to = bare(s.node.split("·")[0]).trim();
    toast(s.moved_from ? d.movedBecause(bare(s.moved_from.split("·")[0]).trim(), to) : d.movedTo(to));
  }
  if (openTab === "settings") paintOverview();
  if (window.vibeState) window.vibeState(s.state);
  document.body.dataset.state = s.state;
  $("status").textContent = d.state[s.state] || s.state;
  $("power").dataset.state = s.state;
  // Во время подключения кнопка была заблокирована, а обработчик отмену умел:
  // человек полторы минуты смотрел на замершее окно и не мог ничего сделать.
  // Пока туннель снимается, жать нечего: новое подключение всё равно ждёт
  // конца уборки, а живая кнопка обещала бы то, чего не будет.
  $("power").disabled = !s.elevated || s.state === "disconnecting";
  $("power").title =
    s.state === "connecting" ? d.power.cancel
    : s.state === "connected" || s.state === "stalled" ? d.power.off
    : d.power.on;
  $("elev-warn").hidden = s.elevated;
  $("version").textContent = formatVersion(s.version);
  $("update-card").hidden = !s.update;
  if (s.update) $("update-title").textContent = d.updateTitle(s.update);
  // Точка на вкладке — чтобы заметили, не заходя в настройки.
  document.querySelector('.tab[data-tab="settings"]').classList.toggle("news", !!s.update);

  const detail = $("detail");

  // Пока подключаемся или подключились, жалоба уже неактуальна.
  if (s.state === "connecting" || s.state === "connected") complaint = null;

  const said = complaintNow();
  detail.classList.toggle("bad", s.state === "failed" || s.state === "stalled" || said !== null);
  if (said !== null) detail.textContent = said;
  else if (s.state === "failed") detail.textContent = s.reason || d.detail.unknown;
  else if (s.state === "stalled") detail.textContent = s.reason || d.detail.stalled;
  else if (s.state === "connecting") detail.textContent = connectingLine(s);
  else if (s.state === "disconnecting") detail.textContent = d.detail.disconnecting;
  else if (s.state === "connected") detail.textContent = s.since ? d.sessionLine(clock(Math.max(0, Math.floor(Date.now() / 1000) - s.since))) : d.detail.connected;
  else if (!s.has_account) detail.textContent = d.detail.noKey;
  else detail.textContent = d.detail.idle;

  // Поле ключа на первом экране — только пока ключа нет.
  $("first-key").hidden = s.has_account;

  // Подписка: до какого числа и сколько осталось — в боковой и на вкладке ключа.
  const parts = [];
  if (s.until) parts.push(d.until + s.until);
  if (s.limit_bytes > 0) parts.push(d.left + bytes(s.left_bytes || 0));
  $("sub-title").textContent = s.has_account ? d.subOn : d.subOff;
  $("subscription").textContent = parts.length ? parts.join(" · ") : (s.has_account ? d.subAfter : d.subNoKey);

  const up = s.state === "connected" || s.state === "stalled";
  paintKeyQuota(s);

  // Где вы: крупно страна, ниже город; справа отклик числом и словом, как
  // в списке стран. Адрес ноды покупателю ничего не говорит — он в подсказке.
  const place = $("place-card");
  const pingText = s.ping_ms ? s.ping_ms + d.ms : d.pingUnknown;
  if (s.node) {
    const head = bare(s.node.split("·")[0]).trim();
    const rest = s.node.split("·").slice(1).map((x) => x.trim()).filter(Boolean);
    $("place-code").replaceChildren(flagEl(countryCode(s.node, "")));
    $("node-name").textContent = head;
    const q = !s.ping_ms ? "" : s.ping_ms <= 120 ? "fast" : s.ping_ms <= 300 ? "mid" : "slow";
    $("node-addr").textContent = rest.join(" · ") || s.address || "";
    $("node-q").textContent = q ? d.nodesQuality[q] : "";
    $("node-ping").textContent = pingText;
    place.dataset.q = q;
    place.title = s.address || "";
    $("rule-now").textContent = head;
    $("now-sub").textContent = [rest.join(" · "), s.ping_ms ? pingText : ""].filter(Boolean).join(" · ");
    $("now-flag").replaceChildren(flagEl(countryCode(s.node, "")));
  } else {
    $("place-code").replaceChildren(flagEl(""));
    place.dataset.q = "";
    $("node-name").textContent = d.noNode;
    $("node-addr").textContent = d.noNodeSub;
    $("node-ping").textContent = "";
    $("node-q").textContent = "";
    $("rule-now").textContent = "—";
    $("now-sub").textContent = d.nowNone;
    $("now-flag").replaceChildren();
  }
  // Выбран ли сервер руками — по списку стран: у выбранного там отметка.
  const manual = (lastNodes || []).some((n) => n.chosen);
  $("now-mode").textContent = manual ? d.nowManual : d.nowAuto;
  if (manual) $("now-mode").setAttribute("data-manual", ""); else $("now-mode").removeAttribute("data-manual");

  // Сессия считается здесь, по моменту подъёма: секунды тикают сами, и
  // программе незачем слать готовую строку раз в секунду.
  const sessionText = up && s.since ? clock(Math.max(0, Math.floor(Date.now() / 1000) - s.since)) : "—";
  $("oc-name").textContent = bare(s.node) || d.noNode;
  $("oc-addr").textContent = s.node ? s.address || "" : d.noNodeSub;
  $("oc-ping").textContent = s.node ? pingText : "";
  $("k-session").textContent = sessionText;
  $("k-ping").textContent = s.node ? pingText : "—";

  // Подписка: дни крупно, полоса остатка. Срок и квоту ядро узнаёт при
  // дозвоне, поэтому до подключения честно говорим «после подключения».
  const plan = $("plan-card");
  // Программа пишет срок по-нашему, «14.11.2026»; на всякий случай
  // понимаем и «2026-11-14» — молча показать «без срока» было бы враньём.
  const dm = /^(\d\d)\.(\d\d)\.(\d{4})$/.exec(s.until || "");
  const di = /^(\d{4})-(\d\d)-(\d\d)/.exec(s.until || "");
  const end = dm ? new Date(+dm[3], +dm[2] - 1, +dm[1], 23, 59, 59) : di ? new Date(+di[1], +di[2] - 1, +di[3], 23, 59, 59) : null;
  const days = end ? Math.max(0, Math.floor((end - Date.now()) / 86400000)) : null;
  const known = !!s.until || s.limit_bytes > 0;
  $("plan-days").textContent = days !== null ? String(days) : known ? "∞" : "—";
  $("plan-word").textContent = days !== null ? d.planDays(days) : known ? d.planNoTerm : "";
  plan.toggleAttribute("data-soon", days !== null && days <= 3);
  plan.toggleAttribute("data-nolimit", !(s.limit_bytes > 0));
  $("plan-fill").style.width = s.limit_bytes > 0 ? Math.round(100 * Math.max(0, s.left_bytes || 0) / s.limit_bytes) + "%" : "0";
  $("plan-left").textContent = s.limit_bytes > 0 ? d.planLeft(bytes(s.left_bytes || 0), bytes(s.limit_bytes))
    : known ? d.planUnlimited : (s.has_account ? d.subAfter : d.subNoKey);

  showProxy(s);
  showConflicts(s);
  showCheck(s);
  paintSeller(s.seller);

  // Снятия делает ядро: скорость и пик не теряются, пока окно спрятано.
  const traffic = s.traffic || {};
  $("s-down").textContent = mbit(up ? traffic.rate_down : 0);
  $("s-up").textContent = mbit(up ? traffic.rate_up : 0);
  paintSpark($("spark-down"), "down", traffic.rate_down, up);
  paintSpark($("spark-up"), "up", traffic.rate_up, up);

  $("t-down").textContent = bytes(s.down || 0);
  $("t-up").textContent = bytes(s.up || 0);
  const today = bytes((traffic.today_up || 0) + (traffic.today_down || 0));
  $("today-total").textContent = today;
  $("w-today").textContent = today;
  $("peak-down").textContent = mbit(traffic.peak_down);
  $("peak-up").textContent = mbit(traffic.peak_up);
  const seconds = s.since ? Math.max(1, Date.now() / 1000 - s.since) : 0;
  $("average-down").textContent = seconds ? mbit((s.down || 0) / seconds) : "—";
  $("average-up").textContent = seconds ? mbit((s.up || 0) / seconds) : "—";
  paintDaily($("day-bars"), traffic.hours);
  paintDaily($("w-day-bars"), traffic.hours);
  paintWeek(traffic);


  // Виджет — тот же экран в другой шкуре: кнопка, состояние, сессия и
  // скорость, нода. Красится тем же, чем окно, только короче.
  $("w-power").dataset.state = s.state;
  $("w-power").dataset.btn = $("power").dataset.btn || "";
  $("w-power").disabled = $("power").disabled;
  $("w-power").title = $("power").title;
  $("w-status").textContent = $("status").textContent;
  const wmeta = [];
  if (up && s.since) wmeta.push(clock(Math.max(0, Math.floor(Date.now() / 1000) - s.since)));
  if (up) wmeta.push($("s-down").textContent);
  $("w-meta").textContent = wmeta.length ? wmeta.join(" · ") : (!s.has_account ? d.wNoKey : $("detail").textContent);
  $("w-node").textContent = bare(s.node) || d.noNode;
  $("w-ping").textContent = $("node-ping").textContent;
  $("w-session").textContent = sessionText;
  $("w-down").textContent = $("s-down").textContent;
  $("w-up").textContent = $("s-up").textContent;
  $("w-t-down").textContent = $("t-down").textContent;
  $("w-t-up").textContent = $("t-up").textContent;
  $("w-kping").textContent = s.node ? pingText : "—";
  // Точечные цифры — после виджета: он берёт из этих полей обычный текст.
  if (window.paintDotNums) window.paintDotNums();
}

function paintDaily(box, hours) {
  const values = Array.from({length: 24}, (_, i) => Math.max(0, Number(hours && hours[i]) || 0));
  const current = new Date().getHours();
  const signature = current + ":" + values.join(",");
  if (box.dataset.values === signature) return;
  box.dataset.values = signature;
  if (box.children.length !== 24) {
    box.replaceChildren(...values.map(() => document.createElement("i")));
  }
  const highest = Math.max(1, ...values);
  [...box.children].forEach((bar, i) => {
    bar.style.height = Math.max(4, values[i] / highest * 100) + "%";
    bar.title = String(i).padStart(2, "0") + ":00 · " + bytes(values[i]);
    bar.toggleAttribute("data-current", i === current);
  });
}

// paintWeek — семь суток столбиками, от старых к сегодняшним. Дни программа
// присылает уже с нулями там, где туннеля не было, — пропуск читался бы как
// «этого дня не было».
// Неделя или месяц — выбор запоминается на этом компьютере.
var trafficSpan = 7;
try { trafficSpan = localStorage.getItem("marvia-traffic-span") === "30" ? 30 : 7; } catch (_) { /* неделя */ }
var lastTraffic = null;
for (const b of document.querySelectorAll("#span-pick [data-span]")) {
  b.addEventListener("click", () => {
    trafficSpan = Number(b.dataset.span);
    try { localStorage.setItem("marvia-traffic-span", String(trafficSpan)); } catch (_) { /* не запомнится */ }
    if (lastTraffic) paintWeek(lastTraffic);
  });
}
function paintWeek(traffic) {
  lastTraffic = traffic;
  const d = L(), month = trafficSpan === 30;
  $("span-title").textContent = month ? d.monthTraffic : d.weekTraffic;
  for (const b of document.querySelectorAll("#span-pick [data-span]")) {
    b.setAttribute("aria-pressed", String(Number(b.dataset.span) === trafficSpan));
    b.textContent = b.dataset.span === "30" ? d.spanMonth : d.spanWeek;
  }
  const week = (month ? traffic.month : traffic.week) || [];
  const days = week.map((w) => ({ day: w.day, total: Math.max(0, (w.up || 0) + (w.down || 0)) }));
  const box = $("week-bars");
  const signature = lang + ":" + trafficSpan + ":" + days.map((w) => w.day + "=" + w.total).join(",");
  if (box.dataset.values === signature) return;
  box.dataset.values = signature;
  const highest = Math.max(1, ...days.map((w) => w.total));
  // Название дня недели — по местному календарю, на языке окна: дату
  // разбираем как местную полночь, а не как UTC, иначе вечером на западе
  // от Гринвича подпись съехала бы на день назад.
  const label = (iso) => {
    const [y, m, dd] = iso.split("-").map(Number);
    return new Date(y, m - 1, dd).toLocaleDateString(lang === "ru" ? "ru-RU" : "en-GB", { weekday: "short" });
  };
  box.replaceChildren(...days.map((w, i) => {
    const bar = document.createElement("i");
    bar.style.height = Math.max(4, w.total / highest * 100) + "%";
    bar.title = label(w.day) + " · " + bytes(w.total);
    bar.toggleAttribute("data-current", i === days.length - 1);
    return bar;
  }));
  // У месяца подписан каждый пятый день числом: тридцать названий дней
  // недели в узкой карточке слились бы в кашу.
  $("week-axis").replaceChildren(...days.map((w, i) => {
    const s = document.createElement("span");
    s.textContent = !month ? label(w.day) : (days.length - 1 - i) % 5 === 0 ? String(Number(w.day.slice(8))) : "";
    return s;
  }));
  const total = days.reduce((a, w) => a + w.total, 0);
  $("week-total").textContent = days.length ? bytes(total) : "—";
  $("week-average").textContent = days.length ? bytes(total / days.length) : "—";
  const peak = days.reduce((a, w) => (w.total > a.total ? w : a), { total: 0 });
  const peakName = month ? Number(peak.day && peak.day.slice(8)) + "." + (peak.day && peak.day.slice(5, 7)) : label(peak.day);
  $("week-peak").textContent = peak.total ? peakName + " · " + bytes(peak.total) : "—";
}

// paintLog раскладывает строки журнала: время отдельно, текст отдельно.
// Строка приходит как «ЧЧ:ММ:СС  текст» — программа так их и пишет.
function paintLog(lines) {
  const box = $("log");
  const list = lines || [];
  if (list.length === 0) {
    const empty = document.createElement("div");
    empty.className = "hint";
    empty.textContent = L().logEmpty;
    box.replaceChildren(empty);
    return;
  }
  // Перерисовываем только когда число строк изменилось: журнал опрашивается
  // каждую секунду, а прокрутку человек ставит руками.
  if (box.dataset.count === String(list.length)) return;
  box.dataset.count = String(list.length);

  const stuck = box.scrollTop + box.clientHeight >= box.scrollHeight - 8;
  box.replaceChildren(...list.map((line) => {
    const ln = document.createElement("div");
    ln.className = "ln";
    const tm = document.createElement("span");
    tm.className = "tm";
    const tx = document.createElement("span");
    tx.className = "msg";
    const m = /^(\d\d:\d\d:\d\d)\s+(.*)$/s.exec(line);
    tm.textContent = m ? m[1] : "";
    tx.textContent = m ? m[2] : line;
    ln.append(tm, tx);
    return ln;
  }));
  if (stuck) box.scrollTop = box.scrollHeight;
}

let busy = false;

// connectingLine — что подключение делает сейчас и сколько уже идёт: по
// одному «Подключаюсь» не понять, работает программа или зависла.
function connectingLine(s) {
  const d = L();
  const step = (s.step && d.detail.steps[s.step]) || d.detail.connecting;
  const secs = connectingAt ? Math.floor((Date.now() - connectingAt) / 1000) : 0;
  return secs >= 2 ? step + " · " + secs + " " + d.secShort : step;
}

// showState — нажатие видно сразу, не дожидаясь ответа программы: иначе
// между щелчком и следующим опросом кнопка выглядела нетронутой, и её жали
// ещё раз — а второе нажатие отменяло первое.
function showState(state) {

}

async function togglePower() {
  if (busy) return;
  busy = true;
  try {
    const s = await api("GET", "api/state");
    if (s.state === "disconnecting") return;
    // «Связь потеряна» — туннель стоит, нода молчит: кнопка его снимает, как
    // и у подключённого. Раньше она звала «подключиться», программа молча
    // отвечала «уже подключено», и ничего не происходило.
    if (s.state === "connected" || s.state === "connecting" || s.state === "stalled") {
      showState("disconnecting");
      await api("POST", "api/disconnect");
    } else {
      showState("connecting");
      await api("POST", "api/connect");
    }
    await tick();
  } catch (err) {
    complain(err.message);
    $("detail").classList.add("bad");
  } finally {
    busy = false;
  }
}
on("power", "click", togglePower);
on("w-power", "click", togglePower);

// Настройки подключения: состояние берём у программы, а не помним сами —
// под переключателем нужна правда о списке, а она есть только там.
let conn = null;
function paintConn() {
  if (!conn) return;
  const d = L();
  const ru = $("bypass-ru");
  ru.textContent = conn.bypass_russian ? d.toggleOn : d.toggleOff;
  ru.setAttribute("aria-pressed", String(!!conn.bypass_russian));
  // Включённый переключатель без списка ничего не уводит — человек должен
  // это видеть, а не гадать, почему банк всё ещё видит заграницу.
  $("bypass-ru-msg").textContent = !conn.bypass_russian ? ""
    : conn.ru_error ? d.bypassRuFailed(conn.ru_error)
    : conn.ru_count ? d.bypassRuCount(conn.ru_count)
    : d.bypassRuNone;
  const lan = $("lan");
  lan.textContent = conn.lan_outside ? d.toggleOn : d.toggleOff;
  lan.setAttribute("aria-pressed", String(!!conn.lan_outside));
  paintSites("direct");
  paintSites("tunnel");
  paintApps("direct");
  paintApps("tunnel");

  // Под kill switch — стоит ли он сейчас на самом деле: включённый тумблер
  // без фильтра хуже выключенного, человек думает, что защищён.
  const ks = $("kill-switch");
  ks.textContent = conn.kill_switch ? d.toggleOn : d.toggleOff;
  ks.setAttribute("aria-pressed", String(!!conn.kill_switch));
  $("kill-switch-msg").textContent = !conn.kill_switch ? ""
    : conn.kill_switch_error ? d.killSwitchFailed(conn.kill_switch_error)
    : conn.kill_switch_in_use ? d.killSwitchOn
    : d.killSwitchWait;

  const af = $("auto-fix");
  af.textContent = conn.auto_fix ? d.toggleOn : d.toggleOff;
  af.setAttribute("aria-pressed", String(!!conn.auto_fix));

  const rep = $("reports");
  rep.textContent = conn.reports ? d.reportsOn : d.reportsOff;
  rep.setAttribute("aria-pressed", String(!!conn.reports));

  const v6 = $("ipv6");
  v6.textContent = conn.ipv6 ? d.toggleOn : d.toggleOff;
  v6.setAttribute("aria-pressed", String(!!conn.ipv6));
  $("ipv6-msg").textContent = conn.ipv6_in_use !== undefined && conn.ipv6_in_use !== conn.ipv6 ? d.fragmentNext : "";

  const frag = $("fragment");
  frag.textContent = conn.fragment ? d.toggleOn : d.toggleOff;
  frag.setAttribute("aria-pressed", String(!!conn.fragment));
  $("fragment-msg").textContent = conn.fragment_in_use !== undefined && conn.fragment_in_use !== conn.fragment ? d.fragmentNext : "";

  // «Только TCP» — про QUIC нод Marvia; у чужого ключа его нет, и строка
  // с переключателем, который ничего не меняет, была бы обещанием впустую.
  const tcp = $("tcp-only");
  tcp.textContent = conn.tcp_only ? d.toggleOn : d.toggleOff;
  tcp.setAttribute("aria-pressed", String(!!conn.tcp_only));
  $("tcp-only-msg").textContent = conn.tcp_only_in_use !== undefined && conn.tcp_only_in_use !== conn.tcp_only ? d.fragmentNext : "";
  const active = keys.find((k) => k.active);
  $("tcp-only-row").hidden = !!(active && active.foreign);
  $("fp-row").hidden = !!(active && active.foreign);
  for (const b of document.querySelectorAll("#fp-pick [data-fp]")) {
    b.setAttribute("aria-pressed", String(b.dataset.fp === (conn.fingerprint || "")));
  }
  $("fp-msg").textContent = conn.fingerprint_in_use !== undefined && conn.fingerprint_in_use !== (conn.fingerprint || "") ? d.fragmentNext : "";

  // Свой адрес, которого нет среди четырёх, показываем в поле: иначе
  // человек не увидел бы, что выбрано.
  let known = false;
  for (const b of document.querySelectorAll("#dns-pick [data-dns]")) {
    const mine = b.dataset.dns === conn.dns;
    known = known || mine;
    b.setAttribute("aria-pressed", String(mine));
  }
  const custom = $("dns-custom");
  custom.placeholder = d.dnsCustom;
  if (document.activeElement !== custom) custom.value = known ? "" : conn.dns || "";

const SPEED_KEY = "marvia-speed-history";

// countUp — число набегает за полсекунды: результат замера видно как
// результат, а не как подменённую строку.
function countUp(el, to, fmt) {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) { el.textContent = fmt(to); return; }
  const start = performance.now();
  const step = (now) => {
    const k = Math.min(1, (now - start) / 600);
    el.textContent = fmt(to * (1 - Math.pow(1 - k, 3)));
    if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

// toast — короткое сообщение внизу окна. Только о том, что случилось само,
// без нажатия: переезд на другую ноду человек иначе не заметит.
let toastTimer = 0;
function toast(text) {
  const t = $("toast");
  t.textContent = text;
  t.setAttribute("data-show", "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.removeAttribute("data-show"), 4500);
}

// paintQuality — отклик последних минут: полоска на каждый замер, высота —
// время ответа, красная — ответа не было. Под ней джиттер и потери: ровная
// ли связь, а не только быстрая ли.
function paintQBars(bars, samples, height) {
  const top = Math.max(60, ...samples);
  while (bars.children.length < samples.length) bars.append(document.createElement("i"));
  while (bars.children.length > samples.length) bars.firstChild.remove();
  samples.forEach((ms, i) => {
    const bar = bars.children[i];
    if (ms > 0) { bar.removeAttribute("data-lost"); bar.style.height = Math.max(3, Math.round(height * ms / top)) + "px"; }
    else bar.setAttribute("data-lost", "");
  });
}
function paintQuality(s) {
  const q = s.quality || {};
  const bars = $("q-bars"), sub = $("q-sub");
  const up = s.state === "connected" || s.state === "stalled";
  const samples = up ? (q.samples || []).slice(-30) : [];
  const d = L();
  // В «Диагностике» — те же замеры числами покрупнее и за все пять минут.
  const jitterBad = (q.jitter_ms || 0) >= 50, lossBad = (q.loss_pct || 0) >= 10;
  $("dq-ping").textContent = up && q.ping_ms ? q.ping_ms + d.ms : "—";
  $("dq-jitter").textContent = up && samples.length ? "±" + (q.jitter_ms || 0) + d.ms : "—";
  $("dq-loss").textContent = up && samples.length ? (q.loss_pct || 0) + "%" : "—";
  $("dq-jitter").toggleAttribute("data-bad", up && jitterBad);
  $("dq-loss").toggleAttribute("data-bad", up && lossBad);
  $("dq-when").textContent = up ? "" : d.qNoTunnel;
  if (openTab === "diag") paintQBars($("dq-bars"), up ? (q.samples || []) : [], 34);
  if (!samples.length) { bars.replaceChildren(); sub.textContent = ""; sub.removeAttribute("data-bad"); return; }
  paintQBars(bars, samples, 22);
  sub.textContent = d.qLine(q.jitter_ms || 0, q.loss_pct || 0);
  sub.toggleAttribute("data-bad", lossBad || jitterBad);
}

// paintRoute — как именно подключено: только то, что знает программа. Нет
// туннеля — строк нет, а не прошлое подключение.
function paintRoute(s) {
  const d = L(), c = conn || {};
  const up = s.state === "connected" || s.state === "stalled";
  const r = up ? s.route : null;
  const row = (k, v) => { const x = el("div", ""); x.append(el("span", "", k), el("b", "", v)); return x; };
  $("dg-where").replaceChildren(...(up && s.node ? [row(d.rServer, bare(s.node))] : []));
  if (!r) { $("dg-route").replaceChildren(); return; }
  const rows = [];
  const tname = (t) => d.rTransports[t] || (t || "").toUpperCase();
  if (r.protocol === "vp1") {
    rows.push(row(d.rProto, "VP1"), row(d.rTransport, tname(r.transport)));
  } else {
    rows.push(row(d.rProto, r.protocol.toUpperCase()));
    rows.push(row(d.rTransport, [tname(r.transport), r.security && r.security !== "none" ? (TRANSPORTS[r.security] || r.security.toUpperCase()) : ""].filter(Boolean).join(" · ")));
  }
  if (r.sni) rows.push(row(d.rSNI, r.sni + (r.spare_sni ? d.rSpare(r.spare_sni) : "")));
  if (r.fingerprint) rows.push(row(d.rFP, r.fingerprint + (r.protocol === "vp1" ? (r.fp_chosen ? d.rFPMine : d.rFPSeller) : "")));
  if (c.mtu_in_use) rows.push(row(d.rMTU, String(c.mtu_in_use)));
  if (c.dns_in_use) rows.push(row(d.rDNS, c.dns_in_use + (c.dns_secure_in_use ? d.rHTTPS : "")));
  if (c.fragment_in_use !== undefined) rows.push(row(d.rFrag, c.fragment_in_use ? d.rOn : d.rOff));
  if (c.ipv6_in_use !== undefined) rows.push(row(d.rIPv6, c.ipv6_in_use ? d.rOn : d.rOff));
  const box = $("dg-route");
  // Перерисовываем, только когда что-то поменялось: строки опрашиваются раз в
  // секунду, а выделять текст адреса человек может посреди опроса.
  const sig = rows.map((x) => x.textContent).join("|");
  if (box.dataset.sig === sig) return;
  box.dataset.sig = sig;
  box.replaceChildren(...rows);
}

// Шаги — в том же порядке, что у программы (diagSteps в diag.go); тест
// сверяет оба списка. Спрашиваем по одному: каждый шаг виден, как только
// ответил, а не все разом через полминуты.
const DIAG_STEPS = ["net", "dns", "node", "tunnel", "system", "where", "leak", "sites", "interference"];
const DIAG_DNS = ["1.1.1.1", "8.8.8.8", "9.9.9.9", "94.140.14.14"];
const upNow = () => !!lastStatus && (lastStatus.state === "connected" || lastStatus.state === "stalled");

// reconnectNow — туннель заново с выбранным сейчас. Без туннеля — просто
// подключиться: «переподключать» нечего.
async function reconnectNow(button, said) {
  button.disabled = true;
  $(said).textContent = "…";
  try {
    if (upNow()) render(await api("POST", "api/reconnect"));
    else await api("POST", "api/connect");
    $(said).textContent = L().diagDone;
    await tick();

    $(said).textContent = e.message;

}

// DIAG_DO — что делает каждая кнопка шага. Ключи — те же коды, что отдаёт
// программа (diagActs); кода без действия здесь быть не должно, и тест это
// сверяет: нарисованная кнопка — это обещание.
const DIAG_DO = {
  fix: async (b, said) => {
    const r = await api("POST", "api/fix");
    render(r.state);
    $(said).textContent = (r.done || []).join("; ");
  },
  nodes: async () => { document.querySelector('.tab[data-tab="nodes"]').click(); },
  fragment: async (b, said) => {
    if (await changeConn(b, { fragment: true }, said) && upNow()) await reconnectNow(b, said);
    else $(said).textContent = L().diagDone;
  },
  dns: async (b, said) => {
    const now = conn && conn.dns, next = DIAG_DNS[(DIAG_DNS.indexOf(now) + 1) % DIAG_DNS.length];
    if (await changeConn(b, { dns: next }, said) && upNow()) await reconnectNow(b, said);
    $(said).textContent = "DNS " + next + " · " + L().diagDone;
  },
  reconnect: (b, said) => reconnectNow(b, said),
  connect: async (b, said) => { await api("POST", "api/connect"); $(said).textContent = L().diagDone; await tick(); },
  // Kill switch закрывает всё, что идёт мимо туннеля, — то самое, что
  // нашёл шаг утечки. Действует с переподключения.
  killswitch: async (b, said) => {
    if (await changeConn(b, { kill_switch: true }, said) && upNow()) await reconnectNow(b, said);
    else $(said).textContent = L().diagDone;
  },
  proxy: async (b, said) => {
    const after = await api("POST", "api/proxy/off");
    render(after);
    $(said).textContent = after.proxy ? L().proxyEnv : L().proxyGone;
  },
};

function diagValue(s) {
  const d = L();
  switch (s.id) {
    case "net": case "dns": return s.ms ? s.ms + d.ms : "";
    case "node": return s.of ? d.diagOf(s.n || 0, s.of) + (s.ms ? " · " + d.diagBest(s.ms) : "") : "";
    case "where": return s.ip ? s.ip + (s.country ? " · " + (regionName(s.country.toUpperCase()) || s.country.toUpperCase()) : "") : "";
    case "leak": return s.st === "ok" ? d.leakNone : "";
    case "sites": return s.of ? d.diagOf(s.n || 0, s.of) : "";
    case "interference": return s.st === "ok" ? d.diagNone : "";
  }
  return "";
}

let diagSeq = 0;
function diagRow(id) {
  const li = el("li", "dstep");
  li.dataset.st = "run";
  li.dataset.id = id;
  li.append(el("span", "ico"), el("span", "t", L().diagStep[id].t), el("span", "v", ""), el("span", "say", ""), el("span", "acts", ""));
  return li;
}
function paintDiagStep(li, s) {
  const d = L(), words = d.diagStep[s.id];
  li.dataset.st = s.st;
  li.querySelector(".ico").textContent = d.diagSt[s.st] || "";
  li.querySelector(".v").textContent = diagValue(s) || (s.st === "off" && ["system", "where", "sites"].includes(s.id) ? d.diagNeedUp : "");
  const said = words[s.st];
  const lines = [typeof said === "function" ? said(s) : said || ""].concat(s.detail || []).filter(Boolean);
  li.querySelector(".say").textContent = lines.join(" · ");
  const acts = li.querySelector(".acts");
  const msg = el("span", "said", "");
  msg.id = "dg-msg-" + s.id;
  acts.replaceChildren(...(s.act || []).filter((a) => DIAG_DO[a]).map((a, i) => {
    const b = el("button", "chip" + (i === 0 ? " lead-act" : ""), d.diagAct[a]);
    b.type = "button";
    b.addEventListener("click", async () => {
      b.disabled = true;
      try { await DIAG_DO[a](b, msg.id); } catch (e) { msg.textContent = e.message; } finally { b.disabled = false; }
    });
    return b;
  }));
  if (acts.children.length) acts.append(msg);
}

async function runDiag() {
  const d = L(), seq = ++diagSeq;
  const btn = $("diag-run"), list = $("diag-steps"), sum = $("diag-sum");
  btn.disabled = true;
  $("diag-after").hidden = true;
  sum.hidden = false;
  sum.dataset.st = "run";
  $("diag-sum-text").textContent = d.diagRunning;
  list.replaceChildren();
  const results = [];
  for (const id of DIAG_STEPS) {
    const li = diagRow(id);
    list.append(li);
    let s;
    try { s = await api("POST", "api/diag", { step: id }); } catch (e) { s = { id, st: "bad", detail: [e.message] }; }
    // Пустой ответ — программа старее окна и шага не знает: пропуск, а не
    // оборванная на полпути проверка.
    if (!s || !s.st) s = { id, st: "off" };
    if (seq !== diagSeq) return;
    results.push(s);
    paintDiagStep(li, s);
  }
  const bad = results.filter((s) => s.st === "bad" || s.st === "warn").length;
  sum.dataset.st = results.some((s) => s.st === "bad") ? "bad" : bad ? "warn" : "ok";
  $("diag-sum-text").textContent = bad ? d.diagFound(bad) : d.diagAllOk;
  btn.textContent = d.diagAgain;
  btn.disabled = false;
  $("diag-after").hidden = false;
}

      for (const t of tri) {
        const cx = (t[0][0] + t[1][0] + t[2][0]) / 3, cy = (t[0][1] + t[1][1] + t[2][1]) / 3;
        const k = Math.min(1, Math.max(0, (cx / 1600) * 0.6 + (cy / 1000) * 0.5 - 0.15 + (r() - 0.5) * 0.18));

      [["#6c5f8d", 600, 230], ["#45475a", 730, 170], ["#1e1e2e", 870, 120]],

      + '<path d="M0 260 C 300 160, 600 360, 900 220 S 1400 300, 1600 180" stroke="#8fbcbb" stroke-width="70" fill="none"/>'
      + '<path d="M0 340 C 400 260, 700 420, 1000 300 S 1450 380, 1600 280" stroke="#a3be8c" stroke-width="40" fill="none"/>'
      + '<path d="M200 200 C 500 120, 900 260, 1300 140" stroke="#b48ead" stroke-width="30" fill="none"/></g>';
    return mountains([["0", "#232831"], [".6", "#2e3440"], ["1", "#4c566a"]],

  // Солнце с прорезями над сеткой — тёплый ретро в цветах Gruvbox.

    for (let i = 0; i <= 16; i++) grid += '<line x1="' + (800 + (i - 8) * 60) + '" y1="740" x2="' + (800 + (i - 8) * 260) + '" y2="1000" stroke="#504945" stroke-width="2"/>';
    for (let i = 0; i < 6; i++) grid += '<line x1="0" x2="1600" y1="' + (750 + i * i * 9) + '" y2="' + (750 + i * i * 9) + '" stroke="#504945" stroke-width="2"/>';
    return svg("<defs>" + lin("b", 'x1="0" y1="0" x2="0" y2="1"', [["0", "#1d2021"], [".7", "#32302f"], ["1", "#282828"]])
      + lin("sun", 'x1="0" y1="0" x2="0" y2="1"', [["0", "#fabd2f"], [".55", "#fe8019"], ["1", "#fb4934"]]) + "</defs>"
      + '<rect width="1600" height="1000" fill="url(#b)"/><circle cx="800" cy="600" r="270" fill="url(#sun)"/>' + cuts
      + '<rect y="740" width="1600" height="260" fill="#1d2021"/>' + grid);
  }
  const make = {
    bloom: () => bloom(false), bloomLight: () => bloom(true), waves: () => waves(false), wavesLight: () => waves(true),

// Поля точной настройки и их значения по умолчанию. Цвета null — «из темы».
const O_DEFAULTS = {
  bg: null, surf: null, fg: null, dim: null, line: null,
  r: null, pad: null, gap: null, glow: null, blur: 0, calpha: 100,
  font: "onest", sfont: "same", nums: "mono", caps: false, statusSize: 32,
  pattern: "grid", pcolor: null, amount: 60, pstep: 0, psize: 100, pspeed: 100,
  logo: "metal",
  // Обои рабочего стола в «Прозрачной»: почти без размытия — их видно, —
  // и чуть темнее, чтобы читались панели.
  wblur: 2, wdim: 25,
  // Что под окном в «Прозрачной»: картинка обоев или сквозное окно.
  desk: "wall",
};
const O_CHOICES = {
  font: ["onest", "manrope", "unbounded", "mono", "system", "serif", "inter", "noto", "ubuntu", "segoe", "tahoma", "mssans"],
  sfont: ["same", "onest", "manrope", "unbounded", "mono", "system", "serif", "inter", "noto", "ubuntu", "segoe", "tahoma", "mssans"],
  nums: ["mono", "text", "status", "dot"],
  pattern: ["none", "grid", "matrix", "tiles", "stripes", "mesh", "scan"],
  logo: ["metal", "tint"],
  desk: ["wall", "through"],
};
const O_RANGES = {
  r: [0, 32], pad: [8, 28], gap: [4, 24], glow: [0, 100], blur: [0, 32], calpha: [30, 100],
  statusSize: [20, 46], amount: [0, 100], wblur: [0, 40], wdim: [0, 85], pstep: [0, 64], psize: [40, 220], pspeed: [0, 300],
};
const O_COLORS = ["bg", "surf", "fg", "dim", "line", "pcolor"];
const FONTS = {
  onest: 'Onest, "Segoe UI", system-ui, sans-serif',
  manrope: 'Manrope, Onest, "Segoe UI", sans-serif',
  unbounded: 'Unbounded, Onest, sans-serif',
  mono: '"JetBrains Mono", ui-monospace, Consolas, monospace',
  system: '"Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif',
  serif: 'Spectral, Georgia, "Times New Roman", serif',
  inter: 'Inter, "Segoe UI", system-ui, sans-serif',
  noto: '"Noto Sans", "Segoe UI", sans-serif',
  ubuntu: 'Ubuntu, "Segoe UI", sans-serif',
  segoe: '"Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif',
  tahoma: 'Tahoma, Verdana, "Segoe UI", sans-serif',
  mssans: '"Microsoft Sans Serif", Tahoma, Arial, sans-serif',
};
const VIBE_KEY = "marvia-vibe";
const MOTIONS = ["off", "calm", "lively"];
const isHexColor = (v) => typeof v === "string" && /^#[0-9a-f]{6}$/i.test(v);
const has = (t, k) => Object.prototype.hasOwnProperty.call(t, k);

// normO отбрасывает из своих настроек всё чужое: код темы приходит от
// других людей, а битое поле не должно уронить окно или протащить в CSS
// что-то, кроме цвета и числа.
function normO(raw) {
  const out = {};
  const v = raw && typeof raw === "object" ? raw : {};
  for (const k of Object.keys(O_DEFAULTS)) {
    const x = v[k];
    if (x === undefined || x === null) continue;
    if (O_COLORS.includes(k)) { if (isHexColor(x)) out[k] = x.toLowerCase(); }
    else if (has(O_CHOICES, k)) { if (O_CHOICES[k].includes(x)) out[k] = x; }
    else if (k === "caps") { if (typeof x === "boolean") out[k] = x; }
    else if (has(O_RANGES, k)) {
      const [lo, hi] = O_RANGES[k];
      if (typeof x === "number" && isFinite(x)) out[k] = Math.round(Math.min(hi, Math.max(lo, x)));
    }
  }
  return out;
}

function loadVibe() {
  let v = {};
  try { v = JSON.parse(localStorage.getItem(VIBE_KEY)) || {}; } catch (_) { /* испорченное — с нуля */ }
  const renamed = has(VIBE_RENAMED, v.id);
  return {
    id: renamed ? VIBE_RENAMED[v.id] : has(VIBES, v.id) ? v.id : "graphite",
    renamed,
    motion: MOTIONS.includes(v.motion) ? v.motion : "calm",
    splash: v.splash !== false,
    sound: v.sound === true,
    // Настройки прежнего образа к новому не подходят: его цвета легли бы
    // поверх чужой палитры.
    o: renamed ? {} : normO(v.o),
  };
}
// var, а не let: вкладку «Тема» страница рисует при запуске раньше, чем
// доходит до этого места, и обращение к let до объявления роняло весь скрипт.
var vibe = loadVibe();
function saveVibe() {
  try { localStorage.setItem(VIBE_KEY, JSON.stringify(vibe)); } catch (_) { /* не запомнится — не беда */ }
}

// eff — действующее значение поля: своё, иначе образа, иначе общее.
function eff(k) {
  if (has(vibe.o, k)) return vibe.o[k];
  const own = VIBES[vibe.id].o;
  return has(own, k) ? own[k] : O_DEFAULTS[k];
}

// Движение выключено системой — значит, выключено и у нас, что бы ни стояло
// в настройке: человеку от него плохо, а не скучно.
const reducedMotion = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
const motion = () => (reducedMotion() ? "off" : vibe.motion);

// Код окна: общий код темы (его понимают панель и телефон) и после «~» —
// образ и все поля точной настройки. Друг вставляет код и получает то же
// окно, а не только те же цвета.
function b64url(s) { return btoa(unescape(encodeURIComponent(s))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); }
function unb64url(s) { return decodeURIComponent(escape(atob(s.replace(/-/g, "+").replace(/_/g, "/")))); }
function fullCode() { if (!vibe) return Look.encode(look); return Look.encode(look) + "~" + b64url(JSON.stringify({ i: vibe.id, o: vibe.o })); }
function applyCode(code) {
  const st = Look.decode(code);
  if (!st) return false;
  const tail = String(code).trim().split("~")[1];
  if (tail) {
    let extra = null;
    try { extra = JSON.parse(unb64url(tail)); } catch (_) { return false; }
    if (!extra) return false;
    const id = has(VIBE_RENAMED, extra.i) ? VIBE_RENAMED[extra.i] : extra.i;
    if (!has(VIBES, id)) return false;
    vibe.id = id;
    vibe.o = normO(extra.o);
    saveVibe();
  }
  setLook(st);
  applyVibe();
  return true;
}

// ── свои значения поверх темы ──
//
// Тема (look.js) считает цвета и контраст. Точная настройка позволяет
// заменить любой из них руками — тогда ответственность за читаемость на
// человеке, и мы не спорим. Пустые поля темы не трогают.
function rgbOf(hex) {
  const v = hex.replace("#", "");
  return [0, 2, 4].map((i) => parseInt(v.slice(i, i + 2), 16));
}
function alphaOf(hex, a) { return "rgba(" + rgbOf(hex).join(",") + "," + a + ")"; }
function overrideCss(t) {
  // Цвета — свои или образа: у образов в духе систем палитра своя, точная,
  // а не выведенная из пресета.
  const o = {}, out = [];
  for (const k of O_COLORS) { const v = eff(k); if (v) o[k] = v; }
  const V = VIBES[vibe.id], wall = backdropURL ? "" : WALLS.url(V.wall);
  const acc = t.acc;
  const surf = o.surf || t.surf;
  if (o.bg) out.push("--bg:" + o.bg, "--shade:" + Look.mix(o.bg, "#000000", 0.45));
  if (wall) {
    // Обои — под всем окном, пелена образа держит читаемость. Слюде Windows 11
    // нужна та же картинка размытой — отдельным слоем.
    out.push("--bgcss:" + wall + " center / cover no-repeat," + (o.bg || t.bg),
      "--wallImg:" + wall, "--wallVeil:" + (V.veil || "transparent"));
  } else if (o.bg && !backdropURL) {
    out.push("--bgcss:radial-gradient(130% 100% at top left," + Look.mix(o.bg, "#ffffff", 0.07) + " 0%," + o.bg + " 48%," + Look.mix(o.bg, "#000000", 0.45) + " 100%)");
  }
  if (V.tile) out.push("--tileA:" + V.tile[0], "--tileB:" + V.tile[1]);
  if (o.surf) out.push("--surf:" + o.surf, "--surf2:" + Look.mix(o.surf, o.fg || t.fg, 0.08));
  if (o.fg) out.push("--fg:" + o.fg);
  if (o.dim) out.push("--dim:" + o.dim);
  if (o.line) out.push("--line:" + o.line, "--cardLine:" + (t.card === "flat" ? "transparent" : o.line));
  // Карточка: тот же отлив, что у темы, но от своей поверхности и со своей
  // непрозрачностью — полупрозрачная пускает под себя узор и стекло.
  const ca = eff("calpha") / 100;
  if (o.surf || ca < 1) {
    const paint = (c) => (ca < 1 ? alphaOf(c, ca) : c);
    const a = t.card === "flat" ? surf : Look.mix(surf, acc, t.dark ? 0.065 : 0.025);
    out.push("--cardBg:linear-gradient(135deg," + paint(a) + "," + paint(surf) + ")");
    out.push("--featureBg:linear-gradient(135deg," + paint(Look.mix(surf, acc, t.dark ? 0.18 : 0.10)) + "," + paint(surf) + ")");
  }
  // Размеры — свои или образа: у образа свой силуэт, а не только цвет.
  for (const k of ["r", "pad", "gap"]) if (eff(k) != null) out.push("--" + k + ":" + eff(k) + "px");
  if (eff("glow") != null) {

    out.push("--glow:" + (g <= 0 ? "none" : "0 0 " + Math.round(36 * g) + "px " + alphaOf(acc, (0.25 + g * 0.55).toFixed(2))));
  }

  out.push("--glassFilter:" + (blur > 0 ? "blur(" + blur + "px) saturate(1.25)" : "none"));
  const font = FONTS[eff("font")], sfont = eff("sfont") === "same" ? font : FONTS[eff("sfont")];
  const nums = eff("nums");
  out.push("--uiFont:" + font, "--statusFont:" + sfont,
    "--numFont:" + (nums === "text" ? font : nums === "status" ? sfont : FONTS.mono),
    "--statusSize:" + eff("statusSize") + "px",
    "--statusCase:" + (eff("caps") ? "uppercase" : "none"),
